<!DOCTYPE html>

<title>ぱぱっと Step05 H2_2</title>

<body>
<textarea readonly id="content" style="width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word;">
<h2>良い口コミ・評判で確認できた3点</h2>

確認できた良い材料は、計算の透明さ・受付体制・プライバシー配慮の3点です。

いずれもレビュー経由の紹介として整理します。

<h3>計算どおり8,850円の入金報告</h3>

<strong>1万円の申込で8,850円が入金されたという、計算どおりの報告があります。</strong>

90%適用の9,000円から手数料150円を引くと、ちょうど8,850円になるためです。

消費税やシステム利用料のような不明瞭な差引がないという紹介と、数字が一致します。

掲示と入金額の計算が合うかは、良い判断材料です。

<h3>24時間365日のスマホ完結</h3>

<strong>受付は24時間365日で、手続きはスマホだけで完結します。</strong>

深夜や土日の急な出費でも、申込自体は止まらないためです。

申込にかかる時間は、掲示で3分ほど。

振込の反映は時間帯で変わるため、余裕を持って動きましょう。

<h3>郵送物や職場連絡なしの配慮</h3>

<strong>自宅への郵送物や職場への連絡がないという配慮も紹介されています。</strong>

利用を周囲に知られたくない人にとって、心理的なハードルを下げるためです。

本人確認は書類の提出で完結し、来店の工程はありません。

提出書類は、申込前に手元に用意しておきましょう。

一方で、良い材料だけを見て決めるのは早計です。

次は気になる指摘を確認します。
</textarea>
<button id="copyBtn" style="margin-top: 10px; padding: 8px 24px; font-size: 14px; cursor: pointer;">コピー</button>
<script>
document.getElementById('copyBtn').addEventListener('click', function() {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
