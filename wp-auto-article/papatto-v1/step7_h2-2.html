<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>良い口コミ・評判で確認できた3点</h2>

確認できた良い材料は、計算の透明さ・受付体制・プライバシー配慮の3点です。

いずれもレビュー経由の紹介として整理します。

<h3>計算どおり8,850円の入金報告</h3>

<span class="st-mymarker-s"><strong>1万円の申込で8,850円が入金されたという、計算どおりの報告があります。</strong></span>

90%適用の9,000円から手数料150円を引くと、ちょうど8,850円になるためです。

消費税やシステム利用料のような不明瞭な差引がないという紹介と、数字が一致します。

掲示と入金額の計算が合うかは、良い判断材料です。

[st-kaiwa1 r]90%から150円引きの計算どおり。ここは分かりやすいですね。[/st-kaiwa1]

<h3>24時間365日のスマホ完結</h3>

<span class="st-mymarker-s"><strong>受付は24時間365日で、手続きはスマホだけで完結します。</strong></span>

深夜や土日の急な出費でも、申込自体は止まらないためです。

申込にかかる時間は、掲示で3分ほど。

振込の反映は時間帯で変わるため、余裕を持って動きましょう。

<h3>郵送物や職場連絡なしの配慮</h3>

<strong>自宅への<span class="st-mymarker-s">郵送物や職場への連絡がない</span>という配慮も紹介されています。</strong>

利用を周囲に知られたくない人にとって、心理的なハードルを下げるためです。

本人確認は書類の提出で完結し、来店の工程はありません。

提出書類は、申込前に手元に用意しておきましょう。

[st-mybox title="こんな方に向いています" webicon="st-svg-check-circle" color="#757575" bordercolor="#BDBDBD" bgcolor="#ffffff" borderwidth="2" borderradius="5" titleweight="bold" fontsize="" myclass="st-mybox-class" margin="25px 0 25px 0"]
<div class="maruck">
<ul>
<li>受取額を事前に計算して決めたい方</li>
<li>深夜や土日に申し込みたい方</li>
<li>郵送物や職場連絡を避けたい方</li>
</ul>
</div>
[/st-mybox]

一方で、良い材料だけを見て決めるのは早計です。

次は気になる指摘を確認します。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
