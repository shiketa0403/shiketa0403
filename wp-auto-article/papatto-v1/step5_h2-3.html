<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ぱぱっと Step05 H2_3</title>
</head>
<body>
<textarea readonly id="content" style="width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word;">
<h2>悪い口コミ・評判で目立つ3つの指摘</h2>

気になる点は、声の少なさ・率の限定・対応枠の変動の3つです。

いずれも申込前の確認で対処できます。

<h3>口コミの数自体が少ない</h3>

<strong>ぱぱっとは口コミの数自体が少なく、判断材料が限られています。</strong>

名前が一般的な言葉で、固有の投稿や記事が埋もれやすいためです。

検索で目立つのは、同名のパパ活アプリの評判記事。

情報が少ない前提で、確認できた事実を軸に判断しましょう。

<h3>一律90%は5回目までの限定</h3>

<strong>一律90%の保証は、初回から5回目までの限定という紹介です。</strong>

6回目以降は、同じ条件が続くとは限らないためです。

継続利用の予定があるなら、条件の切り替わりを先に確かめる価値があります。

その回に適用される率を、申込のたびに確認しましょう。

<h3>ペイディは停止表示という現状</h3>

<strong>ペイディは、公式サイトで「現在ご利用いただけません」と停止表示されています。</strong>

レビューには対応の紹介もあり、時期によって対応枠が変わっているためです。

対応ブランドの表示は、申込時点の公式サイトが基準です。

自分の使いたい枠が対象かを、査定で確かめてから進めましょう。

ここまでの整理を踏まえて、では知恵袋や5chに生の投稿はあるのでしょうか。
</textarea>
<button id="copyBtn" style="margin-top: 10px; padding: 8px 24px; font-size: 14px; cursor: pointer;">コピー</button>
<script>
document.getElementById('copyBtn').addEventListener('click', function() {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
