<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>申込前に知るべき3つの注意点</h2>

申込を決める前に、率の扱い・営業時間・規約の3点を押さえておきましょう。

特に3つ目は、現金化サービス全体に共通する重要な注意点です。

<h3>紹介の90%は公式の約束でない</h3>

<span class="st-mymarker-s"><strong>紹介にある初回90%・2回目以降80%は、公式の約束ではありません。</strong></span>

<span class="hutoaka">公式サイトに率の掲示がなく</span>、査定で金額が決まる方式のためです。

頼れるのは、媒体の数字より自分あての査定額。

査定の文面を保存し、受取額で判断しましょう。

<h3>査定・振込は9〜19時が対応枠</h3>

<strong>査定と振込の対応枠は、9時から19時までです。</strong>

申込自体は24時間でも、<span class="hutoaka">金額確定と振込は営業時間内に限られる</span>ためです。

月曜は定休で、毎月1日だけは0時から23時59分まで対応します。

<span class="st-mymarker-s">受け取りたい日から逆算して</span>、申込の時刻を決めましょう。

[st-kaiwa1 r]率より受取額の実額が基準。査定の文面を残すと安心ですね。[/st-kaiwa1]

<h3>カード会員規約上の禁止行為</h3>

<span class="st-mymarker-s"><strong>クレジットカード枠の現金化は、カード会員規約上の禁止行為に該当します。</strong></span>

カード会社の規約で「換金目的の利用」が明示的に禁止されているからです。

発覚した場合、カードの<span class="hutoaka">利用停止や強制解約</span>につながるおそれがあります。

日本クレジット協会も、ショッピング枠の現金化を利用しないよう注意を呼びかけています。

メルペイやd払いにも換金目的を禁じる規約があるため、後払いアプリでの利用も同じリスクを踏まえて判断しましょう。

[st-mybox title="注意ポイント" webicon="st-svg-exclamation-circle" color="#ef5350" bordercolor="#ef9a9a" bgcolor="#ffebee" borderwidth="2" borderradius="5" titleweight="bold" fontsize="" myclass="st-mybox-class" margin="25px 0 25px 0"]
<div class="maruck">
<ul>
<li>紹介の90%は公式の約束でない</li>
<li>査定・振込は9〜19時(月曜定休)</li>
<li>現金化はカード会員規約上の禁止行為</li>
</ul>
</div>
[/st-mybox]

注意点を踏まえて使うと決めたら、残る疑問は具体的な手順です。

申込から振込までの流れを見ていきましょう。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
