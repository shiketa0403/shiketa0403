<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>申込から振込までの手順</h2>

換金ナウの手続きは、公式サイトの申込フォームから始まります。

流れは申込・査定・振込の3段階です。

[st-timeline myclass="st-timeline-count" add_style=""]
[st-timeline-list text="申込フォームで申込" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
[/st-timeline-list]
[st-timeline-list text="買取査定・金額確定(通常30分程度)" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
[/st-timeline-list]
[st-timeline-list text="査定額を文面で確認・承諾" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
[/st-timeline-list]
[st-timeline-list text="お振込み(確認後、通常30分程度)" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
[/st-timeline-list]
[/st-timeline]

<h3>申込フォームと必要情報</h3>

<span class="st-mymarker-s"><strong>最初のステップは、申込フォームの入力です。</strong></span>

買取プラン・金額・口座情報・本人確認書類を送ると、査定に進みます。

本人確認(KYC)は、不正利用やなりすまし対策としての位置づけ。

書類を手元に用意してから、フォームに進みましょう。

[st-kaiwa1]初回は本人確認書類を手元に。準備しておくと止まりません。[/st-kaiwa1]

<h3>買取査定と金額確定の連絡</h3>

<strong>申込の内容をもとに、買取査定と金額の確定が行われます。</strong>

通常30分程度で、メールかLINEで金額の連絡が届く案内のためです。

この査定額が、受取額を判断する<span class="hutoaka">唯一の公式回答</span>です。

金額に納得できない場合は、<span class="st-mymarker-s">この時点で立ち止まり</span>ましょう。

<h3>振込までの時間目安</h3>

<span class="st-mymarker-s"><strong>振込は、金額確定の確認後、通常30分程度という案内です。</strong></span>

査定30分程度と振込30分程度を合わせた、目安の計算のためです。

<table>
<thead><tr><th>項目</th><th>内容</th></tr></thead>
<tbody>
<tr><td>申込</td><td>WEBフォーム(24時間受付)</td></tr>
<tr><td>査定</td><td>通常30分程度・メールかLINE</td></tr>
<tr><td>振込</td><td>確認後、通常30分程度</td></tr>
<tr><td>対応枠</td><td>9〜19時・月曜定休(毎月1日は終日)</td></tr>
</tbody>
</table>

時間を左右するのは、<span class="hutoaka">申込の時刻と営業時間の枠</span>。

19時の締めから逆算して、余裕を持って申し込みましょう。

最後に、この記事の調査結果を整理します。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
