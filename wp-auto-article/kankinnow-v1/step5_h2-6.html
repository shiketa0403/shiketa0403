<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>換金ナウ Step05 H2_6</title>
</head>
<body>
<textarea readonly id="content" style="width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word;">
<h2>申込から振込までの手順</h2>

換金ナウの手続きは、公式サイトの申込フォームから始まります。

流れは申込・査定・振込の3段階です。

<h3>申込フォームと必要情報</h3>

最初のステップは、申込フォームの入力です。

買取プラン・金額・口座情報・本人確認書類を送ると、査定に進みます。

本人確認(KYC)は、不正利用やなりすまし対策としての位置づけ。

書類を手元に用意してから、フォームに進みましょう。

<h3>買取査定と金額確定の連絡</h3>

申込の内容をもとに、買取査定と金額の確定が行われます。

通常30分程度で、メールかLINEで金額の連絡が届く案内のためです。

この査定額が、受取額を判断する唯一の公式回答です。

金額に納得できない場合は、この時点で立ち止まりましょう。

<h3>振込までの時間目安</h3>

振込は、金額確定の確認後、通常30分程度という案内です。

査定30分程度と振込30分程度を合わせた、目安の計算のためです。

時間を左右するのは、申込の時刻と営業時間の枠。

19時の締めから逆算して、余裕を持って申し込みましょう。

最後に、この記事の調査結果を整理します。
</textarea>
<button id="copyBtn" style="margin-top: 10px; padding: 8px 24px; font-size: 14px; cursor: pointer;">コピー</button>
<script>
document.getElementById('copyBtn').addEventListener('click', function() {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
