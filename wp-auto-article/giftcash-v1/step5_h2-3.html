<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>悪い口コミ・評判で目立つ3つの指摘</h2>

目立つ指摘は、率の差・口コミの信頼性・対応のばらつきの3つです。

内容をそのまま紹介します。

<h3>実際は75%前後だったという声</h3>

「実際の率は75%前後だった」という声の紹介があります。

公式サイト記載の率より低かった、という実体験の報告があるからです。

10万円なら、90%と75%で手取りに1万5000円の差。

適用される率は、申込時の見積もりで確認しましょう。

<h3>高率の口コミはサクラという指摘</h3>

「高換金率の口コミはサクラ投稿に見える」という指摘があります。

極端に良い声と、率への不満の声の差が大きいからです。

5chにも業者のステマが混ざるという注意がレビュー側にあります。

極端な高評価は除いて、真ん中の声を参考にしましょう。

<h3>返答が遅い・高圧的という声</h3>

「問い合わせへの返答が遅い」「高圧的だった」という声の紹介があります。

担当者や混雑によって、対応に差が出るからです。

「丁寧だった」という逆の声も、同じように紹介されています。

違和感があれば、決済前の段階で立ち止まりましょう。

では、知恵袋や5chには実際にどんな投稿があるのでしょうか。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
