<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>申込から振込までの手順</h2>

ファストライフの手続きは、公式サイトの申込フォームから始まります。

流れは申込・見積もり・決済・振込の順です。

[st-timeline myclass="st-timeline-count" add_style=""]
[st-timeline-list text="申込フォームで申込" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
[/st-timeline-list]
[st-timeline-list text="プラン・見積もりを文面で確認" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
[/st-timeline-list]
[st-timeline-list text="カードや後払いアプリの枠で決済" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
[/st-timeline-list]
[st-timeline-list text="お振込み(プランにより最短5分〜商品到着後)" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
[/st-timeline-list]
[/st-timeline]

<h3>申込と見積もりの文面確認</h3>

<span class="st-mymarker-s"><strong>最初のステップは、申込フォームの送信とプラン・見積もりの確認です。</strong></span>

提示額に納得してから進めば、<span class="hutoaka">受取額のずれ</span>を防げます。

確認したいのは、選んだプランと手数料込みの振込額。

見積もりの内容は、文面で受け取ってから決めましょう。

<h3>カード決済の手続き</h3>

<strong>見積もりに納得したら、案内に沿ってカードや後払いアプリの枠で指定商品を決済します。</strong>

決済の確認をもって、振込の手続きに進む方式のためです。

専属の担当者が対応するため、疑問点はその場で質問できます。

不明点は、<span class="st-mymarker-s">決済前に確かめて</span>から進みましょう。

[st-kaiwa1]専属担当への質問は遠慮なく。記録は文面で残すと安心です。[/st-kaiwa1]

<h3>振込までの時間目安</h3>

<span class="st-mymarker-s"><strong>スピード入金プランは最短5分、高額振込プランは商品到着後の入金です。</strong></span>

選んだプランで、入金までの流れ自体が変わるためです。

<table>
<thead><tr><th>項目</th><th>内容</th></tr></thead>
<tbody>
<tr><td>申込</td><td>公式サイトのWEBフォーム</td></tr>
<tr><td>決済</td><td>カード・後払いアプリの枠</td></tr>
<tr><td>振込</td><td>スピード=最短5分・高額=商品到着後</td></tr>
<tr><td>受付</td><td>年中無休9:00〜21:00の紹介</td></tr>
</tbody>
</table>

時間を左右するのは、<span class="hutoaka">プランの選択と申込の時間帯</span>。

受付は21時までのため、当日中の入金を狙う日は早めに申し込みましょう。

最後に、この記事の調査結果を整理します。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
