この記事では、Yahoo!知恵袋・5ch・レビューサイトを実際に検索して、確認できた情報を整理しました。

<span class="st-mymarker-s">結論として、振り込まれない被害の報告は見当たらず、率は速さ重視90〜95%・率重視91〜98%の2プラン制でした。</span>

良い口コミでは、振込の速さや完全専属担当制の丁寧なサポートが紹介されています。

一方で「割高な借入れのような気分」という体験談もあり、決済手数料は利用者負担という解説もあります。

読み終える頃には、2プランの選び方と、申込前に確認すべきポイントがわかります。
