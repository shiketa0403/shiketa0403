<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>即クレくんの口コミ・評判まとめ</h2>

即クレくんは、クレジットカード現金化を専門とするサービスです。

[st-mybox title="ポイント" webicon="st-svg-check-circle" color="#FFD54F" bordercolor="#FFD54F" bgcolor="#FFFDE7" borderwidth="2" borderradius="5" titleweight="bold" fontsize="" myclass="st-mybox-class" margin="25px 0 25px 0"]
<div class="maruck">
<ul>
<li>被害報告も第三者の口コミも見当たらず</li>
<li>最大99%・最短3分・事故0件は自己申告の掲示</li>
<li>最短3分は本人確認不要の2回目以降</li>
<li>条件開示: kyash非対応・枠3万円以下不可</li>
<li>申込みは振込額と時期の文面確認後に判断</li>
</ul>
</div>
[/st-mybox]

調査の範囲では、被害報告だけでなく第三者の口コミ自体が見当たりませんでした。

公式サイトは最大99%・最短3分・事故0件を掲示していますが、いずれも自己申告の掲示で、外部の裏づけはまだない段階です。

一方で、申込みフォームが条件（kyash非対応・枠残高3万円以下不可）を先に開示している点は確認材料に使えます。

申し込むかどうかは、提示された振込額と時期を文面で確かめてから判断しましょう。

申込みフォームの入力は24時間受け付けています。

公式サイトで条件の注記を確かめたうえで、判断してください。

[st-mcbutton url="https://soku-cre.jp/" title="今すぐ申し込む" rel="" webicon="" target="" color="#fff" bgcolor="#e53935" bgcolor_top="#f44336" bordercolor="#e57373" borderwidth="1" borderradius="10" fontweight="bold" fontsize="120" width="90" webicon_after="st-svg-chevron-right" shadow="#c62828" ref="on" mcbox_bg="#fafafa" mcbox_color="" mcbox_title="最大99%を掲示・受付24時間" beacon=""]※申込みフォームの入力は24時間受け付け[/st-mcbutton]
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
