<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>

<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>即クレくん利用前の3つの注意点</h2>

申込み前に押さえておきたい注意点は、時間計画・文面確認・規約リスクの3つです。

どれも申込み後には取り返しがつきにくい項目です。

<h3>最短3分を前提にしない時間計画</h3>

<span class="st-mymarker-s"><strong>「最短3分」を前提にした、ぎりぎりの時間計画は避けましょう。</strong></span>

初回は本人確認があり、<span class="hutoaka">混雑や時間帯によって所要時間が変わる</span>可能性があるためです。

支払い期日が迫っている場合に確かめるのは、初回かどうかと、振込までの目安時間の2点。

期日から逆算して間に合うかを、申込み前に確認しましょう。

<h3>振込額と時期の文面確認</h3>

<span class="st-mymarker-s"><strong>申込み前に、振込額と振込時期をやり取りの文面で残しましょう。</strong></span>

掲示と提示の差が出たとき、文面がなければ<span class="hutoaka">確かめる手段がなくなる</span>ためです。

確認する項目は<strong>「振込額は円でいくらか」「いつ振り込まれるか」「手数料の有無」</strong>の3点です。

提示額に納得してから決済に進めば、受取額の食い違いを防げます。

[st-kaiwa1 r]提示額と時期の文面さえ残せば、あとから確かめる手段が持てますよ。[/st-kaiwa1]

<h3>カード会員規約上の禁止行為</h3>

<span class="st-mymarker-s"><strong>クレジットカードの現金化は、規約で禁止された行為です。</strong></span>

カード会社の規約で「換金目的の利用」が明示的に禁止されているからです。

発覚すれば<span class="hutoaka">利用停止や強制解約、残債の一括請求</span>につながる場合があります。

業者選び以前のリスクとして、理解した上で判断しましょう。

[st-mybox title="注意ポイント" webicon="st-svg-exclamation-circle" color="#ef5350" bordercolor="#ef9a9a" bgcolor="#ffebee" borderwidth="2" borderradius="5" titleweight="bold" fontsize="" myclass="st-mybox-class" margin="25px 0 25px 0"]
<div class="maruck">
<ul>
<li>第三者の口コミは現時点で確認できない</li>
<li>最大99%・事故0件は自己申告の掲示</li>
<li>現金化はカード会員規約で禁止された行為</li>
</ul>
</div>
[/st-mybox]

リスクを理解したうえで進むと決めた場合の流れを見ていきましょう。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
