<!DOCTYPE html>

<title>即クレくん Step05 H2_5</title>

<body>
<textarea readonly id="content" style="width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word;">
<h2>即クレくん利用前の3つの注意点</h2>

申込み前に押さえておきたい注意点は、時間計画・文面確認・規約リスクの3つです。

どれも申込み後には取り返しがつきにくい項目です。

<h3>最短3分を前提にしない時間計画</h3>

「最短3分」を前提にした、ぎりぎりの時間計画は避けましょう。

初回は本人確認があり、混雑や時間帯によって所要時間が変わる可能性があるためです。

支払い期日が迫っている場合に確かめるのは、初回かどうかと、振込までの目安時間の2点。

期日から逆算して間に合うかを、申込み前に確認しましょう。

<h3>振込額と時期の文面確認</h3>

申込み前に、振込額と振込時期をやり取りの文面で残しましょう。

掲示と提示の差が出たとき、文面がなければ確かめる手段がなくなるためです。

確認する項目は「振込額は円でいくらか」「いつ振り込まれるか」「手数料の有無」の3点です。

提示額に納得してから決済に進めば、受取額の食い違いを防げます。

<h3>カード会員規約上の禁止行為</h3>

クレジットカードの現金化は、規約で禁止された行為です。

カード会社の規約で「換金目的の利用」が明示的に禁止されているからです。

発覚すれば利用停止や強制解約、残債の一括請求につながる場合があります。

業者選び以前のリスクとして、理解した上で判断しましょう。

リスクを理解したうえで進むと決めた場合の流れを見ていきましょう。
</textarea>
<button id="copyBtn" style="margin-top: 10px; padding: 8px 24px; font-size: 14px; cursor: pointer;">コピー</button>
<script>
document.getElementById('copyBtn').addEventListener('click', function() {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
