<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>即クレくん Step05 H2_7</title>
</head>
<body>
<textarea readonly id="content" style="width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word;">
<h2>即クレくんの口コミ・評判まとめ</h2>

即クレくんは、クレジットカード現金化を専門とするサービスです。

調査の範囲では、被害報告だけでなく第三者の口コミ自体が見当たりませんでした。

公式サイトは最大99%・最短3分・事故0件を掲示していますが、いずれも自己申告の掲示で、外部の裏づけはまだない段階です。

一方で、申込みフォームが条件（kyash非対応・枠残高3万円以下不可）を先に開示している点は確認材料に使えます。

申し込むかどうかは、提示された振込額と時期を文面で確かめてから判断しましょう。

申込みフォームの入力は24時間受け付けています。

公式サイトで条件の注記を確かめたうえで、判断してください。

[CTA: 公式サイト(素リンク) https://soku-cre.jp/ ]
</textarea>
<button id="copyBtn" style="margin-top: 10px; padding: 8px 24px; font-size: 14px; cursor: pointer;">コピー</button>
<script>
document.getElementById('copyBtn').addEventListener('click', function() {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
