<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>即クレくん Step05 H2_6</title>
</head>
<body>
<textarea readonly id="content" style="width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word;">
<h2>即クレくんの申込みから入金の流れ</h2>

公式サイトの案内は3STEPです。

ここでは初回利用を想定して、フォーム入力から着金までを行動順に整理しました。

<h3>フォーム入力と条件の確認</h3>

最初のステップは、申込みフォームの入力と条件注記の確認です。

フォームには利用回数・カードの種類・希望金額・ショッピング枠残高の入力欄があり、条件が先に読めるためです。

確認するのは、kyash非対応と枠残高3万円以下は申込み不可の2つの注記。

希望連絡時間の欄もあるため、電話に出やすい時間を指定できます。

<h3>本人確認と決済手続き</h3>

申込み後は、本人確認と決済の手続きに進みます。

カード名義と同一の本人確認書類で、不正利用がないかを確かめる流れのためです。

確認が済むと、ショッピング枠での決済と振込の案内に進む3STEPの構成です。

振込額と時期の提示があったら、この段階で文面を保存しておきましょう。

<h3>振込確認と2回目以降の短縮</h3>

最後のステップは、着金の確認です。

提示された金額どおりに振り込まれたかを確かめて、初めて取引が完了したと判断できるためです。

2回目以降は本人確認が不要になり、最短3分の掲示に近づく設計。

着金額が提示と違う場合は、保存した文面をもとに窓口へ確認しましょう。

最後に、この記事の要点を振り返ります。
</textarea>
<button id="copyBtn" style="margin-top: 10px; padding: 8px 24px; font-size: 14px; cursor: pointer;">コピー</button>
<script>
document.getElementById('copyBtn').addEventListener('click', function() {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
