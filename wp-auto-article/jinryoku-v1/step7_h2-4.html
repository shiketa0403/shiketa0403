<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>知恵袋・5chの投稿を実際に調査</h2>

Yahoo!知恵袋と5chを実際に検索して調査しました。

今回は「確認できた」と言える投稿がほとんどありません。

<h3>知恵袋の1件は内容確認できず</h3>

<span class="st-mymarker-s"><strong>知恵袋では検索に1件ヒットしたものの、質問の中身までは確認できませんでした。</strong></span>

タイトルだけでは、利用体験の相談かどうかを判断できないためです。

残りの検索結果は、配信アプリの「ギフト」機能に関する無関係な質問。

確認できた範囲では、<span class="hutoaka">利用体験の実投稿はゼロという前提</span>で判断しましょう。

<h3>5chの投稿は特定できず</h3>

<span class="st-mymarker-s"><strong>5chでは、尽力ギフトへの直接の書き込みを特定できませんでした。</strong></span>

専用スレッドがなく、「5chの口コミまとめ」と題する記事にも元レスの引用がないためです。

まとめ記事の内容は、レビューサイト経由の紹介として読む範囲にとどまります。

<span class="hutoaka">元の書き込みが示されない口コミ</span>は、参考程度にとどめましょう。

[st-cmemo webicon="st-svg-exclamation-circle" iconcolor="#919191" bgcolor="#fafafa" color="#000000" bordercolor="" borderwidth="" iconsize=""]ネットで見かける「尽力ギフトの口コミ」は、レビューサイト経由の紹介や集計が中心です。元の投稿があるかを確かめて読みましょう。[/st-cmemo]

生の声が少ないからこそ、申込前に押さえるべきは情報の読み方です。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
