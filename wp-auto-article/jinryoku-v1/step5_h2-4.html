<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>尽力ギフト Step05 H2_4</title>
</head>
<body>
<textarea readonly id="content" style="width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word;">
<h2>知恵袋・5chの投稿を実際に調査</h2>

Yahoo!知恵袋と5chを実際に検索して調査しました。

今回は「確認できた」と言える投稿がほとんどありません。

<h3>知恵袋の1件は内容確認できず</h3>

<strong>知恵袋では検索に1件ヒットしたものの、質問の中身までは確認できませんでした。</strong>

タイトルだけでは、利用体験の相談かどうかを判断できないためです。

残りの検索結果は、配信アプリの「ギフト」機能に関する無関係な質問。

確認できた範囲では、利用体験の実投稿はゼロという前提で判断しましょう。

<h3>5chの投稿は特定できず</h3>

<strong>5chでは、尽力ギフトへの直接の書き込みを特定できませんでした。</strong>

専用スレッドがなく、「5chの口コミまとめ」と題する記事にも元レスの引用がないためです。

まとめ記事の内容は、レビューサイト経由の紹介として読む範囲にとどまります。

元の書き込みが示されない口コミは、参考程度にとどめましょう。

生の声が少ないからこそ、申込前に押さえるべきは情報の読み方です。
</textarea>
<button id="copyBtn" style="margin-top: 10px; padding: 8px 24px; font-size: 14px; cursor: pointer;">コピー</button>
<script>
document.getElementById('copyBtn').addEventListener('click', function() {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
