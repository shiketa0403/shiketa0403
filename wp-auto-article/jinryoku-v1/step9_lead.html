この記事では、Yahoo!知恵袋・5ch・レビューサイトを実際に検索して、確認できた情報を整理しました。

<span class="st-mymarker-s">結論として、振り込まれない被害の報告は見当たらず、掲示80%とレビュー集計の平均79.67%は近い水準でした。</span>

良い口コミでは、入金の早さやメール・LINE完結の手軽さが紹介されています。

一方で口コミの母数は6件と少なく、「怪しい」という指摘は電話番号や口コミの出どころへの警戒が中心です。

読み終える頃には、「怪しい」指摘の中身と、申込前に確認すべきポイントがわかります。
