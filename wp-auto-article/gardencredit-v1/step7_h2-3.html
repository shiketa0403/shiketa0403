<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>悪い口コミ・評判で目立つ3つの指摘</h2>

目立つ指摘は、受取額・手数料・率の変更の3つです。

内容をそのまま紹介します。

<h3>受取額が期待ほどでないという声</h3>

<span class="st-mymarker-s"><strong>「手数料を考えると、実際の受取額は期待ほどではなかった」という声の紹介があります。</strong></span>

表の率から手数料が引かれ、<span class="hutoaka">手取りが目減りする</span>からです。

10万円の利用なら、表の上では94%で9万4000円という水準。

見積もりでは、手数料込みの振込額を確認しましょう。

[st-kaiwa1]表の率でなく、手数料込みの振込額で比べましょう。[/st-kaiwa1]

<h3>手数料の詳細が不明という指摘</h3>

<span class="st-mymarker-s"><strong>「キャンペーンや手数料の詳細が分からない」ことを不安材料とする指摘があります。</strong></span>

手数料の金額が、公式サイトに明示されていないからです。

事前に分からない条件は、<span class="hutoaka">電話で聞くしか確かめる方法がありません</span>。

不明点を確認してから、決済に進みましょう。

<h3>率は予告なく変わるという注意</h3>

<span class="st-mymarker-s"><strong>換金率は予告なく変更になる場合がある、という注意があります。</strong></span>

換金率表は時期によって見直されるからです。

<span class="hutoaka">過去に見た率と、申込時の率が違う場合</span>もあります。

申込直前に、その時点の率と見積もりを確認しましょう。

では、知恵袋や5chには実際に投稿があるのでしょうか。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
