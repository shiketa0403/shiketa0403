<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>申込前に知るべき3つの注意点</h2>

不安の多くは、数字の読み方と条件の確認で小さくできます。

申込前に3つの注意点を確認しましょう。

<h3>94%から98%という段階制の率</h3>

<span class="st-mymarker-s"><strong>換金率表は利用額別の段階制で、94%から98%まで幅があります。</strong></span>

1〜20万円は94%、80〜100万円は98%と、利用額が大きいほど率が上がるからです。

100万円以上は応相談という段階。

<span class="hutoaka">少額の利用ほど、表の上限との差</span>を見込みましょう。

<h3>最大5万円は変動する特典額</h3>

<span class="st-mymarker-s"><strong>新規成約の最大5万円プレゼントは、利用額によって変動します。</strong></span>

<span class="hutoaka">5万円は最大値で、実際にもらえる金額は条件次第</span>だからです。

詳細は担当者への問い合わせが必要という紹介もあります。

特典をあてにする前に、実額を電話で確認しましょう。

[st-kaiwa1 r]特典は実額を聞いてから、判断材料に加えましょう。[/st-kaiwa1]

<h3>カード会員規約上の禁止行為</h3>

<span class="st-mymarker-s"><strong>クレジットカードの現金化は、カード会社が禁止している行為です。</strong></span>

カード会社の規約で「換金目的の利用」が明示的に禁止されているからです。

発覚すると、<span class="hutoaka">利用停止や強制解約</span>につながる可能性があります。

業者選び以前に、この前提を理解した上で判断しましょう。

[st-mybox title="注意ポイント" webicon="st-svg-exclamation-circle" color="#ef5350" bordercolor="#ef9a9a" bgcolor="#ffebee" borderwidth="2" borderradius="5" titleweight="bold" fontsize="" myclass="st-mybox-class" margin="25px 0 25px 0"]
<div class="maruck">
<ul>
<li>率は利用額別の段階制(94〜98%)で手数料が別に引かれる指摘</li>
<li>最大5万円の特典は変動制・実額は要問い合わせ</li>
<li>現金化はカード会員規約上の禁止行為</li>
</ul>
</div>
[/st-mybox]

注意点を押さえたところで、実際の申込手順を確認します。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
