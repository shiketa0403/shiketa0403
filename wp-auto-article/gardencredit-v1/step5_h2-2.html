<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>良い口コミ・評判に多い3つの声</h2>

確認できた肯定的な口コミを紹介します。

評価は手続きの手軽さ・振込の速さ・対応の3点です。

<h3>スマホで完結したという声</h3>

「本人確認から振込確認まで、すべてスマホで完結した」という声が紹介されています。

申込・決済・確認の全工程がスマホで進む体制だからです。

VISA・Mastercard・JCB・AMEXの主要カードに対応しています。

来店なしで済ませたい方に向く手続きです。

<h3>振込が早いという利用者の声</h3>

「振込が早かった」という声の紹介があります。

最短3分の掲示と、平日15時以降・土日祝も即日振込の体制があるからです。

営業時間内の申込なら即日で振り込まれたという紹介も。

急ぎの場合は、申込前に振込タイミングを聞いておきましょう。

<h3>対応が丁寧で親身という評価</h3>

「丁寧で親身に対応してくれた」という評価が紹介されています。

オペレーターとの電話で条件を確認しながら進む流れだからです。

情報管理の徹底を掲げ、周囲に知られにくい配慮も掲示しています(自社掲載)。

不明点は、決済前の電話で確認しましょう。

一方で、悪い口コミや指摘には申込前に知っておきたい内容が含まれています。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
