<!DOCTYPE html>

<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>申込から現金化までの手順</h2>

買取LIFEの手続きは、LINEかメールの申込から始まります。

流れは申込・商品購入・査定・回収・代金支払いの4ステップです。

[st-timeline myclass="st-timeline-count" add_style=""]
[st-timeline-list text="LINEかメールで申込・相談" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
[/st-timeline-list]
[st-timeline-list text="後払いアプリで商品を購入" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
[/st-timeline-list]
[st-timeline-list text="商品の査定・回収" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
[/st-timeline-list]
[st-timeline-list text="代金の支払い(最短当日の紹介)" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
[/st-timeline-list]
[/st-timeline]

<h3>LINEとメールの申込窓口</h3>

<span class="st-mymarker-s"><strong>最初のステップは、LINEかメールでの申込です。</strong></span>

公式サイトに、無料相談の窓口として2つが用意されています。

やり取りの記録を残しやすいのは、LINEでの申込。

相談の段階で、買取額の目安を確かめましょう。

<h3>商品購入と査定・回収</h3>

<strong>申込後は、後払いアプリで指定の商品を購入します。</strong>

購入した商品の<span class="hutoaka">査定と回収を経て、買取が成立する方式</span>のためです。

発送のほか、店頭持込や業者への直送も選べるという紹介があります。

受け渡し方法は、<span class="st-mymarker-s">査定のやり取りで決めて</span>おきましょう。

[st-kaiwa1]受け渡し方で時間が変わります。急ぐなら店頭持込を相談しましょう。[/st-kaiwa1]

<h3>代金支払いまでの時間目安</h3>

<span class="st-mymarker-s"><strong>代金の支払いは、最短当日という紹介です。</strong></span>

店頭持込なら、その場で現金手渡しを受けられるためです。

<table>
<thead><tr><th>項目</th><th>内容</th></tr></thead>
<tbody>
<tr><td>申込</td><td>LINE・メール</td></tr>
<tr><td>受け取り</td><td>振込・店頭手渡し・直送</td></tr>
<tr><td>支払いの目安</td><td>最短当日(店頭持込)</td></tr>
<tr><td>初回</td><td>本人確認書類が必要</td></tr>
</tbody>
</table>

発送や直送の場合は、<span class="hutoaka">商品の到着と査定を待つ流れ</span>。

急ぐ日は、受け渡し方法も含めて相談しましょう。

最後に、この記事の調査結果を整理します。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
