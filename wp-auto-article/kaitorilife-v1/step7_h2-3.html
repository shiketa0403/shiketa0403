<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>悪い口コミ・評判で目立つ3つの指摘</h2>

気になる点は、率の示し方・手取りの声・手続きの手間の3つです。

いずれも申込前の確認で対処できます。

<h3>一律の買取率の明示がない</h3>

<strong>公式サイトには、<span class="hutoaka">一律の買取率が明示されていません</span>。</strong>

アプリ別の「最大」の数字が並び、実際の率は査定で決まるためです。

レビューが伝える実際の水準は、平均70〜80%という紹介。

最大の数字を前提にせず、<span class="st-mymarker-s">査定の提示額で確かめ</span>ましょう。

<h3>実質の手取りが低いという声</h3>

<strong>後払い現金化の全般には、「<span class="hutoaka">実質の手取りが思ったより低かった</span>」という声があります。</strong>

商品価格と買取額の差が、そのまま手取りの目減りになるためです。

この声はまとめ記事経由の要旨で、買取LIFE固有の被害報告ではありません。

手取り額は、<span class="st-mymarker-s">査定の段階で金額として確認</span>しましょう。

[st-kaiwa1]手取りは率でなく金額で確認。査定の提示額が判断材料ですね。[/st-kaiwa1]

<h3>商品の購入と発送の手間</h3>

<strong>現金化までには、<span class="hutoaka">商品の購入と発送(または持込)の工程</span>があります。</strong>

枠を直接換金するのではなく、商品買取方式のためです。

手間を減らしたい人向けに、直送や店頭持込の選択肢があります。

<span class="st-mymarker-s">自分に合う受け渡し方を、申込前に決めて</span>おきましょう。

ここまでの整理を踏まえて、では知恵袋や5chに生の投稿はあるのでしょうか。
</textarea>

document.getElementById('copyBtn').addEventListener('click', () => {
