<body>
<textarea readonly id="content" style="width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word;">
<h2>良い口コミ・評判で確認できた3点</h2>

確認できた良い材料は、買取率の水準・受け取り方の広さ・運営の透明性の3点です。

いずれもレビュー経由の紹介として整理します。

<h3>他社より高い買取率という声</h3>

<strong>「他社より10〜20%高い率で買い取られた」という声が紹介されています。</strong>

業界最高峰の買取価格を掲げ、率の水準を強みにしているためです。

手数料は無料で、キャンセルもできるという紹介があります。

率の高さは商品次第のため、査定の提示額で確かめましょう。

<h3>店頭手渡しと直送の受け取り</h3>

<strong>受け取りは振込のほか、店頭での現金手渡しにも対応しています。</strong>

商品を買い取る方式のため、店頭持込なら最短当日に受け取れるためです。

購入商品を業者へ直接送る、直送の方式も選択肢。

自宅に商品を届けたくない人は、直送の可否を査定で確かめましょう。

<h3>古物商許可と所在地の公開</h3>

<strong>運営は古物商許可を取得した法人で、所在地も公開されています。</strong>

商品の買取には、古物営業法に基づく許可が要るためです。

公式サイトには地図と会社概要が掲載され、店舗の場所を確認できます。

運営情報を確認できる点は、判断材料の1つです。

一方で、良い材料だけを見て決めるのは早計です。

次は気になる指摘を確認します。
</textarea>

document.getElementById('copyBtn').addEventListener('click', function() {
