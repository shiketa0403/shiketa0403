<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>注意したい3つのデメリット</h2>

つまずきやすいのは初回の時間・対象外アプリ・規約リスクの3点です。

3つの注意点を事前に押さえましょう。

<h3>初回は本人確認で時間増</h3>

<span class="st-mymarker-s"><strong>初回の振込は、最短5分より時間がかかります。</strong></span>

本人確認書類の提出と確認の工程が入るからです。

初回は最短10分とする解説や、約1時間かかったとの利用報告。

急ぎの場合も、<span class="hutoaka">初回は1時間程度の余裕</span>を見ておきましょう。

<h3>Paidy・B43は対象外</h3>

<span class="st-mymarker-s"><strong>Paidy・ワンバンク(B43)・Olive等の充当機能付リボカードは現金化できません。</strong></span>

申込フォームの注記で、対象外と明示されているからです。

後払いアプリ対応をうたっていても、<span class="hutoaka">全アプリが対象ではありません</span>。

自分が利用中のアプリが対象かを、申込前に確認しましょう。

<h3>カード会員規約違反のリスク</h3>

<span class="st-mymarker-s"><strong>クレジットカード現金化はカード会員規約上の禁止行為です。</strong></span>

カード会社の規約で「換金目的の利用」が明示的に禁止されているからです。

発覚時は<span class="hutoaka">利用停止・残額の一括請求・強制解約</span>のリスクがあります。

カード事故ゼロの解説があっても、利用は自己責任が前提です。

[st-mybox title="注意ポイント" webicon="st-svg-exclamation-circle" color="#ef5350" bordercolor="#ef9a9a" bgcolor="#ffebee" borderwidth="2" borderradius="5" titleweight="bold" fontsize="" myclass="st-mybox-class" margin="25px 0 25px 0"]
<div class="maruck">
<ul>
<li>初回は本人確認があり最短5分では届かない</li>
<li>Paidy・ワンバンク(B43)・Olive等は対象外</li>
<li>現金化はカード会員規約上の禁止行為</li>
</ul>
</div>
[/st-mybox]

注意点を踏まえた上で、実際の口コミを調査した結果を確認します。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
