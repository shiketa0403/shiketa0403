<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>注意したい3つのデメリット</h2>

つまずきやすいのは初回の時間・対象外アプリ・規約リスクの3点です。

3つの注意点を事前に押さえましょう。

<h3>初回は本人確認で時間増</h3>

初回の振込は、最短5分より時間がかかります。

本人確認書類の提出と確認の工程が入るからです。

初回は最短10分とする解説や、約1時間かかったとの利用報告。

急ぎの場合も、初回は1時間程度の余裕を見ておきましょう。

<h3>Paidy・B43は対象外</h3>

Paidy・ワンバンク(B43)・Olive等の充当機能付リボカードは現金化できません。

申込フォームの注記で、対象外と明示されているからです。

後払いアプリ対応をうたっていても、全アプリが対象ではありません。

自分が利用中のアプリが対象かを、申込前に確認しましょう。

<h3>カード会員規約違反のリスク</h3>

クレジットカード現金化はカード会員規約上の禁止行為です。

カード会社の規約で「換金目的の利用」が明示的に禁止されているからです。

発覚時は利用停止・残額の一括請求・強制解約のリスクがあります。

カード事故ゼロの解説があっても、利用は自己責任が前提です。

注意点を踏まえた上で、実際の口コミを調査した結果を確認します。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
