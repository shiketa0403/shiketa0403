<!DOCTYPE html>

<head>

</style>

<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>向いている人と向かない人</h2>

対象カード・急ぎ度・規約リスクの3点で適合性が分かれます。

具体的な人物像で整理しましょう。

<h3>利用が向く人の条件</h3>

最大値でなく、見積もりの振込額で判断できる人に向きます。

実勢の報告に、90%台と70%程度の幅があるためです。

10万円超のまとまった決済や、他社からの乗り換えなら率の面で有利な設計。

土日祝に申込みたい人にも、年中無休の体制は相性が良好です。

<h3>利用を控えるべき人の特徴</h3>

98.4%をそのまま手取りと考える人には向きません。

最大値は大口向けで、少額帯は91%からと差があるからです。

「Paidy・B43で現金化したい人」「カードローン審査に通る属性の人」も該当します。

該当する場合は、金利が明確な消費者金融・カードローンを選びましょう。

利用に向くと判断した方は、申込手順を次で確認しましょう。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
