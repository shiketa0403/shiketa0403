<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ココイー Step05 H2_4</title>
</head>
<body>
<textarea readonly id="content" style="width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word;">
<h2>知恵袋・5chの投稿を実際に調査</h2>

Yahoo!知恵袋と5chを実際に検索して調査しました。

結論から言うと、どちらでもココイーの実投稿は確認できませんでした。

<h3>知恵袋の実投稿は確認できず</h3>

<strong>今回の調査では、Yahoo!知恵袋でココイーに関する実投稿を確認できませんでした。</strong>

質問・回答を対象にした検索でも、該当する投稿が見つからなかったためです。

検索結果に混ざるのは、口コミ対策営業の「ココイコ」のような別サービスの相談。

名前が似ていても別の事業者のため、混同しないよう注意しましょう。

<h3>5chでも言及は確認できず</h3>

<strong>5chでも、ココイーの利用者による生の書き込みを確認できませんでした。</strong>

後払い現金化の総合スレッドはあるものの、ココイーへの言及を特定できなかったためです。

姫路の買取店「ココイーネ」のような類似名の別事業者も検索に混ざります。

実投稿が少ない以上、公式サイトの掲示内容と条件を軸に判断しましょう。

生の体験談が少ないからこそ、申込前に押さえるべきは条件面の注意点です。
</textarea>
<button id="copyBtn" style="margin-top: 10px; padding: 8px 24px; font-size: 14px; cursor: pointer;">コピー</button>
<script>
document.getElementById('copyBtn').addEventListener('click', function() {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
