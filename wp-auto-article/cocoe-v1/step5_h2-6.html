<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ココイー Step05 H2_6</title>
</head>
<body>
<textarea readonly id="content" style="width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word;">
<h2>依頼フォームから振込までの手順</h2>

ココイーの手続きは、依頼フォームから始まる3つのステップで完結します。

来店は不要で、スマホだけで進められます。

<h3>依頼フォームの入力と本人確認</h3>

<strong>最初のステップは、依頼フォームの入力と本人確認です。</strong>

フォームで後払いアプリの種類と希望金額を伝えると、案内が始まるためです。

初回の利用で必要になるのは、本人確認の書類。

入力後の案内で、見積もりの振込額もあわせて確認しましょう。

<h3>指定商品を後払いアプリで購入</h3>

<strong>次のステップは、案内で指定された商品を後払いアプリで購入する手続きです。</strong>

ココイーは、指定商品の購入を通じて枠を現金に換える方式のためです。

対応アプリとして、メルペイ・ペイディ・ペイディApple専用枠が紹介されています。

案内された手順のとおりに進めれば、操作自体は難しくありません。

<h3>振込完了までの時間目安</h3>

<strong>振込までの時間は、最短5分が公式サイトの掲示です。</strong>

体験談でも「振込の早さは本物でした」と、スピードは肯定的に評価されています。

ただし営業時間の具体的な記載は確認できず、時間帯による扱いは見積もり時の確認が前提です。

急ぎの日に確かめたいのは、申込時点での振込までの目安。

着金を急ぐ日は、時間に余裕を持って申し込みましょう。

最後に、この記事の調査結果を整理します。
</textarea>
<button id="copyBtn" style="margin-top: 10px; padding: 8px 24px; font-size: 14px; cursor: pointer;">コピー</button>
<script>
document.getElementById('copyBtn').addEventListener('click', function() {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
