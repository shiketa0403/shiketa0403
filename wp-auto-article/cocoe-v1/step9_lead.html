この記事では、知恵袋・5chの実調査結果と、確認できた体験談・掲示の内容を整理しました。

<span class="st-mymarker-s">結論として、詐欺と断定できる被害報告は確認できず、最大98.5%の掲示と体験談80%には開きがあります。</span>

読み終えるころには、見積もりで振込額を確かめてから申し込むかどうかを、自分で判断できる状態です。
