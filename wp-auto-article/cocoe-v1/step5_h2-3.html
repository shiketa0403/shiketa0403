<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ココイー Step05 H2_3</title>
</head>
<body>
<textarea readonly id="content" style="width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word;">
<h2>悪い口コミ・評判で目立つ3つの指摘</h2>

気になる指摘は、率の開き・手数料の不透明さ・情報の少なさの3点です。

いずれも申込前の確認で対処できます。

<h3>体験談の率は80%という開き</h3>

<strong>3万円の利用で換金率80%だったという体験談は、掲示との開きを示しています。</strong>

最大98.5%という数字の印象が強く、同じ率を期待しやすいためです。

開きを生む要因は、利用額や条件による率の変動。

見積もりで振込額を確認すれば、期待とのずれは防げます。

<h3>手数料の記載が見当たらない</h3>

<strong>手数料の具体的な記載は、今回の調査では見当たりませんでした。</strong>

率の掲示だけでは、実際にいくら引かれるかを判断できないためです。

手数料が分からないまま進めると、受取額の予想が立ちません。

依頼フォームの見積もりで、手数料込みの振込額を聞きましょう。

<h3>口コミの数自体が少ない</h3>

<strong>ココイーは口コミの数自体が少なく、判断材料が限られています。</strong>

単独のレビュー記事が少なく、比較サイトの掲載が中心のためです。

情報が少ないサービスでは、良い評判も悪い評判も鵜呑みにできません。

確認できた事実と掲示を分けて、冷静に判断しましょう。

ここまでの声は、いずれもレビューサイト経由の紹介です。

では、知恵袋や5chに生の投稿はあるのでしょうか。
</textarea>
<button id="copyBtn" style="margin-top: 10px; padding: 8px 24px; font-size: 14px; cursor: pointer;">コピー</button>
<script>
document.getElementById('copyBtn').addEventListener('click', function() {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
