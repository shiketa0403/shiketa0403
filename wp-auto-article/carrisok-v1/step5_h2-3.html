<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>注意したい3つのデメリット</h2>

メリットだけで判断すると、銀行営業時間や買取率の変動でつまずきます。

3つの注意点を事前に押さえましょう。

<h3>銀行営業時間外の振込遅延</h3>

最短10分の振込は銀行営業時間に依存します。

銀行振込は平日15時を境に当日着金と翌営業日着金が分かれるからです。

24時間受付でも、平日深夜・土日祝の申込は振込実行までに時間差。

急ぎ調達は平日の営業開始直後が安全な選択肢です。

<h3>2回目以降88%への買取率低下</h3>

2回目以降の買取率は88%に下がります。

初回限定の優遇措置として90%が設定されているからです。

リピート利用時は還元額が下がる前提で計画を立てましょう。

長期的な利用者は他サービスとの併用も視野に入れましょう。

<h3>キャリア利用規約違反のリスク</h3>

キャリア決済の換金目的利用は各社の利用規約上の禁止行為です。

ドコモ・au・Paidyの各社規約で「換金目的の利用」が明示的に禁止されているからです。

発覚時のリスクは利用停止・追加請求・契約解除の3点。

利用は自己責任での判断が前提です。

デメリットを把握したら、実際の利用者がどう評価しているかを確認しましょう。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
