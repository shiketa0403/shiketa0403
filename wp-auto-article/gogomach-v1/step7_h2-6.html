<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>スマホ申込から振込までの手順</h2>

申込はスマホで完結し、来店は不要です。

Web申込から振込までの流れを順に見ていきましょう。

[st-timeline myclass="st-timeline-count" add_style=""]
[st-timeline-list text="Webフォームで申込" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
公式サイトのフォーム(受付24時間)で申込み、振込額の提示を受ける
[/st-timeline-list]
[st-timeline-list text="本人確認・アプリで決済" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
初回は本人確認書類をスマホで撮影して提出し、後払いアプリで決済する
[/st-timeline-list]
[st-timeline-list text="振込完了" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
掲示は最短3分(確認できた紹介は平均30分程度・遅延報告もあり)
[/st-timeline-list]
[/st-timeline]

<h3>Web申込から見積もりの流れ</h3>

<span class="st-mymarker-s"><strong>申込は公式サイトのフォームから始まります。</strong></span>

受付後に振込額の提示があり、納得してから決済に進む流れだからです。

掲げる流れは、申込・本人確認・振込の3ステップ。

提示された振込額に納得できなければ、<span class="hutoaka">この段階で断りましょう</span>。

<h3>本人確認とアプリでの決済</h3>

<span class="st-mymarker-s"><strong>初回は本人確認書類の提出と、後払いアプリでの決済が必要です。</strong></span>

現金化は商品売買の形式を取り、本人確認が法令上必須だからです。

<strong>Paidy・FamiPay・LINE Pay・atone</strong>を含む後払いアプリに対応しています。

決済前に、金額と商品の内容を確認しましょう。

[st-kaiwa1]初回は本人確認がある分、時間に余裕を見ておくと安心です。[/st-kaiwa1]

<h3>振込完了までの時間目安</h3>

<span class="st-mymarker-s"><strong>振込は最短3分の掲示ですが、実際は幅があります。</strong></span>

初回の本人確認や混雑で、<span class="hutoaka">所要時間が前後する</span>からです。

確認できた紹介は、平均30分程度という内容。

<table>
<thead><tr><th>項目</th><th>内容</th></tr></thead>
<tbody>
<tr><td>受付</td><td>Webフォーム(24時間)</td></tr>
<tr><td>掲示の振込速度</td><td>最短3分</td></tr>
<tr><td>確認できた紹介</td><td>平均30分程度・45分の体験</td></tr>
<tr><td>遅延の注意</td><td>混雑や時間帯で翌日にずれた報告あり</td></tr>
</tbody>
</table>

当日中に受け取りたい場合は、早めの時間帯の申込がおすすめです。

手順を把握したら、最後に記事全体の要点を整理します。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
