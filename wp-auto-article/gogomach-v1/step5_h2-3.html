<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>悪い口コミ・評判で目立つ3つの指摘</h2>

目立つ指摘は、実際の率・遅延の事例・スピード掲示との差の3つです。

内容をそのまま紹介します。

<h3>75〜78%だったという利用者の報告</h3>

「換金率は75〜78%だった」という利用者の報告があります。

最低80%保証の掲示との差を指摘する紹介があるからです。

実測約79%という集計とも方向が一致する内容。

決済前に振込額の提示を受け、金額で判断しましょう。

<h3>入金に24時間超かかった遅延報告</h3>

「月曜午後の申込で、入金は火曜午後だった」という遅延報告の紹介があります。

混雑や時間帯によって、対応が翌日にずれる場合があるからです。

24時間を超えたのはまれな例で、平均は30分程度という紹介です。

急ぎの場合は、振込タイミングを申込時に確認しましょう。

<h3>最短3分と実際の差という指摘</h3>

最短3分の掲示と、実際の時間に差があるという指摘があります。

「45分かかった」という体験の紹介があるからです。

初回は本人確認の工程が入る分、時間がかかりやすい傾向です。

最短表示は上限の速さと考え、余裕を持って申し込みましょう。

では、知恵袋や5chには実際の投稿があるのでしょうか。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
