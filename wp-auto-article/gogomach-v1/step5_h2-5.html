<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>申込前に知るべき3つの注意点</h2>

「思ったより少ない」と感じる原因の多くは、表示の読み方にあります。

申込前に3つの注意点を確認しましょう。

<h3>98.5%は上限側という表示</h3>

最大98.5%という表示は、条件がそろった場合の上限側の数字です。

実測は約79%という集計や、75〜78%の報告があるからです。

換金率5%UPキャンペーンも、適用には条件がある掲示。

適用される率は、申込時の見積もりで確認しましょう。

<h3>換金事例は自社サイト掲載の情報</h3>

公式サイトの換金事例の表は、自社サイト掲載の情報です。

決済額別の率や振込額の事例は、運営側が選んで載せているからです。

事例の率と、利用者報告の75〜79%には差があります。

掲載事例は参考にとどめ、自分の見積もりで確認しましょう。

<h3>カード会員規約上の禁止行為</h3>

クレジットカードや後払いアプリの現金化は、運営側が禁止している行為です。

カード会社の規約で「換金目的の利用」が明示的に禁止されているからです。

発覚した場合、アプリやカードの利用停止につながるリスクがあります。

業者選び以前に、この前提を理解した上で判断しましょう。

注意点を押さえたところで、実際の申込手順を確認します。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
