<!DOCTYPE html>

<body>
<textarea readonly id="content" style="width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word;">
<h2>良い口コミ・評判でわかった3つの強み</h2>

良い口コミは、レビューサイト経由の紹介が中心です。

速さ・対応範囲・実績掲示の3つの軸で整理しました。

<h3>最短5分〜30分で入金という声</h3>

<strong>「最短5分から平均30分ほどで振り込まれた」という声が紹介されています。</strong>

掲示の最短3分と方向が一致する内容のためです。

一方で「振込に時間がかかった」という声も併記されています。

急ぎの日は、申込前に当日の混雑状況を問い合わせましょう。

<h3>後払いアプリの対応範囲が広い</h3>

<strong>クレジットカードに加えて、後払いアプリの対応範囲が広いという掲示です。</strong>

ペイディ・バンドルカード・au PAY・Kyash・B/43・ultra・BANKITまで対応が並ぶためです。

キャリアのプリペイドカードにも対応するという表示は、この業態では広めの部類。

自分の使いたい枠が対象かを、申込前に確かめましょう。

<h3>カード事故0という掲示</h3>

<strong>公式サイトは「創業からカード事故0」を掲示しています。</strong>

カードの利用停止を心配する検討者に向けた、安心材料の訴求のためです。

ただしこの数字は自社掲示で、第三者の集計ではありません。

掲示は参考にしつつ、規約リスクは後述の注意点で確認しましょう。

一方で、受取額には厳しい投稿もあります。

次で3つ確認しましょう。
</textarea>
<button id="copyBtn" style="margin-top: 10px; padding: 8px 24px; font-size: 14px; cursor: pointer;">コピー</button>
<script>
document.getElementById('copyBtn').addEventListener('click', function() {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
