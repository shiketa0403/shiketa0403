<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>いつでもペイ Step05 H2_3</title>
</head>
<body>
<textarea readonly id="content" style="width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word;">
<h2>悪い口コミ・評判で目立つ3つの指摘</h2>

気になる指摘は、率の下振れ・手数料・情報の食い違いの3つです。

いずれも申込前の確認で織り込めます。

<h3>換金率50%だったという投稿</h3>

<strong>「換金率が50%だった」という口コミ投稿を掲載する媒体があります。</strong>

最低保証85%以上の掲示との差が大きく、無視できない内容のためです。

掲載されているのは、レビューサイトに寄せられた投稿1件の紹介。

真偽は確認できないため、見積もりの金額を判断の基準にしましょう。

<h3>手数料が重く感じたという声</h3>

<strong>「最終的な受取額を見ると手数料がやや重く感じた」という声が紹介されています。</strong>

率の掲示と受取額の間に、手数料の差引が挟まるためです。

スタッフの対応は丁寧だったという評価と、受取額への不満が同じ声の中に併存します。

手数料込みの振込額を、決済前に文面で受け取りましょう。

<h3>媒体で数字が食い違う紹介</h3>

<strong>レビュー媒体によって、率や振込時間の数字が食い違っています。</strong>

「いつでもペイ」と「いつでもPAY」の表記で、別ページを立てる媒体があるためです。

一律80%・最短5分という紹介と、最低保証85%・最短3分という掲示が混在しています。

どの表記の情報かを確かめて、公式サイトの掲示を基準にしましょう。

ここまでの声はいずれもレビューサイト経由です。

では、知恵袋や5chに生の投稿はあるのでしょうか。
</textarea>
<button id="copyBtn" style="margin-top: 10px; padding: 8px 24px; font-size: 14px; cursor: pointer;">コピー</button>
<script>
document.getElementById('copyBtn').addEventListener('click', function() {
  navigator.clipboard.writeText(document.getElementById('content').value);
