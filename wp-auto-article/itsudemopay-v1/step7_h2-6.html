<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>申込から振込までの手順</h2>

いつでもペイの手続きは、公式サイトの無料見積もりフォームから始まります。

流れは申込・見積もり・決済・振込の順です。

[st-timeline myclass="st-timeline-count" add_style=""]
[st-timeline-list text="無料見積もりフォームで申込" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
[/st-timeline-list]
[st-timeline-list text="見積もり・提示額を文面で確認" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
[/st-timeline-list]
[st-timeline-list text="カードや後払いアプリの枠で決済" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
[/st-timeline-list]
[st-timeline-list text="お振込み(最短3分掲示・時間帯で変動)" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
[/st-timeline-list]
[/st-timeline]

<h3>申込と見積もりの文面確認</h3>

<span class="st-mymarker-s"><strong>最初のステップは、見積もりフォームの送信と提示額の確認です。</strong></span>

提示額に納得してから進めば、<span class="hutoaka">受取額のずれ</span>を防げます。

フォームで入力するのは、希望金額と連絡の取りやすい時間帯。

保証込みの振込額は、文面で受け取ってから決めましょう。

<h3>カード決済の手続き</h3>

<strong>見積もりに納得したら、案内に沿ってカードや後払いアプリの枠で指定商品を決済します。</strong>

決済の確認をもって、振込の手続きに進む方式のためです。

ペイディやバンドルカードの枠で進める場合も、手順は案内に従う流れです。

不明点は、<span class="st-mymarker-s">決済前に電話やフォームで確かめ</span>ましょう。

[st-kaiwa1]決済前の疑問はフォームでもOK。記録が残る連絡手段が便利です。[/st-kaiwa1]

<h3>振込までの時間目安</h3>

<span class="st-mymarker-s"><strong>掲示の最短は3分ですが、平均30分ほどという声や時間がかかったという声もあります。</strong></span>

申込の時間帯や混雑で、実際の所要時間が変わるためです。

<table>
<thead><tr><th>項目</th><th>内容</th></tr></thead>
<tbody>
<tr><td>申込</td><td>無料見積もりフォーム(WEB)</td></tr>
<tr><td>決済</td><td>カード・後払いアプリの枠</td></tr>
<tr><td>振込</td><td>最短3分掲示・平均30分の声も</td></tr>
<tr><td>受付</td><td>土日祝・15時以降は申込時に確認</td></tr>
</tbody>
</table>

時間を左右するのは、<span class="hutoaka">申込の時間帯と当日の状況</span>。

土日祝や15時以降の入金可否は、申込時に確かめましょう。

最後に、この記事の調査結果を整理します。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
