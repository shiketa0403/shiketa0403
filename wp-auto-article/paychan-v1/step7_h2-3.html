<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>悪い口コミ・評判で目立つ3つの指摘</h2>

気になる指摘は、振込の時間帯・アプリの利用停止・サイトの記載の3つです。

いずれも申込前の対処で織り込めます。

<h3>振込は時間帯で翌営業日の場合</h3>

<strong>時間帯によっては、<span class="hutoaka">振込が翌営業日にずれる</span>という説明があります。</strong>

遅い時間や混雑時の申込は、当日の処理に間に合わない場合があるためです。

営業時間の紹介も媒体で食い違い、7〜22時や9〜22時と幅。

当日中に受け取りたい日は、<span class="st-mymarker-s">時間に余裕を持って申し込み</span>ましょう。

[st-kaiwa1]遅い時間の申込は翌営業日も。急ぎの日は午前がおすすめです。[/st-kaiwa1]

<h3>アプリが使えなくなった報告</h3>

<strong>「利用後に<span class="hutoaka">後払いアプリが使えなくなった</span>」という報告が紹介されています。</strong>

ただし、ペイチェンの利用との因果関係は不明という扱いです。

現金化はアプリの規約が禁じる使い方のため、どの業者でも同じリスクが伴います。

この点は業者選び以前のリスクとして、<span class="st-mymarker-s">注意点の章で確かめ</span>ましょう。

<h3>サイトの記載が不十分という指摘</h3>

<strong>「サイトの記載が足りない」という指摘が紹介されています。</strong>

<span class="hutoaka">連絡先の記載が見当たらない</span>、という点を挙げる媒体があるためです。

現行の公式サイトには会社概要と営業時間の記載があり、確認の材料はあります。

気になる点は、<span class="st-mymarker-s">申込前にLINEの窓口で確かめ</span>ましょう。

ここまでの声はレビューサイト経由の紹介が中心です。

では、知恵袋や5chの元の投稿はどこまで確認できるのでしょうか。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
