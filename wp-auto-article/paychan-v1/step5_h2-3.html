<body>
<textarea readonly id="content" style="width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word;">
<h2>悪い口コミ・評判で目立つ3つの指摘</h2>

気になる指摘は、振込の時間帯・アプリの利用停止・サイトの記載の3つです。

いずれも申込前の対処で織り込めます。

<h3>振込は時間帯で翌営業日の場合</h3>

時間帯によっては、振込が翌営業日にずれるという説明があります。

遅い時間や混雑時の申込は、当日の処理に間に合わない場合があるためです。

営業時間の紹介も媒体で食い違い、7〜22時や9〜22時と幅。

当日中に受け取りたい日は、時間に余裕を持って申し込みましょう。

<h3>アプリが使えなくなった報告</h3>

「利用後に後払いアプリが使えなくなった」という報告が紹介されています。

ただし、ペイチェンの利用との因果関係は不明という扱いです。

現金化はアプリの規約が禁じる使い方のため、どの業者でも同じリスクが伴います。

この点は業者選び以前のリスクとして、注意点の章で確かめましょう。

<h3>サイトの記載が不十分という指摘</h3>

「サイトの記載が足りない」という指摘が紹介されています。

連絡先の記載が見当たらない、という点を挙げる媒体があるためです。

現行の公式サイトには会社概要と営業時間の記載があり、確認の材料はあります。

気になる点は、申込前にLINEの窓口で確かめましょう。

ここまでの声はレビューサイト経由の紹介が中心です。

では、知恵袋や5chの元の投稿はどこまで確認できるのでしょうか。
</textarea>
<button id="copyBtn" style="margin-top: 10px; padding: 8px 24px; font-size: 14px; cursor: pointer;">コピー</button>
<script>
document.getElementById('copyBtn').addEventListener('click', function() {
  navigator.clipboard.writeText(document.getElementById('content').value);
