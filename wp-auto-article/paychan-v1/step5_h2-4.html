<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ペイチェン Step05 H2_4</title>
</head>
<body>
<textarea readonly id="content" style="width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word;">
<h2>知恵袋・5chの投稿を実際に調査</h2>

Yahoo!知恵袋と5chを実際に検索して調査しました。

結論として、元の投稿はどちらも確認できていません。

<h3>引用の多くは出所が業者ブログ</h3>

「知恵袋・5chの口コミ」と示される引用の多くは、出所が業者系のブログです。

現金化業者が運営するレビュー記事に、同じ趣旨の引用が並ぶ構図のためです。

引用元の投稿へのリンクや番号は、いずれも見当たらない状態。

出所の示されない口コミは、宣伝の可能性も含めて読みましょう。

<h3>元の投稿はどちらも特定できず</h3>

知恵袋と5chの検索では、ペイチェンを名指しした元の投稿を特定できませんでした。

質問・回答・スレッドのいずれにも、引用と一致する投稿が見当たらないためです。

確認できるのは、レビュー記事に載った「紹介としての口コミ」までです。

判断の軸は口コミの数でなく、自分あての見積もりに置きましょう。

生の声が確認できないからこそ、申込前に押さえるべきは数字の条件と確認の手順です。
</textarea>
<button id="copyBtn" style="margin-top: 10px; padding: 8px 24px; font-size: 14px; cursor: pointer;">コピー</button>
<script>
document.getElementById('copyBtn').addEventListener('click', function() {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
