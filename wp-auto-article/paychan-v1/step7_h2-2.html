<!DOCTYPE html>

<head>

<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>良い口コミ・評判でわかった3つの強み</h2>

良い口コミは、レビューサイト経由の紹介が中心です。

率・速さ・対応範囲の3つの軸で整理しました。

<h3>率がサイトどおりという声</h3>

<span class="st-mymarker-s"><strong>「率がサイトに書かれているとおりだった」という声が紹介されています。</strong></span>

掲示の率がそのまま適用された、という内容の口コミのためです。

「手数料は振込の200円だけで、率に偽りがない」という紹介も併せてあります。

自分の条件も同じとは限らないため、見積もりで確かめましょう。

[st-kaiwa1 r]率どおりの声も。最後は自分の見積もりで確認ですね。[/st-kaiwa1]

<h3>LINE完結で対応が早いという声</h3>

<span class="st-mymarker-s"><strong>「LINEだけで完結して対応が早い」という声が紹介されています。</strong></span>

申込から連絡までがLINEとWEBで進む方式のためです。

掲示はお振込みまで最短3分、シミュレーションの設置も特徴。

急ぎの日は、申込前に当日の所要時間を確かめましょう。

<h3>後払い・カードの対応が広い</h3>

<span class="st-mymarker-s"><strong>後払いアプリ・キャリア決済・クレジットカードと、対応の幅が広い掲示です。</strong></span>

バンドルカード・BANKIT・Kyashに加え、3キャリアの決済と4ブランドのカードが並ぶためです。

一部カードの一時取扱停止の告知もあり、一覧は変わる場合があります。

自分の使う決済が現行の対応にあるかを、申込前に確かめましょう。

[st-mybox title="こんな方に向いています" webicon="st-svg-check-circle" color="#757575" bordercolor="#BDBDBD" bgcolor="#ffffff" borderwidth="2" borderradius="5" titleweight="bold" fontsize="" myclass="st-mybox-class" margin="25px 0 25px 0"]
<div class="maruck">
<ul>
<li>後払いアプリやキャリア決済の枠を現金に変えたい人</li>
<li>LINEの文面だけで進めたい人</li>
<li>少額から試したい人</li>
</ul>
</div>
[/st-mybox]

一方で、時間と情報の扱いには気になる指摘もあります。

次で3つ確認しましょう。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
