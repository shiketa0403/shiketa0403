<!DOCTYPE html>

<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>申込前に知るべき3つの注意点</h2>

申込を決める前に、率と手数料・対応カード・規約の3点を押さえておきましょう。

特に3つ目は、現金化サービス全体に共通する重要な注意点です。

<h3>率と手数料は申込時点で確認</h3>

<strong>率と手数料は、申込時点の案内で確かめましょう。</strong>

掲示95%と紹介90%の食い違いがあり、<span class="hutoaka">条件が変わっている可能性</span>があるためです。

加えて振込手数料200円という口コミの紹介も。

<span class="st-mymarker-s">「いくら振り込まれるか」を1つの数字で</span>受け取りましょう。

[st-kaiwa1 r]率より手取りの実額が基準。申込時点の案内が頼りですね。[/st-kaiwa1]

<h3>対応カードは現行情報で確認</h3>

<span class="st-mymarker-s"><strong>対応カード・アプリの一覧は、現行の情報で確かめましょう。</strong></span>

一部カードの一時取扱停止の告知があり、<span class="hutoaka">お知らせで条件が動いている</span>ためです。

古い紹介記事の一覧と、現行の対応が違う場合があります。

自分の決済手段が使えるかを、申込前に窓口で確かめましょう。

<h3>カード会員規約上の禁止行為</h3>

<span class="st-mymarker-s"><strong>クレジットカード枠の現金化は、カード会員規約上の禁止行為に該当します。</strong></span>

カード会社の規約で「換金目的の利用」が明示的に禁止されているからです。

発覚した場合、カードの<span class="hutoaka">利用停止や強制解約</span>につながるおそれがあります。

日本クレジット協会も、ショッピング枠の現金化を利用しないよう注意を呼びかけています。

ペイディやバンドルカードにも換金目的を禁じる規約があるため、後払いアプリでの利用も同じリスクを踏まえて判断しましょう。

[st-mybox title="注意ポイント" webicon="st-svg-exclamation-circle" color="#ef5350" bordercolor="#ef9a9a" bgcolor="#ffebee" borderwidth="2" borderradius="5" titleweight="bold" fontsize="" myclass="st-mybox-class" margin="25px 0 25px 0"]
<div class="maruck">
<ul>
<li>率と手数料は申込時点の案内で確認</li>
<li>対応カードは現行情報で確認</li>
<li>現金化はカード会員規約上の禁止行為</li>
</ul>
</div>
[/st-mybox]

注意点を踏まえて使うと決めたら、残る疑問は具体的な手順です。

申込から振込までの流れを見ていきましょう。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
