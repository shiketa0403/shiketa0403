<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>インパクト Step05 H2_4</title>
</head>
<body>
<textarea readonly id="content" style="width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word;">
<h2>知恵袋・5chの投稿を実際に調査</h2>

Yahoo!知恵袋と5chを実際に検索して調査しました。

知恵袋では1件の実投稿を確認できました。

<h3>知恵袋で確認できた実投稿1件</h3>

<strong>今回の調査では、Yahoo!知恵袋でインパクトに関する実投稿を1件確認できました。</strong>

「インパクトという現金化サービスに詳しい方」とメリット・デメリットを尋ねる質問です。

中身は利用体験談ではなく、申込前の情報収集の相談。

生の体験談としては扱えない点を、区別して読みましょう。

<h3>5chでは言及を確認できず</h3>

<strong>5chでは、インパクトの利用者による生の書き込みを確認できませんでした。</strong>

「インパクト」が一般的な言葉で、固有の言及を特定しにくいためです。

フォントのImpactに関する質問のような、無関係な情報も検索に混ざります。

実投稿が限られる以上、確認できた事実と掲示を軸に判断しましょう。

生の体験談が少ないからこそ、申込前に押さえるべきは条件面の注意点です。
</textarea>
<button id="copyBtn" style="margin-top: 10px; padding: 8px 24px; font-size: 14px; cursor: pointer;">コピー</button>
<script>
document.getElementById('copyBtn').addEventListener('click', function() {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
