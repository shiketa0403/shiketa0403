<textarea readonly id="content" style="width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word;">
<h2>良い口コミ・評判で目立つ3つの声</h2>

確認できた良い声は、入金の速さ・使い勝手・手続きの簡単さの3点です。

いずれもレビューサイト経由の紹介として整理します。

<h3>数時間で入金できたという声</h3>

<strong>「申し込み後、数時間で入金が確認できた」という声が紹介されています。</strong>

公式サイトの掲示も最短5分で、スピードを打ち出しているためです。

年中無休のため、土日祝の申込にも対応しています。

急ぎの利用では、この体制が前向きな材料です。

<h3>急な出費に対応できたという声</h3>

<strong>「急な出費にも対応できた」という声も紹介されています。</strong>

手元の現金が足りない場面で、カードの枠から用意できるためです。

申込の入り口は、1分で終わる簡単申込のフォーム。

使う場面を決めてから、金額を絞って申し込みましょう。

<h3>手続きが簡単だったという声</h3>

<strong>「手続きが簡単だった」という満足の声も複数のレビューで紹介されています。</strong>

申込から振込までがWEBと電話のやり取りで完結するためです。

流れは申込→確認→決済→振込の4段階という整理です。

初めてでも、案内に沿って進めれば迷わずに進められます。

一方で、良い声だけを見て決めるのは早計です。

次は目立った指摘を確認します。
</textarea>
<button id="copyBtn" style="margin-top: 10px; padding: 8px 24px; font-size: 14px; cursor: pointer;">コピー</button>

document.getElementById('copyBtn').addEventListener('click', function() {
  navigator.clipboard.writeText(document.getElementById('content').value);
