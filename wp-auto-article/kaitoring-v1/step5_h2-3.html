<!DOCTYPE html>

<body>
<textarea readonly id="content" style="width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word;">
<h2>悪い口コミ・評判で目立つ3つの指摘</h2>

悪い指摘として確認できたのは、受取額・手数料・振込タイミングの3点です。

いずれも申込前の確認で対処できる内容です。

<h3>予想より少なかったという声</h3>

<strong>「予想より受け取れる金額が少なかった」という声が紹介されています。</strong>

最大90%という掲示の印象が強く、少額利用でも同じ率を期待しやすいためです。

期待と実際のずれを生むのは、率だけを見た申込。

90%は初回かつ高額利用時の数字のため、見積もりで振込額を確認すればずれは防げます。

<h3>手数料が高いという指摘</h3>

<strong>「他業者と比べて手数料が高い」という指摘も確認できました。</strong>

振込手数料が数百円程度ユーザー負担となり、少額利用ほど負担感が大きくなるためです。

法外な請求の報告はないものの、1万円前後の利用では数百円でも率に響きます。

手数料込みの振込額で他社と比べれば、実質的な差が明確です。

<h3>振込が遅れたという報告</h3>

<strong>「振込が遅れた」という報告も一部で紹介されています。</strong>

振込先の銀行・申込時間・土日祝の条件によって、翌日扱いに回る場合があるためです。

営業時間は9:00〜20:00で、時間外の申込は翌日対応です。

急いでいる場合は、営業時間内の早い時間帯に申し込みましょう。

ここまでの声は、いずれもレビューサイト経由の紹介です。

では、知恵袋や5chに生の投稿はあるのでしょうか。
</textarea>
