<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>カイトリング Step05 H2_4</title>
</head>
<body>
<textarea readonly id="content" style="width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word;">
<h2>知恵袋・5chの投稿を実際に調査</h2>

Yahoo!知恵袋と5chを実際に検索して調査しました。

結論から言うと、どちらでもカイトリングの実投稿は確認できませんでした。

<h3>知恵袋の実投稿は確認できず</h3>

<strong>今回の調査では、Yahoo!知恵袋でカイトリングに関する実投稿を確認できませんでした。</strong>

質問・回答を対象にした検索でも、該当する投稿が見つからなかったためです。

調査に使ったのは、知恵袋内に絞ったsite指定検索を含む複数の方法。

「知恵袋に利用者の口コミは見当たらない」と明言するレビューもあり、調査結果は一致しています。

<h3>5chの生の書き込みも確認できず</h3>

<strong>5chでも、カイトリングの利用者による生の書き込みは確認できませんでした。</strong>

現金化関連のスレッドを検索しても、サービス名への言及が見つからなかったためです。

レビュー側も「5chに利用者の口コミは見当たらない」と記載しています。

実投稿が少ない以上、公式サイトの掲示内容と条件を軸に判断しましょう。

生の口コミに頼れないからこそ、申込前に押さえるべきは条件面の注意点です。
</textarea>
<button id="copyBtn" style="margin-top: 10px; padding: 8px 24px; font-size: 14px; cursor: pointer;">コピー</button>
<script>
document.getElementById('copyBtn').addEventListener('click', function() {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
