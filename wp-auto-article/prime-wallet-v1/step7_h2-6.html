<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>スマホ申込から振込までの手順</h2>

申込はスマホで完結し、来店は不要です。

受付時間と振込時間の違いに注意しながら、流れを見ていきましょう。

[st-timeline myclass="st-timeline-count" add_style=""]
[st-timeline-list text="Web・LINEで申込" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
24時間365日受付・入力後に担当者から連絡が入り見積もり提示
[/st-timeline-list]
[st-timeline-list text="本人確認・カード決済" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
初回は本人確認書類をスマホで撮影して提出し、カード決済を行う
[/st-timeline-list]
[st-timeline-list text="振込完了" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
振込の実行は9時〜20時・最短10分の掲示(報告は1時間以内〜7時間)
[/st-timeline-list]
[/st-timeline]

<h3>Web・LINE申込の流れ</h3>

<span class="st-mymarker-s"><strong>申込はWebフォームかLINEで、24時間365日受け付けています。</strong></span>

手続きは最短3分の掲示で、入力後に担当者から連絡が入り見積もり提示に進むからです。

伝える内容は、氏名・連絡先・希望額・利用カードの4点。

提示された振込額に納得できなければ、<span class="hutoaka">この段階で断りましょう</span>。

<h3>本人確認とカード決済</h3>

<span class="st-mymarker-s"><strong>初回は本人確認書類の提出とカード決済が必要です。</strong></span>

現金化は商品売買の形式を取り、本人確認が法令上必須だからです。

運転免許証やマイナンバーカードをスマホで撮影して提出します。

決済前に、金額と商品の内容を確認しましょう。

[st-kaiwa1]初回は本人確認がある分、時間に余裕を見ておくと安心です。[/st-kaiwa1]

<h3>振込完了までの時間目安</h3>

<span class="st-mymarker-s"><strong>振込は最短10分の掲示ですが、実際は幅があります。</strong></span>

振込の実行が9時〜20時に限られ、混雑や確認の状況で前後するからです。

確認できた報告は、<span class="hutoaka">初回1時間以内から7時間まで</span>。

<table>
<thead><tr><th>項目</th><th>時間</th></tr></thead>
<tbody>
<tr><td>Web・LINE受付</td><td>24時間365日</td></tr>
<tr><td>振込の実行</td><td>9時〜20時</td></tr>
<tr><td>掲示の振込速度</td><td>最短10分</td></tr>
<tr><td>確認できた報告</td><td>初回1時間以内〜7時間</td></tr>
</tbody>
</table>

当日中に受け取りたい場合は午前中の申込がおすすめです。

手順を把握したら、最後に記事全体の要点を整理します。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
