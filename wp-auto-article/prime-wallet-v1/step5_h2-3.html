<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>悪い口コミ・評判に多い3つの不満</h2>

確認できた不満は、受取額・振込時間・キャンペーン条件の3つに集中しています。

表示との差がどれほどだったのか、報告の内容をそのまま紹介します。

<h3>10万円で7万円という振込報告</h3>

「10万円の申込で、振り込まれたのは7万円だった」という報告があります。

表示の88%で計算した8万8,000円との差は1万8,000円で、決して小さくないからです。

換算すると換金率70%。

レビューサイトの集計でも60%〜83%程度の幅が報告されており、金額の差は最大の不満点です。

<h3>最短10分と7時間かかった報告の差</h3>

「最短10分と聞いたのに、振込まで7時間かかった」という報告があります。

混雑や確認作業に加え、振込の実行が9時〜20時に限られるからです。

Web受付自体は24時間365日ですが、夜間の申込は翌日扱いになる場合があります。

初回1時間以内との報告もあり幅が大きいため、時間には余裕を見ておきましょう。

<h3>初回100%が適用されにくい条件</h3>

初回還元率100%を額面どおり受け取れたという報告は確認できませんでした。

キャンペーンはページを開いてから15分間の申込に限られ、利用額の目安も設けられているからです。

条件は、15分以内の申込と一定額以上の利用。

手数料が引かれるため「10万円決済で10万円振込」にはならないとの解説が複数あります。

適用の可否は、申込前の見積もりで確認しましょう。

では、知恵袋や5chには実際の投稿があるのでしょうか。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
