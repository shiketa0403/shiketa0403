<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>申込前に知るべき3つの注意点</h2>

「騙された」と感じる声の多くは、仕組みを知らないまま申し込んだことに原因があります。

申込前に3つの注意点を確認しましょう。

<h3>消費税10%が引かれる計算構造</h3>

受取額の計算には、商品代金にかかる消費税10%が影響します。

現金化は商品購入の形式を取るため、カード決済額は税込金額になるからです。

現金3万円の受け取りに4万円分の商品購入が必要な例では、税込の決済額は4万3,200円。

この場合の換金率は計算上69%で、「率が思ったより低い」と感じる原因の多くはこの構造です。

決済額ベースの振込額を見積もりで確認しましょう。

<h3>商品発送による家族バレの可能性</h3>

キャッシュバック方式のため、購入した商品が自宅に届く場合があります。

カード会社に説明のつく実体のある売買として、商品の受け渡しが行われるからです。

「家族に知られたくない場合は注意」との指摘がレビューサイトに複数あります。

受取方法や配送の有無は、申込時に確認しましょう。

<h3>カード会員規約上の禁止行為</h3>

クレジットカードの現金化は、業者を問わずカード会社が禁止している行為です。

カード会社の規約で「換金目的の利用」が明示的に禁止されているからです。

発覚した場合、カードの利用停止や強制退会につながるリスクがあります。

業者選び以前に、この前提を理解した上で判断しましょう。

注意点を押さえたところで、実際の申込手順を確認します。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
