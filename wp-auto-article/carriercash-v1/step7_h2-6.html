<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>スマホ申込から振込までの手順</h2>

申込はスマホで完結し、来店は不要です。

Web査定から振込までの流れを順に見ていきましょう。

[st-timeline myclass="st-timeline-count" add_style=""]
[st-timeline-list text="査定フォームで申込" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
公式サイトの査定フォームで申込み、振込額の提示を受ける
[/st-timeline-list]
[st-timeline-list text="本人確認・キャリア決済" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
初回は本人確認を行い、自分のキャリアの決済枠で購入する
[/st-timeline-list]
[st-timeline-list text="振込完了" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
掲示は最短15分(確認できた声は10分以内・1時間以内)
[/st-timeline-list]
[/st-timeline]

<h3>Web査定から見積もりの流れ</h3>

<span class="st-mymarker-s"><strong>申込は公式サイトの査定フォームから始まります。</strong></span>

査定後に振込額の提示があり、納得してから決済に進む流れだからです。

掲げる流れは、申込・決済・振込の3段階。

提示された振込額に納得できなければ、<span class="hutoaka">この段階で断りましょう</span>。

<h3>本人確認とキャリア決済</h3>

<span class="st-mymarker-s"><strong>初回は本人確認と、キャリア決済での購入手続きが必要です。</strong></span>

現金化は商品売買の形式を取り、本人確認が法令上必須だからです。

決済は自分のキャリアの決済枠(<strong>au・docomo・SoftBank</strong>)から選びます。

決済前に、金額と商品の内容を確認しましょう。

[st-kaiwa1]初回は本人確認がある分、時間に余裕を見ておくと安心です。[/st-kaiwa1]

<h3>振込完了までの時間目安</h3>

<span class="st-mymarker-s"><strong>振込は最短15分の掲示ですが、実際は幅があります。</strong></span>

初回の本人確認や混雑で、<span class="hutoaka">所要時間が前後する</span>からです。

確認できた声は、10分以内や1時間以内という内容。

<table>
<thead><tr><th>項目</th><th>内容</th></tr></thead>
<tbody>
<tr><td>受付</td><td>Web査定フォーム</td></tr>
<tr><td>掲示の振込速度</td><td>最短15分</td></tr>
<tr><td>確認できた声</td><td>10分以内の着金・1時間以内・土日入金</td></tr>
<tr><td>手数料の注意</td><td>1万円以上は無料・5,000円以下は200円の紹介</td></tr>
</tbody>
</table>

当日中に受け取りたい場合は、早めの時間帯の申込がおすすめです。

手順を把握したら、最後に記事全体の要点を整理します。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
