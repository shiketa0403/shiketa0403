<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>口コミ評判の実調査結果</h2>

知恵袋・5ch・レビューサイトの3経路を実際に調査しました。

確認できた投稿と調査結果を紹介します。

<h3>知恵袋の利用停止相談</h3>

知恵袋には「友人がカード利用停止になった」との趣旨の相談投稿があります。

あんしんクレジットの利用をめぐり、消費者センターに相談したという内容だからです。

回答本文はアクセス制限により確認できず、投稿の詳細は不明。

同名をかたる勧誘メールの質問も混在するため、投稿は文脈ごと確認しましょう。

<h3>5chの換金率相違報告</h3>

5chでは「公式記載の換金率と実際が違った」との書き込みが報告されています。

「実際は65〜70%前後だった」という低率の報告を紹介するメディアがあるからです。

生のスレッドや書き込みは、今回の調査では直接確認できませんでした。

書き込みを鵜呑みにせず、参考情報のひとつとして扱いましょう。

<h3>レビューサイトの評価傾向</h3>

レビューサイトでは「対応が丁寧・振込が早い」という好意的な評価が目立ちます。

「本人確認後10〜30分で振込」という報告が並ぶからです。

振り込まれない詐欺の集団報告は、調査の範囲では確認できませんでした。

口コミの実態を踏まえ、自分が利用に向くタイプかを次で整理します。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
