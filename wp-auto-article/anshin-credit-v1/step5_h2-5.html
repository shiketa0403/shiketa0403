<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>向いている人と向かない人</h2>

申込金額・急ぎ度・規約リスクの3点で適合性が分かれます。

具体的な人物像で整理しましょう。

<h3>利用が向く人の条件</h3>

最大値でなく、見積もりの振込額で判断できる人に向きます。

実勢の報告に、98%から65〜70%前後まで幅があるためです。

90万円超のまとまった決済なら、高率の事例に近づきやすい設計。

電話の案内を受けながら進めたい人にも、オペレーター対応は相性が良好です。

<h3>利用を控えるべき人の特徴</h3>

99.5%をそのまま手取りと考える人には向きません。

最大値は大口向けで、65〜70%前後だったという報告もあるからです。

「夜間に今すぐ入金してほしい人」「カードローン審査に通る属性の人」も該当します。

該当する場合は、金利が明確な消費者金融・カードローンを選びましょう。

利用に向くと判断した方は、申込手順を次で確認しましょう。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
