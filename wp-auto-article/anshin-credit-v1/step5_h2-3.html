<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>注意したい3つのデメリット</h2>

判断を誤りやすいのは時間・金額条件・規約リスクの3点です。

3つの注意点を事前に押さえましょう。

<h3>即日振込は9時〜20時</h3>

即日振込の対象は、営業時間9時〜20時内の申込です。

受付は24時間でも、振込処理は営業時間内に行われるからです。

夜間の申込は、翌日の対応に回る可能性。

急ぎの場合は、日中の早い時間に申込みましょう。

<h3>少額帯で下がる換金率</h3>

少額の申込では、換金率が公表の最大値より下がります。

98%の事例は90万円以上の大口で、率は金額に連動するからです。

一般的な10万〜20万円の申込では、最大値でなく実勢の幅で考える方が現実的です。

見積もりで、自分の金額帯の率を確認しましょう。

<h3>カード会員規約違反のリスク</h3>

クレジットカード現金化はカード会員規約上の禁止行為です。

カード会社の規約で「換金目的の利用」が明示的に禁止されているからです。

発覚時は利用停止・残額の一括請求・強制解約のリスクがあります。

利用は自己責任が前提と理解しておきましょう。

規約リスクの実例も含めて、次で実調査の結果を確認します。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
