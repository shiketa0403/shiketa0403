<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>申込前に知るべき3つの注意点</h2>

不安の多くは、数字の読み方と情報の見分け方で小さくできます。

申込前に3つの注意点を確認しましょう。

<h3>実測60%台〜75%という率の紹介</h3>

実測の換金率は、60%台から75%前後という紹介が中心です。

掲示の最大99.5%や換金率表の90%は、条件がそろった場合の値だからです。

10万円なら、90%と75%で手取りに1万5000円の差。

率の3つの層を分けて、見積もりの振込額で判断しましょう。

<h3>創業30年と4年程という紹介のゆれ</h3>

創業年の紹介は、30年・28年・4年程と媒体によって分かれています。

公式の掲示とレビューサイトの調査で、根拠が異なるからです。

どれが正しいかを断定する検証は、今回の調査では見当たりませんでした。

実績の数字は、うのみにせず参考程度にとどめましょう。

<h3>カード会員規約上の禁止行為</h3>

クレジットカードの現金化は、カード会社が禁止している行為です。

カード会社の規約で「換金目的の利用」が明示的に禁止されているからです。

発覚すると、利用停止や強制解約につながる可能性があります。

業者選び以前に、この前提を理解した上で判断しましょう。

注意点を押さえたところで、実際の申込手順を確認します。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
