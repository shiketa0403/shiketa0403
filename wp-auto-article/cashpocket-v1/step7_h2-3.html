<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>悪い口コミ・評判で目立つ3つの指摘</h2>

目立つ指摘は、手数料・率の差・連絡の途絶の3つです。

内容をそのまま紹介します。

<h3>高い手数料を引かれたという声</h3>

<span class="st-mymarker-s"><strong>「高い手数料を引かれた」という声の紹介があります。</strong></span>

換金率の掲示とは別に、<span class="hutoaka">手数料が手取りから差し引かれる</span>からです。

手数料の扱いは、事前の問い合わせで確認できるという整理。

見積もりでは、手数料込みの振込額を確認しましょう。

[st-kaiwa1]率だけでなく、手数料込みの振込額で比べましょう。[/st-kaiwa1]

<h3>表示どおりの率になりにくい指摘</h3>

<span class="st-mymarker-s"><strong>「Webサイトの記載どおりの換金率になることはあまりない」という指摘があります。</strong></span>

最大99.5%は上限で、<span class="hutoaka">キャンペーンと高額決済がそろった場合の値</span>だからです。

最大98.6%と紹介するレビューもあり、紹介の数字にもゆれがあります。

適用される率は、申込時の見積もりで確認しましょう。

<h3>その後連絡がつかないという声</h3>

<span class="st-mymarker-s"><strong>「その後連絡がつかない」という声の紹介があります。</strong></span>

担当者や混雑によって、対応に差が出る場合があるからです。

「説明どおりに進んだ」という逆の声も、同じ媒体で紹介されています。

<span class="hutoaka">連絡が途切れたら、追いかけずに</span>他の選択肢も検討しましょう。

では、知恵袋や5chには実際にどんな投稿があるのでしょうか。
</textarea>

document.getElementById('copyBtn').addEventListener('click', () => {
