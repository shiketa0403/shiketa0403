<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>悪い口コミ・評判で目立つ3つの指摘</h2>

目立つ指摘は、体験検証・少額時の率・掲載実績の3つです。

内容をそのまま紹介します。

<h3>換金率が低かったという体験検証</h3>

「実際に利用したら換金率が低かった」という体験検証があります。

表示の率と実際の受取額の差を指摘する記事が公開されているからです。

「やばい業者だった」という趣旨の批判的な体験記事も。

決済前に振込額の提示を受け、金額で判断しましょう。

<h3>少額は率が下がるという指摘</h3>

1万円のような少額は、換金率が下がるという指摘があります。

利用額が多いほど率が上がる設計だからです。

3万円以上の利用を推奨する紹介もあります。

少額で使う場合ほど、見積もりの振込額を確認しましょう。

<h3>掲載実績への疑義という指摘</h3>

サイトの掲載実績に疑義がある、という指摘があります。

ドメイン取得日(2017年12月)より前の「2016年の顧客満足度」を掲載していたからです。

「誇大表記の可能性」に触れるレビューもあります。

掲示の数字は鵜呑みにせず、確認できた事実で判断しましょう。

では、知恵袋や5chには実際の投稿があるのでしょうか。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
