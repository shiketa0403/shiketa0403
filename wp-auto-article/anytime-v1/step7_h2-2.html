<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>良い口コミ・評判に多い3つの声</h2>

確認できた肯定的な口コミを紹介します。

評価は振込の速さ・率の適用・対応範囲の3点です。

<h3>30分で振り込まれたという声</h3>

<span class="st-mymarker-s"><strong>「申込から30分くらいで振り込まれた」という声があります。</strong></span>

平均入金時間は<strong>10〜30分</strong>という紹介もあるからです。

公式サイトの声には「10分くらいで入金された」「日曜でも使えた」という掲載もあります。

土日祝も対応の掲示で、急ぎの場面でも選択肢に入ります。

<h3>案内どおりの率だったという声</h3>

<span class="st-mymarker-s"><strong>「案内された換金率がそのまま適用された」という声が確認できました。</strong></span>

見積もりで提示された条件が、決済後に変わらなかったという趣旨だからです。

手続きがスピーディーで対応も丁寧だったという紹介も。

提示条件は、やり取りの記録を残しながら確認しましょう。

[st-kaiwa1 r]提示された条件で進めたい方には、相性のよいサービスです。[/st-kaiwa1]

<h3>対応カードが広いという評価</h3>

<span class="st-mymarker-s"><strong>「他社で扱えないカードも扱えた」という評価があります。</strong></span>

後払いアプリを中心に、対応範囲が広いからです。

<strong>PaidyやPayPay、バンドルカード・B/43</strong>を含むアプリに対応しています。

自分のカードやアプリが対象かは、申込前に確認しましょう。

[st-mybox title="こんな方に向いています" webicon="st-svg-check-circle" color="#757575" bordercolor="#BDBDBD" bgcolor="#ffffff" borderwidth="2" borderradius="5" titleweight="bold" fontsize="" myclass="st-mybox-class" margin="25px 0 25px 0"]
<div class="maruck">
<ul>
<li>Paidy・PayPay・バンドルカード・B/43を現金化したい方</li>
<li>土日祝にも申し込みたい方</li>
<li>他社で断られたカードを相談したい方</li>
</ul>
</div>
[/st-mybox]

一方で、悪い口コミや指摘には申込前に知っておきたい内容が含まれています。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
