<!DOCTYPE html>

<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>知恵袋・5chの投稿を実際に調査</h2>

「エニタイム現金化 知恵袋」と検索する人は多いものの、投稿の状況は意外な結果でした。

本記事で実際に調査した内容を紹介します。

<h3>知恵袋は申込を迷う相談が1件</h3>

Yahoo!知恵袋で確認できた実投稿は、「申込を迷っている」という相談1件でした。

「口コミがあまりないので迷う」という内容で、口コミの少なさ自体が相談されているからです。

ほかの検索結果は、ジムのエニタイムフィットネスの質問。

同名のジムの話題と混同しないようにしましょう。

<h3>5chの生の書き込みは確認できず</h3>

5chでは、エニタイムに関する生の書き込みは今回の調査では確認できませんでした。

「5chの口コミ」を扱うレビュー記事でも、元の投稿の引用は確認できないからです。

掲示板上の情報が少なく、確認できた口コミはレビューサイト経由が中心です。

出どころの分からない引用は、確認できた事実と分けて判断しましょう。

ここまでは口コミの話でしたが、数字と掲示の見方も押さえておきましょう。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
