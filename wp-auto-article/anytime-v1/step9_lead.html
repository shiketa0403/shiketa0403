後払いアプリ対応と最大98%台の換金率を掲げるサービスですが、表示どおり受け取れるのかを確かめてから使いたいところです。

本記事では知恵袋・5ch・レビューサイトを実際に調査し、確認できた内容だけを紹介します。

<span class="st-mymarker-s">調査の結論として、未入金の集団報告は見当たらない一方、手取り70〜85%程度という紹介があり、知恵袋の実投稿は申込を迷う相談1件だけでした。</span>

少額ほど率が下がる指摘や、最短3分がリピーター向けの掲示である点も整理しました。

メリットとデメリットの両面を確認し、自分に合うサービスかを判断できる内容です。

 	<li>未入金の集団報告なし・30分で振込の声あり</li>
 	<li>最短3分はリピーター向け・少額は率が下がる指摘</li>
