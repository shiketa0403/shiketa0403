<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>申込前に知るべき3つの注意点</h2>

申込を決める前に、率の読み方・時間・規約の3点を押さえておきましょう。

特に3つ目は、現金化サービス全体に共通する重要な注意点です。

<h3>レート表とシミュは最大値</h3>

<span class="st-mymarker-s"><strong>レート表とシミュレーションの数字は、いずれも最大値です。</strong></span>

手数料の差引や条件により、<span class="hutoaka">受取額は表示より下がる場合</span>があります。

実例の報告でも、83%から約94%まで幅。

確定額は、見積もりの文面で受け取ってから判断しましょう。

[st-kaiwa1 r]シミュは上限の目安。文面の実額で決めると安心ですね。[/st-kaiwa1]

<h3>対応と振込は9〜20時が目安</h3>

<strong>対応と振込の目安は、9時から20時の営業時間内です。</strong>

受付は24時間でも、確認と振込の処理は<span class="hutoaka">営業時間に沿って進む</span>ためです。

「約3時間かかった」という検証も、時間帯や混雑の影響と読めます。

<span class="st-mymarker-s">受け取りたい時刻から逆算して</span>、申込の時間を決めましょう。

<h3>カード会員規約上の禁止行為</h3>

<span class="st-mymarker-s"><strong>クレジットカード枠の現金化は、カード会員規約上の禁止行為に該当します。</strong></span>

カード会社の規約で「換金目的の利用」が明示的に禁止されているからです。

発覚した場合、カードの<span class="hutoaka">利用停止や強制解約</span>につながるおそれがあります。

日本クレジット協会も、ショッピング枠の現金化を利用しないよう注意を呼びかけています。

ペイディやバンドルカードにも換金目的を禁じる規約があるため、後払いアプリでの利用も同じリスクを踏まえて判断しましょう。

[st-mybox title="注意ポイント" webicon="st-svg-exclamation-circle" color="#ef5350" bordercolor="#ef9a9a" bgcolor="#ffebee" borderwidth="2" borderradius="5" titleweight="bold" fontsize="" myclass="st-mybox-class" margin="25px 0 25px 0"]
<div class="maruck">
<ul>
<li>レート表とシミュは最大値</li>
<li>対応と振込は9〜20時が目安</li>
<li>現金化はカード会員規約上の禁止行為</li>
</ul>
</div>
[/st-mybox]

注意点を踏まえて使うと決めたら、残る疑問は具体的な手順です。

申込から振込までの流れを見ていきましょう。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
