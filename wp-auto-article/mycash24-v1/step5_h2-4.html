<!DOCTYPE html>
<html lang="ja">

<meta charset="UTF-8">
<title>マイキャッシュ Step05 H2_4</title>

<body>
<textarea readonly id="content" style="width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word;">
<h2>知恵袋・5chの投稿を実際に調査</h2>

Yahoo!知恵袋と5chを実際に検索して調査しました。

名指しの投稿は、確認できていません。

<h3>知恵袋の投稿は特定できず</h3>

知恵袋では、マイキャッシュ24を名指しした投稿を特定できませんでした。

「知恵袋情報まとめ」と題する記事にも、元の投稿の引用が見当たらないためです。

検索に混ざるのは、同名の別サービスやレビューサイト同士の紹介記事。

「知恵袋の口コミ」と称する記事も、元の投稿を確かめてから読みましょう。

<h3>5chは90%を疑う声の紹介のみ</h3>

5chでは、「初回90%は本当か」と疑う声の紹介を確認しました。

ただし当方の検索では、元のレスそのものは特定できていません。

元の書き込みが示されない紹介は、傾向の参考にとどまります。

疑問の中身は、自分の見積もりで確かめて解消しましょう。

生の声が少ないからこそ、申込前に押さえるべきは数字の条件と確認の手順です。
</textarea>
<button id="copyBtn" style="margin-top: 10px; padding: 8px 24px; font-size: 14px; cursor: pointer;">コピー</button>
<script>
document.getElementById('copyBtn').addEventListener('click', function() {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
