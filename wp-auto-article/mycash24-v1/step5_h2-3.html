<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>マイキャッシュ Step05 H2_3</title>
</head>
<body>
<textarea readonly id="content" style="width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word;">
<h2>悪い口コミ・評判で目立つ3つの指摘</h2>

気になる指摘は、シミュとの差・振込時間・電話対応の3つです。

いずれも申込前の対処で織り込めます。

<h3>シミュレーションと違ったという声</h3>

「シミュレーションと実際の率が違った」という声が紹介されています。

レート表もシミュレーションも、上限を示す最大値のためです。

実例の報告も、50万円で83%と45万円で約94%に分かれる状況。

期待値は目安の数字でなく、文面の見積もりで作りましょう。

<h3>振込まで3時間かかった検証</h3>

「振込完了まで約3時間かかった」という検証があります。

最短10分の紹介はあっても、混雑や時間帯で所要が延びるためです。

「入金が遅れた」「営業時間外は対応されない」という声も紹介されています。

当日中に使う日は、時間に余裕を持って申し込みましょう。

<h3>知らない番号からの電話の報告</h3>

「知らない番号から電話が来た」という報告が紹介されています。

申込後の確認連絡が、携帯番号から届く場合があるためです。

心当たりのない着信は、社名を確かめてから話を進めると混乱を防げます。

電話の内容は、メールやSMSの文面でも残しましょう。

ここまでの声はレビューサイト経由の紹介が中心です。

では、知恵袋や5chに生の投稿はあるのでしょうか。
</textarea>
<button id="copyBtn" style="margin-top: 10px; padding: 8px 24px; font-size: 14px; cursor: pointer;">コピー</button>
<script>
document.getElementById('copyBtn').addEventListener('click', function() {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
