<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>悪い口コミ・評判で目立つ3つの指摘</h2>

目立つ指摘は、批判的な体験記事・振込の遅さ・申込時間帯の3つです。

内容をそのまま紹介します。

<h3>やばい業者だったという体験記事</h3>

「やってみた結果やばい業者だった」という趣旨の批判的な体験記事があります。

表示の率と実際の受取額の差を指摘する検証が公開されているからです。

換金率約83%だったという体験談とも方向が一致する内容。

決済前に振込額の提示を受け、金額で判断しましょう。

<h3>商品発送を挟み振込が遅い指摘</h3>

商品発送を挟むため、振込が遅いわりに換金率も悪いという指摘があります。

取引が商品売買の形式で、発送や確認の工程が入る場合があるからです。

「最近の業者と比べて使い勝手が悪い」という比較の声も紹介されています。

急ぎの場合は、振込までの流れを申込時に確認しましょう。

<h3>夕方申込は翌営業日という注意</h3>

夕方に申し込むと、入金が翌営業日になるという注意の紹介があります。

銀行の反映タイミングと営業時間の関係で、当日中に間に合わない場合があるからです。

土日祝は休業という指摘もあります。

当日中に受け取りたい場合は、午前中の申込がおすすめです。

では、知恵袋や5chには実際の投稿があるのでしょうか。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
