<!DOCTYPE html>
<html lang="ja">
<head>

<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>良い口コミ・評判に多い3つの声</h2>

確認できた肯定的な口コミを紹介します。

評価は入金の速さ・サイトの使いやすさ・買取率の3点です。

<h3>1時間以内に入金されたという声</h3>

<span class="st-mymarker-s"><strong>「申込から1時間以内に入金された」という声があります。</strong></span>

即日専門店として、<strong>最短3分</strong>入金の4ステップを掲げているからです。

入金スピードの口コミは、早いという評価が中心という紹介もあります。

急ぎの場面でも候補になるスピード感です。

[st-kaiwa1 r]午前中に動ける方なら、即日の候補になるサービスです。[/st-kaiwa1]

<h3>サイトが使いやすいという評価</h3>

<span class="st-mymarker-s"><strong>「サイトが使いやすい」という評価が確認できました。</strong></span>

申込から必要書類の案内まで、公式サイトで完結する設計だからです。

申込フォームの受付自体は24時間という紹介も。

不明点は電話(<strong>0120-784-911</strong>)で確認しながら進められます。

<h3>買取率に満足という口コミの紹介</h3>

<span class="st-mymarker-s"><strong>「買取率に満足している」という口コミの紹介があります。</strong></span>

提示された金額に納得してから進められるからです。

Paidy・メルペイ・PayPayを含む後払いアプリ5種にも対応しています。

率は条件で変わるため、自分の枠で見積もりを取りましょう。

[st-mybox title="こんな方に向いています" webicon="st-svg-check-circle" color="#757575" bordercolor="#BDBDBD" bgcolor="#ffffff" borderwidth="2" borderradius="5" titleweight="bold" fontsize="" myclass="st-mybox-class" margin="25px 0 25px 0"]
<div class="maruck">
<ul>
<li>平日の早い時間帯に申し込める方</li>
<li>Paidy・メルペイ・PayPayの後払いアプリも使いたい方</li>
<li>運営歴の長い業者を選びたい方</li>
</ul>
</div>
[/st-mybox]

一方で、悪い口コミや指摘には申込前に知っておきたい内容が含まれています。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
