<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>申込前に知るべき3つの注意点</h2>

不安の多くは、条件の読み方と取引の進め方で小さくできます。

申込前に3つの注意点を確認しましょう。

<h3>88%からという換金率の下限</h3>

<span class="st-mymarker-s"><strong>実際の換金率は88%からで、利用額に応じて変動します。</strong></span>

98.8%は最高値の掲示で、<span class="hutoaka">全員に適用される率ではない</span>からです。

初回5%UPも、初回限定のキャンペーン。

自分に適用される率は、見積もりの振込額で確認しましょう。

[st-kaiwa1 r]見積もりの振込額で判断すると、率の差で迷わずに済みます。[/st-kaiwa1]

<h3>モアタイム非対応口座の遅延</h3>

<span class="st-mymarker-s"><strong>振込先の口座がモアタイム非対応だと、入金が遅れる場合があります。</strong></span>

モアタイム(24時間即時振込の仕組み)に非対応の銀行は、<span class="hutoaka">反映が翌営業日になる</span>からです。

遅延の理由として、指定商品の決済未完了も挙げられています。

急ぎなら、即時振込に対応した口座を振込先に指定しましょう。

<h3>カード会員規約上の禁止行為</h3>

<span class="st-mymarker-s"><strong>クレジットカードの現金化は、カード会社が禁止している行為です。</strong></span>

カード会社の規約で「換金目的の利用」が明示的に禁止されているからです。

発覚すると、<span class="hutoaka">利用停止や強制解約</span>につながる可能性があります。

業者選び以前に、この前提を理解した上で判断しましょう。

[st-mybox title="注意ポイント" webicon="st-svg-exclamation-circle" color="#ef5350" bordercolor="#ef9a9a" bgcolor="#ffebee" borderwidth="2" borderradius="5" titleweight="bold" fontsize="" myclass="st-mybox-class" margin="25px 0 25px 0"]
<div class="maruck">
<ul>
<li>98.8%は最高値・実際は88%からの変動制</li>
<li>モアタイム非対応口座は入金が翌営業日になる場合あり</li>
<li>現金化はカード会員規約上の禁止行為</li>
</ul>
</div>
[/st-mybox]

注意点を押さえたところで、実際の申込手順を確認します。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
