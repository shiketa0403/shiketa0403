<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>スマホ申込から振込までの手順</h2>

申込はスマホで完結し、来店は不要です。

フォーム申込から振込までの流れを順に見ていきましょう。

[st-timeline myclass="st-timeline-count" add_style=""]
[st-timeline-list text="フォームで申込" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
公式サイトのフォーム(受付24時間)で申込み、スタッフからの電話で条件の説明を受ける
[/st-timeline-list]
[st-timeline-list text="指定商品をカードで決済" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
条件に納得したら、指定された商品をクレジットカードで決済する
[/st-timeline-list]
[st-timeline-list text="買取代金の振込" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
掲示は最短5分(実測は10分〜1時間程度・初回は約1時間・夜間は翌営業日)
[/st-timeline-list]
[/st-timeline]

<h3>フォーム申込と電話確認の流れ</h3>

<span class="st-mymarker-s"><strong>申込は公式サイトのフォームから始まります。</strong></span>

送信後にスタッフから電話があり、条件の説明を受けてから進む流れだからです。

フォーム受付は<strong>24時間</strong>・見積もりは無料という掲示。

提示された振込額に納得できなければ、<span class="hutoaka">この段階で断りましょう</span>。

<h3>指定商品の決済という現金化式</h3>

<span class="st-mymarker-s"><strong>条件に納得したら、指定された商品をカードで決済します。</strong></span>

現金化は商品売買の形式を取るからです。

決済が完了しないと、振込手続きが進まない点も指摘されています。

決済前に、金額と商品の内容を確認しましょう。

[st-kaiwa1]決済する商品と金額は、決済前に画面で確認しておきましょう。[/st-kaiwa1]

<h3>振込完了までの時間目安</h3>

<span class="st-mymarker-s"><strong>振込は最短5分の掲示ですが、実際は幅があります。</strong></span>

初回の本人確認や混雑、夜間の申込で<span class="hutoaka">所要時間が変わる</span>からです。

確認できた整理は、日中で10分から1時間程度という内容。

<table>
<thead><tr><th>項目</th><th>内容</th></tr></thead>
<tbody>
<tr><td>受付</td><td>WEBフォーム(24時間)</td></tr>
<tr><td>掲示の振込速度</td><td>最短5分</td></tr>
<tr><td>実測の目安</td><td>日中で10分〜1時間程度</td></tr>
<tr><td>時間がかかる条件</td><td>初回は約1時間・夜間は翌営業日</td></tr>
</tbody>
</table>

当日中に受け取りたい場合は、早めの時間帯の申込がおすすめです。

手順を把握したら、最後に記事全体の要点を整理します。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
