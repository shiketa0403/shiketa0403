<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>悪い口コミ・評判で目立つ3つの指摘</h2>

目立つ指摘は、率の差・初回の振込時間・夜間の条件の3つです。

内容をそのまま紹介します。

<h3>表示と実際の率が違うという指摘</h3>

「公式サイトの換金率と実際の率が違った」という指摘の紹介があります。

98.8%は最高値で、実際は88%からと利用額に応じて変動するからです。

10万円の利用で98.8%と88%なら、手取りの差は約1万円。

適用される率は、申込時の見積もりで確認しましょう。

<h3>初回は約1時間という振込の差</h3>

初回は申込から入金まで、約1時間かかるという紹介があります。

初回は本人確認の手続きが加わるからです。

混雑時には、さらに時間がかかるケースも紹介されています。

初回に限っては、最短5分を前提にせず余裕を見ておきましょう。

<h3>夜間は翌営業日という振込条件</h3>

夜間の申込は、振込が翌営業日になるという整理があります。

WEB受付は24時間でも、振込は銀行と営業体制の影響を受けるからです。

「1週間後に振込された」というケースの紹介もあります。

当日中に受け取りたい場合は、日中の早い時間に申し込みましょう。

では、知恵袋や5chには実際の投稿があるのでしょうか。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
