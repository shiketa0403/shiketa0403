<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>利用者が感じる3つのメリット</h2>

強みは振込スピード・対応範囲・営業日の3点です。

申込前に把握しておくと判断がぶれません。

<h3>最短5分の振込スピード</h3>

振込は最短5分という解説があります。

決済確認後、すぐに振込処理へ進む体制だからです。

「すぐに入金された」というアンケートの声も明示。

初回は本人確認の分、時間には余裕を持って申込みましょう。

<h3>後払いアプリ対応の広さ</h3>

クレジットカードのほか、後払いアプリにも対応するという解説があります。

メルペイ・ペイディ・バンドルカードへの対応を紹介するメディアがあるからです。

カードの枠を使い切った人の受け皿になる対応範囲です。

利用中のアプリが対象かは、申込時に確認しましょう。

<h3>土日祝も9時〜17時営業</h3>

土日祝も9時〜17時まで営業しています。

平日は9時〜18時の体制で、週末も申込めるからです。

週末の急な出費に対応しやすい営業日の設計。

夕方以降の申込は、当日中に間に合うか電話で確認しましょう。

ただし、メリットの裏側には確認すべき注意点もあります。

申込前に整理しておきましょう。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
