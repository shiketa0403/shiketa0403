<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>和光クレジットの申込の流れ</h2>

申込はスマホ完結で、事前準備とリスク確認を済ませれば当日中に入金まで進みます。

<h3>スマホ完結の3ステップ</h3>

<strong>流れは「お申込み・お電話・お振込み」の3ステップで、スマホだけで完結します。</strong>

来店・郵送・FAX不要のオンライン完結設計のためです。

公式フォームでの申込、スタッフからの折り返し電話での確認、決済完了後の振込の順で進行します。

営業時間内なら、決済確認から最短5分での入金が現実的です。

<h3>必要書類と本人確認</h3>

<strong>必要書類は本人確認書類・利用するクレジットカード・本人名義の振込口座の3点です。</strong>

サービス運営上、本人確認と利用枠の確認が必要な工程のためです。

具体的に揃えるのは次の3点。

<ul>
<li>運転免許証またはマイナンバーカード</li>
<li>クレジットカード(本人名義)</li>
<li>本人名義の振込先口座</li>
</ul>

和光クレジットは「カード番号・セキュリティコードは聞かない」運用で、セキュリティ配慮の申込プロセスです。

在籍確認もない設計のため、勤務先への連絡を心配する必要はありません。

<h3>カード利用停止リスクの確認</h3>

<strong>ショッピング枠の現金化は、カード会社の会員規約で禁止された行為です。</strong>

換金目的のカード利用が発覚すると、利用停止・残額の一括請求・強制解約の処分対象になるためです。

VISA・Mastercard・JCB・American Expressの主要ブランドいずれの規約にも、換金目的利用の禁止条項があります。

リスクを理解したうえで、自己責任で利用を判断しましょう。

申込手順とリスクを把握したところで、最後に総評をまとめます。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
