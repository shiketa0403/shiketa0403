<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>和光クレジットの申込の流れ</h2>

申込はスマホ完結で、事前準備とリスク確認を済ませれば当日中に入金まで進みます。

<h3>スマホ完結の3ステップ</h3>

<strong>流れは「お申込み・お電話・お振込み」の3ステップで、スマホだけで完結します。</strong>

来店・郵送・FAX不要のオンライン完結設計のためです。

[st-timeline myclass="st-timeline-count" add_style=""]
[st-timeline-list text="お申込み" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
公式フォームから申込内容を送信します。
[/st-timeline-list]
[st-timeline-list text="お電話" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
スタッフからの折り返し電話で金額と条件を確認します。
[/st-timeline-list]
[st-timeline-list text="お振込み" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
営業時間内なら決済確認から最短5分で入金です。
[/st-timeline-list]
[/st-timeline]

<h3>必要書類と本人確認</h3>

<strong>必要書類は本人確認書類・利用するクレジットカード・本人名義の振込口座の3点です。</strong>

サービス運営上、本人確認と利用枠の確認が必要な工程のためです。

具体的に揃えるのは次の3点。

<div class="maruck">
<ul>
<li>運転免許証またはマイナンバーカード</li>
<li>クレジットカード(本人名義)</li>
<li>本人名義の振込先口座</li>
</ul>
</div>

和光クレジットは「<strong>カード番号・セキュリティコードは聞かない</strong>」運用で、セキュリティ配慮の申込プロセスです。

<strong>在籍確認もない設計</strong>のため、勤務先への連絡を心配する必要はありません。

<h3>カード利用停止リスクの確認</h3>

<strong>ショッピング枠の現金化は、カード会社の会員規約で禁止された行為です。</strong>

換金目的のカード利用が発覚すると、<span class="hutoaka">利用停止・残額の一括請求・強制解約</span>の処分対象になるためです。

<strong>VISA・Mastercard・JCB・American Express</strong>の主要ブランドいずれの規約にも、換金目的利用の禁止条項があります。

[st-mybox title="注意ポイント" webicon="st-svg-exclamation-circle" color="#ef5350" bordercolor="#ef9a9a" bgcolor="#ffebee" borderwidth="2" borderradius="5" titleweight="bold" fontsize="" myclass="st-mybox-class" margin="25px 0 25px 0"]
<div class="maruck">
<ul>
<li>ショッピング枠の現金化はカード会員規約の禁止行為</li>
<li>発覚時は利用停止・残額の一括請求・強制解約の対象</li>
<li>主要4ブランド(VISA・Mastercard・JCB・American Express)共通</li>
</ul>
</div>
[/st-mybox]

リスクを理解したうえで、自己責任で利用を判断しましょう。

申込手順とリスクを把握したところで、最後に総評をまとめます。
</textarea>

document.getElementById('copyBtn').addEventListener('click', () => {
