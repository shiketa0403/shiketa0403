<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>注意したい3つのデメリット</h2>

つまずきやすいのは率の差・振込時間・規約リスクの3点です。

3つの注意点を事前に押さえましょう。

<h3>表記と実勢71%の差</h3>

公式表記の率と、実勢71%前後の集計には差があります。

手数料の差引や条件で、受取額が変わるからです。

「表記と大きく違い25%損した」という趣旨の不満も紹介されています。

率でなく、振り込まれる金額で判断しましょう。

<h3>振込6時間近くの報告</h3>

最短5分の掲示に対し、6時間近くかかったという報告があります。

混雑や確認の状況で、処理時間に幅が出るからです。

「朝に申込んで夕方まで待った」という声も確認できる状況。

急ぎの場合も、時間に余裕を見て申込みましょう。

<h3>カード会員規約違反のリスク</h3>

クレジットカード現金化はカード会員規約上の禁止行為です。

カード会社の規約で「換金目的の利用」が明示的に禁止されているからです。

発覚時は利用停止・残額の一括請求・強制解約のリスクがあります。

トラブル0件の掲示があっても、利用は自己責任が前提です。

知恵袋の実投稿も含めて、次で実調査の結果を確認します。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
