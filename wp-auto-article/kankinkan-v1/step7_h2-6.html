<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>スマホ申込から振込までの手順</h2>

申込はスマホで完結し、来店は不要です。

カード決済と本人確認の工程が入ります。

[st-timeline myclass="st-timeline-count" add_style=""]
[st-timeline-list text="フォーム・電話で申込" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
フォームは9時〜18時・電話は9時〜23時(年中無休)・受付後に見積もり提示
[/st-timeline-list]
[st-timeline-list text="本人確認・カード決済" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
初回は本人確認書類をスマホで撮影して提出し、カード決済を行う
[/st-timeline-list]
[st-timeline-list text="振込完了" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
決済確認後に振込・最短5分の掲示(20分の例〜6時間近くの報告まで幅あり)
[/st-timeline-list]
[/st-timeline]

<h3>フォーム・電話申込の流れ</h3>

<span class="st-mymarker-s"><strong>申込はフォーム(9時〜18時)か電話(9時〜23時)で行います。</strong></span>

受付後に担当者から連絡が入り、見積もりの提示に進むからです。

伝えるのは氏名・連絡先・希望額・利用カードの4点。

提示された振込額に納得できない場合は、<span class="hutoaka">この段階で断りましょう</span>。

<h3>本人確認とカード決済</h3>

<span class="st-mymarker-s"><strong>初回は本人確認書類の提出とカード決済が必要です。</strong></span>

現金化は商品売買の形式を取り、本人確認が法令上必須だからです。

運転免許証やマイナンバーカードをスマホで撮影して提出します。

決済前に金額と内容の確認がおすすめです。

[st-kaiwa1]初回は本人確認の分だけ、時間に余裕を見ておくと安心です。[/st-kaiwa1]

<h3>振込完了までの時間目安</h3>

<span class="st-mymarker-s"><strong>振込は決済確認後で、最短5分を掲示しています。</strong></span>

混雑や確認の状況で、処理時間に幅が出るからです。

6時間近くかかった報告もあるため、時間には余裕を見ておきましょう。

当日中に受け取りたい場合は、午前中の申込がおすすめです。

申込手順を把握したら、最後に記事全体の要点をまとめます。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
