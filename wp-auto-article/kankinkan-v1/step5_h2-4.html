<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>口コミ評判の実調査結果</h2>

知恵袋・5ch・レビューサイトの3経路を実際に調査しました。

確認できた投稿と調査結果を紹介します。

<h3>知恵袋の3つの実投稿</h3>

知恵袋には、換金館に関する実投稿が3件確認できました。

仕組みを尋ねる質問や、闇金との関係を心配する相談が投稿されているからです。

「換金率60%だった」との報告を含む、批判寄りの投稿も1件。

回答本文はアクセス制限により確認できず、投稿の要旨のみ紹介しています。

<h3>ステマ指摘への注意</h3>

知恵袋には「ステマ投稿を繰り返している」と指摘する投稿があります。

肯定的な口コミに、宣伝目的が混じる可能性を示す指摘だからです。

指摘の真偽は確認できないため、断定はできません。

肯定・否定のどちらの投稿も、鵜呑みにせず幅で読みましょう。

<h3>5chとレビューの調査結果</h3>

5chでは「換金率が良かった」という書き込みが1件紹介されている程度です。

生のスレッドや書き込みは、今回の調査では直接確認できなかったからです。

レビューサイトには「20分で振込」の肯定と「6時間待ち」の不満が併存します。

口コミの実態を踏まえ、自分が利用に向くタイプかを次で整理します。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
