<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>向いている人と向かない人</h2>

対応カード・急ぎ度・規約リスクの3点で適合性が分かれます。

具体的な人物像で整理しましょう。

<h3>利用が向く人の条件</h3>

表記でなく、見積もりの振込額で判断できる人に向きます。

実勢71%前後の集計と表記に、差があるためです。

他社で断られたカードや法人カードを使いたい人に合う、独自の対応範囲。

夜の時間帯に電話で相談したい人にも、23時までの受付は相性が良好です。

<h3>利用を控えるべき人の特徴</h3>

公式表記の率をそのまま手取りと考える人には向きません。

71%前後の集計や、60%だったという報告があるからです。

「5分以内の入金を前提にする人」「カードローン審査に通る属性の人」も該当します。

該当する場合は、金利が明確な消費者金融・カードローンを選びましょう。

利用に向くと判断した方は、申込手順を次で確認しましょう。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
