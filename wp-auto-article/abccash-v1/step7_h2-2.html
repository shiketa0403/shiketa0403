<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>良い口コミ・評判に多い3つの声</h2>

確認できた肯定的な口コミを紹介します。

評価は換金率・振込の速さ・手続きの簡単さの3点です。

<h3>初回90%で換金できたという声</h3>

<span class="st-mymarker-s"><strong>「本当に初回90%で現金化できた」という声の紹介が複数あります。</strong></span>

初回はキャリア決済限定で<strong>90%以上</strong>を明示しているからです。

「無駄な手数料もかからなかった」という満足の声もあります。

適用条件は、申込前に見積もりで確認しましょう。

<h3>10分くらいで振込という5ch経由の声</h3>

<span class="st-mymarker-s"><strong>「10分くらいで振り込まれた」という5ch経由の声の紹介があります。</strong></span>

レビューサイトが5chの投稿として取り上げているからです。

ただし元の書き込みは、今回の調査では未確認。

5ch経由の声は、参考程度にとどめましょう。

[st-kaiwa1 r]キャリア決済の枠で現金化したい方には、候補になるサービスです。[/st-kaiwa1]

<h3>手続きが簡単という評価</h3>

<span class="st-mymarker-s"><strong>「手続きが簡単だった」という評価が確認できました。</strong></span>

申込から査定までスマホで完結する設計だからです。

<strong>auかんたん決済・d払い・ソフトバンクまとめて支払い</strong>に対応しています。

自分のキャリアが対象かは、申込前に確認しましょう。

[st-mybox title="こんな方に向いています" webicon="st-svg-check-circle" color="#757575" bordercolor="#BDBDBD" bgcolor="#ffffff" borderwidth="2" borderradius="5" titleweight="bold" fontsize="" myclass="st-mybox-class" margin="25px 0 25px 0"]
<div class="maruck">
<ul>
<li>au・ドコモ・ソフトバンクのキャリア決済枠を使いたい方</li>
<li>クレジットカードを持っていない方</li>
<li>スマホだけで手続きを済ませたい方</li>
</ul>
</div>
[/st-mybox]

一方で、悪い口コミや指摘には申込前に知っておきたい内容が含まれています。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
