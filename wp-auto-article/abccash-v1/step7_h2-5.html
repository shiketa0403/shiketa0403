<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>

<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>申込前に知るべき3つの注意点</h2>

「思ったより少ない・遅い」と感じる原因の多くは、表示の読み方にあります。

申込前に3つの注意点を確認しましょう。

<h3>初回90%はキャリア決済限定</h3>

<span class="st-mymarker-s"><strong>初回90%以上の表示は、キャリア決済限定の条件付きです。</strong></span>

<span class="hutoaka">2回目以降は80%に下がる</span>設計だからです。

90%と80%では、<strong>10万円</strong>の決済で手取りに1万円の差。

自分に適用される率は、申込時の見積もりで確認しましょう。

<h3>日曜祝日は定休という営業時間</h3>

<span class="st-mymarker-s"><strong>営業は月曜から土曜で、日曜祝日は定休という紹介があります。</strong></span>

申込のタイミングによっては、<span class="hutoaka">対応が翌営業日にずれる</span>からです。

最短10分の掲示も、営業時間内の受付が前提です。

週末に急ぐ場合は、営業日を先に確認しましょう。

[st-kaiwa1 r]迷ったときは、率や掲示より見積もりの振込額で判断するのがおすすめです。[/st-kaiwa1]

<h3>カード会員規約上の禁止行為</h3>

<span class="st-mymarker-s"><strong>キャリア決済やクレジットカードの現金化は、運営側が禁止している行為です。</strong></span>

カード会社の規約で「換金目的の利用」が明示的に禁止されているからです。

キャリア決済も同様で、<span class="hutoaka">発覚すると利用停止</span>につながるリスクがあります。

業者選び以前に、この前提を理解した上で判断しましょう。

[st-mybox title="注意ポイント" webicon="st-svg-exclamation-circle" color="#ef5350" bordercolor="#ef9a9a" bgcolor="#ffebee" borderwidth="2" borderradius="5" titleweight="bold" fontsize="" myclass="st-mybox-class" margin="25px 0 25px 0"]
<div class="maruck">
<ul>
<li>初回90%はキャリア決済限定・2回目以降は80%</li>
<li>日曜祝日は定休・最短10分は営業時間内が前提</li>
<li>現金化はキャリア決済・カード規約上の禁止行為</li>
</ul>
</div>
[/st-mybox]

注意点を押さえたところで、実際の申込手順を確認します。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
