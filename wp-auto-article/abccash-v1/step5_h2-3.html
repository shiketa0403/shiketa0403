<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>悪い口コミ・評判で目立つ3つの指摘</h2>

目立つ指摘は、振込時間・満足度・批判記事の3つです。

内容をそのまま紹介します。

<h3>90分以上かかるケースの調査</h3>

最短10分の掲示に対し、90分以上かかるケースが多発という調査の紹介があります。

混雑状況によって、入金まで数時間かかる場合があるからです。

「振り込まれるが、時間の予測が難しい」という評価。

急ぎの場合は、振込タイミングを申込時に確認しましょう。

<h3>約5割が不満というアンケート</h3>

独自アンケートで「利用者の約5割が不満」という紹介があります。

不満の中心は、掲示どおりの時間で届かない点だからです。

一方で高評価のレビューも複数あり、評価は割れています。

両方の見方を踏まえ、時間には余裕を持って判断しましょう。

<h3>やばい業者だったという体験記事</h3>

「やってみた結果やばい業者だった」という趣旨の批判的な体験記事があります。

表示と実際の差を指摘する検証が公開されているからです。

「実際は80%だった」という声とも方向が重なる内容です。

決済前に振込額の提示を受け、金額で判断しましょう。

では、知恵袋や5chには実際の投稿があるのでしょうか。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
