<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>知恵袋・5chの投稿を実際に調査</h2>

「ABCキャッシュ 知恵袋」と検索する人は多いものの、投稿の状況は意外な結果でした。

本記事で実際に調査した内容を紹介します。

<h3>知恵袋は困窮時の利用相談が1件</h3>

<span class="st-mymarker-s"><strong>Yahoo!知恵袋で確認できた実投稿は、治療費の困窮時に利用を相談する1件でした。</strong></span>

「治療費が底を尽き、キャリア決済で使おうか」という切実な相談だからです。

[st-cmemo webicon="st-svg-exclamation-circle" iconcolor="#919191" bgcolor="#fafafa" color="#000000" bordercolor="" borderwidth="" iconsize=""]ほかの検索結果は、ABCashというお金のセミナーの話題。似た名前の別サービスと<span class="hutoaka">混同しないように</span>しましょう。[/st-cmemo]

<h3>5chの生の書き込みは確認できず</h3>

<span class="st-mymarker-s"><strong>5chでは、ABCキャッシュに関する生の書き込みは今回の調査では確認できませんでした。</strong></span>

「10分で振込」の投稿を確認したとするレビューはあるものの、元の投稿は確認できないからです。

掲示板上の情報が少なく、確認できた口コミはレビューサイト経由が中心です。

<span class="hutoaka">出どころの分からない引用</span>は、確認できた事実と分けて判断しましょう。

ここまでは口コミの話でしたが、数字と条件の見方も押さえておきましょう。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
