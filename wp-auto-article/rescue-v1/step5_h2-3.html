<body>
<textarea readonly id="content" style="width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word;">
<h2>悪い口コミ・評判で目立つ3つの指摘</h2>

気になる点は、実質の率・手数料の中身・他社との比較の3つです。

いずれも申込前の確認で対処できます。

<h3>実質70%程度という報告の多さ</h3>

<strong>「実際に受け取れたのは70%程度だった」という報告が、複数のレビューで紹介されています。</strong>

掲示の90%台がそのまま適用されるとは限らないためです。

期待との差を訴える声が、悪い口コミの中心という構図。

自分の場合の率は、見積もりの金額で確かめましょう。

<h3>約20%の手数料と曖昧な詳細</h3>

<strong>約20%の手数料が差し引かれるという指摘があります。</strong>

「手数料の詳細が曖昧」「明細書が送られてこない」という声もあるためです。

これらは口コミ・レビュー経由の報告で、実際の差引は条件次第です。

手数料の内訳と振込額は、文面で受け取ってから決めましょう。

<h3>他業者より低いという比較の声</h3>

<strong>換金率が他の業者より低いという比較の評価も紹介されています。</strong>

実質70%程度という報告が、相場との比較で語られているためです。

一方で速さや対応には、悪評がほぼ見当たりません。

率を最優先するかどうかで、評価の読み方が変わります。

ここまでの整理を踏まえて、では知恵袋や5chに生の投稿はあるのでしょうか。
</textarea>
<button id="copyBtn" style="margin-top: 10px; padding: 8px 24px; font-size: 14px; cursor: pointer;">コピー</button>

document.getElementById('copyBtn').addEventListener('click', function() {
  navigator.clipboard.writeText(document.getElementById('content').value);
