<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>お金のレスキュー隊 Step05 H2_7</title>
</head>
<body>
<textarea readonly id="content" style="width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word;">
<h2>まとめ</h2>

お金のレスキュー隊の口コミ・評判を調査した結果、振り込まれない被害の報告は確認できませんでした。

一方で「実際は70%程度」という報告が多く、率と手数料への不満が評価の中心でした。

この記事の要点は以下の5点です。

<ul>
<li>「振り込まれない」というトラブルの報告は確認できず</li>
<li>掲示は90〜98.7%・実際は70%程度という報告が多数</li>
<li>約20%の手数料と詳細の曖昧さへの指摘あり</li>
<li>知恵袋の似た名前の投稿は別サービス(実投稿は確認できず)</li>
<li>判断基準は率でなく見積もりで確認した手数料込みの振込額</li>
</ul>

現金化はカード会員規約・後払いアプリ規約上の禁止行為というリスクを踏まえた上で、使うかどうかを決めましょう。

[CTA: 公式サイト(素リンク) https://money-rescue.co.jp/ ]
申込前に、見積もりで手数料込みの振込額を確認しましょう。

掲示と報告のずれは、見積もりの段階で防げます。
</textarea>
<button id="copyBtn" style="margin-top: 10px; padding: 8px 24px; font-size: 14px; cursor: pointer;">コピー</button>
<script>
document.getElementById('copyBtn').addEventListener('click', function() {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
