<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>注意したい3つのデメリット</h2>

メリットだけで判断すると、銀行営業時間や還元率の下振れでつまずきます。

3つの注意点を事前に押さえましょう。

<h3>銀行営業時間外の振込遅延</h3>

最短10分の振込は銀行営業時間に依存します。

銀行振込は平日15時を境に当日着金と翌営業日着金が分かれるからです。

24時間対応でも、平日深夜・土日祝の申込は申込フォーム完了から振込実行までに時間差。

急ぎ調達は平日の営業開始直後が安全な選択肢です。

<h3>1万円帯94%への還元率低下</h3>

1万円台の申込では還元率が94%に下がります。

少額帯は固定コストの比率が高く、還元率が抑えられる業界共通の構造だからです。

公式LP掲示の段階設定では「1万円〜94%」「30万円〜96%」と2ポイント差があります。

申込額を抑えたい利用者は還元率の差を計算したうえで判断しましょう。

<h3>カード会員規約違反のリスク</h3>

クレジットカード現金化はカード会員規約上の禁止行為です。

カード会社の規約で「換金目的の利用」が明示的に禁止されているからです。

発覚時のリスクは利用停止・残額の一括請求・強制解約の3点。

利用は自己責任での判断が前提です。

デメリットを把握したら、実際の利用者がどう評価しているかを確認しましょう。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
