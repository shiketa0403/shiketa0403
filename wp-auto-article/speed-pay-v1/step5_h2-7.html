<head>

<style>

<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>まとめ</h2>

スピードペイは新規最大100%・通常94〜96%の還元率と最短10分振込を提供します。

ただし銀行営業時間外の振込遅延・1万円帯94%への還元率低下・カード会員規約違反リスクは、申込前に把握しましょう。

詐欺被害の集団報告はなく、5ch・知恵袋でも炎上事例は確認できません。

ただし少額時の還元率と深夜申込の翌朝対応の口コミはあるため、平日の営業開始直後の申込で安定運用に近づきます。

利用が向くと判断した方は、24時間対応のLINEから申込みましょう。

[CTA: アフィリエイトリンクなし(公式LPへの素リンク)]
公式LPで最新の還元率・キャンペーン条件・対応サービスを確認したうえで申込みに進みましょう。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
