<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>LINE申込から振込までの手順</h2>

申込はLINEまたはWEBフォームで完結し、来店・電話確認は不要です。

3つの工程で振込完了まで進みます。

<h3>LINE/WEBフォーム入力の流れ</h3>

公式LPのLINEまたはWEBフォームから申込情報を送信します。

スマホ画面から氏名・連絡先・希望金額・利用カード情報を入力する設計だからです。

入力後はLINEまたは電話で担当者から確認の連絡が入ります。

入力ミスがあると確認に時間がかかるため、申込前に必要情報を手元に揃えましょう。

<h3>指定商品購入と本人確認</h3>

スピードペイ指定の商品をカード決済で購入する形式です。

カード現金化は商品売買の形式を取り、本人確認が法令上必須だからです。

運転免許証・マイナンバーカード・健康保険証のいずれかをスマホで撮影し提出します。

書類が鮮明でない場合は再提出となるため、明るい場所で撮影しましょう。

<h3>振込完了までの時間目安</h3>

確認完了から最短10分で指定口座に着金します。

申込から振込までの全工程をスマホ完結で進める設計だからです。

平日10〜15時の申込が最も着金が早い時間帯。

15時以降や土日祝は銀行振込の都合で翌営業日扱いになる場合があります。

申込手順を把握したら、最後に記事全体の要点をまとめます。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
