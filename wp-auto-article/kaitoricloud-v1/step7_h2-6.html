<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>申込から振込までの手順</h2>

買取クラウドの手続きは、公式サイトのフォームかLINEから始まります。

流れは申込・見積もり・商品購入・振込の順です。

[st-timeline myclass="st-timeline-count" add_style=""]
[st-timeline-list text="申込フォームかLINEで申込" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
[/st-timeline-list]
[st-timeline-list text="見積もり・条件を文面で確認" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
[/st-timeline-list]
[st-timeline-list text="ペイディApple専用枠で商品購入" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
[/st-timeline-list]
[st-timeline-list text="お振込み(即日は15時申込が条件)" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
[/st-timeline-list]
[/st-timeline]

<h3>申込と見積もりの文面確認</h3>

<span class="st-mymarker-s"><strong>最初のステップは、申込と見積もりの確認です。</strong></span>

提示額に納得してから進めば、<span class="hutoaka">受取額のずれ</span>を防げます。

確認したいのは、適用される率とキャンペーン込みの振込額。

見積もりの内容は、文面で受け取ってから決めましょう。

<h3>商品購入と配送手続き</h3>

<strong>見積もりに納得したら、案内に沿ってペイディのApple専用枠で指定の商品を購入します。</strong>

購入した商品の買取という方式で、WEB上の配送手続きをもって振込に進むためです。

郵送の作業は不要で、手続きはスマホの画面内で完結します。

不明点は、<span class="st-mymarker-s">購入前にLINEで確かめ</span>ましょう。

[st-kaiwa1]初回は本人確認書類を手元に。準備しておくと止まりません。[/st-kaiwa1]

<h3>振込までの時間目安</h3>

<span class="st-mymarker-s"><strong>最短即日の掲示ですが、即日振込は15時までの申込が条件という紹介です。</strong></span>

15時を過ぎた申込は、翌営業日の入金にずれ込むためです。

<table>
<thead><tr><th>項目</th><th>内容</th></tr></thead>
<tbody>
<tr><td>申込</td><td>WEBフォーム・LINE</td></tr>
<tr><td>購入</td><td>ペイディApple専用枠で指定商品</td></tr>
<tr><td>振込</td><td>最短即日・15時締切の紹介</td></tr>
<tr><td>確認</td><td>キャンペーン込みの振込額を文面で</td></tr>
</tbody>
</table>

時間を左右するのは、<span class="hutoaka">申込の時刻と初回の本人確認</span>。

当日中の入金を狙う日は、午前中に申し込みましょう。

最後に、この記事の調査結果を整理します。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
