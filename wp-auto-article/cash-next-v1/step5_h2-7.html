<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>まとめ</h2>

キャッシュネクストは最大98.7%の換金率と最短5分振込をうたう2006年創業のサービスです。

知恵袋・5chには「初回94〜95%」「見積どおり振込」の実投稿があります。

ただし実勢は85〜95%が中心で、土日申込は振込が翌営業日にずれる例もあります。

実調査では、振り込まれない詐欺の集団報告は確認できませんでした。

「詐欺」系の書き込みの多くは、タイミングの認識違いや率の確認不足が原因と分析されています。

利用が向くと判断した方は、見積もりで数字を確認してから申込みましょう。

[CTA: アフィリエイトリンクなし(公式サイトへの素リンク・URLは要確認)]
公式サイトで見積もりと最新のキャンペーンを確認したうえで申込みに進みましょう。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
