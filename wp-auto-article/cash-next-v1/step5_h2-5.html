<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>向いている人と向かない人</h2>

実勢換金率・申込タイミング・規約リスクの3点で適合性が分かれます。

具体的な人物像で整理しましょう。

<h3>利用が向く人の条件</h3>

平日の日中に申込めて、今日中に現金が必要な人に向きます。

営業時間内なら5〜10分の入金報告があり、初回3%UPも使えるからです。

具体的には「給料日前の家賃や携帯代の支払い」「急な冠婚葬祭の出費」を想定する利用者。

見積もりで数字を確認してから決めたい慎重派にも適合します。

<h3>利用を控えるべき人の特徴</h3>

公表の98.7%を前提に資金計画を立てる人には向きません。

実勢は85〜95%の報告があり、受取額が目減りする可能性があるからです。

「週末の深夜に今すぐ入金してほしい人」「カードローン審査に通る属性の人」も該当します。

該当する場合は、金利が明確な消費者金融・カードローンを選びましょう。

利用に向くと判断した方は、申込手順を次節で確認しましょう。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
