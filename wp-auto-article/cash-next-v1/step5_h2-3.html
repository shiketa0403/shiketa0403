<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>注意したい3つのデメリット</h2>

メリットだけで判断すると、実勢換金率や振込タイミングでつまずきます。

3つの注意点を事前に押さえましょう。

<h3>実勢85〜95%の換金率</h3>

実際の換金率は85〜95%の報告が中心です。

最大98.7%は50万円以上の高額利用時に適用される上限値だからです。

実投稿では「初回94〜95%」、少額の利用では85〜90%程度という検証が複数。

公表値をそのまま期待せず、見積もりの数字で判断しましょう。

<h3>土日申込の振込遅延例</h3>

土日の申込は振込が翌営業日にずれた例があります。

振込処理が営業時間9時〜20時の体制で行われるからです。

「土曜日に申し込んだら振込は月曜日だった」という報告を確認しました。

急ぎの場合は、平日の早い時間帯に申込みましょう。

<h3>カード会員規約違反のリスク</h3>

クレジットカード現金化はカード会員規約上の禁止行為です。

カード会社の規約で「換金目的の利用」が明示的に禁止されているからです。

発覚時のリスクは利用停止・残額の一括請求・強制解約の3点。

利用は自己責任での判断が前提です。

注意点を把握したら、口コミの実調査結果を確認しましょう。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
