<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>申込前に知るべき3つの注意点</h2>

不安の多くは、条件の読み方と時間の見込み方で小さくできます。

申込前に3つの注意点を確認しましょう。

<h3>初回90%と2回目87%という条件</h3>

初回買取率90%は初回向けの条件で、2回目以降は87%という紹介です。

最低80%保証の掲示もあり、条件によって段階が分かれるからです。

買取例は3万円で2万7000円、10万円で9万円という初回の水準。

自分に適用される率は、見積もりの振込額で確認しましょう。

<h3>振込は営業時間に左右される条件</h3>

振込のタイミングは、営業時間と銀行の反映時間に左右されます。

営業は月曜〜土曜の8時〜18時という紹介があり、時間外は翌営業日が目安だからです。

平日15時以降や休日は、口座への反映も遅れやすくなります。

急ぎなら、時間から逆算して申し込みましょう。

<h3>カード会員規約上の禁止行為</h3>

クレジットカードや後払いアプリの現金化は、運営側が禁止している行為です。

カード会社の規約で「換金目的の利用」が明示的に禁止されているからです。

発覚すると、利用停止や強制解約につながる可能性があります。

業者選び以前に、この前提を理解した上で判断しましょう。

注意点を押さえたところで、実際の申込手順を確認します。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
