<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>悪い口コミ・評判で目立つ3つの指摘</h2>

目立つ指摘は、率の差・手数料・営業時間の3つです。

内容をそのまま紹介します。

<h3>実際は70%前後だったという不満</h3>

「実際の換金率は70%前後だった」という不満の紹介があります。

初回90%は上限に近い条件で、金額や枠によって変わるからです。

10万円なら、90%と70%で手取りに2万円の差。

適用される率は、申込時の見積もりで確認しましょう。

<h3>手数料を引かれたという不満</h3>

「隠れた手数料やシステム料を引かれた」という不満の紹介があります。

一方で「振込手数料は引かれない」とするレビューもあり、紹介が食い違うからです。

手数料の扱いは、媒体の紹介だけでは確定できない状況です。

見積もりでは、手数料込みの振込額を確認しましょう。

<h3>営業時間と掲示の差という指摘</h3>

公式サイトの「深夜・土日も」に対し、営業は月曜〜土曜の8時〜18時という紹介があります。

時間外の申込は、翌営業日の対応になる可能性があるからです。

「振り込まれない」と感じる例は、銀行の反映時間が背景という整理もあります。

当日中に受け取りたい場合は、平日の早い時間に申し込みましょう。

では、知恵袋や5chには実際にどんな投稿があるのでしょうか。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
