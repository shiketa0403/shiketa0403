<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>良い口コミ・評判に多い3つの声</h2>

確認できた肯定的な口コミを紹介します。

評価はカードの無事・振込の速さ・メルペイ対応の3点です。

<h3>カードトラブルがないという声</h3>

「カードトラブルがなく、安心して利用できた」という声が紹介されています。

カード事故防止を掲げ、利用停止クレームゼロを主張しているからです(自社掲載)。

VISA・Mastercard・JCB・AMEXの主要カードに対応しています。

不安な方は、申込前の電話で対応カードを確認しましょう。

<h3>最短10分という振込の速さ</h3>

申込から入金まで、最短10分程度という掲示があります。

買取例も金額で明示され、手続きが簡潔だからです。

10万円の商品購入で9万円という初回の買取例も。

急ぎの場合は、申込前に振込タイミングを聞いておきましょう。

<h3>メルペイの買取に強いという印象</h3>

メルペイの買取に特に強い印象、という利用者の声の紹介があります。

後払いアプリに特化した買取メニューを持つからです。

メルペイは最大99.2%で優遇という紹介もあります。

自分の使いたい枠が対応しているか、先に確認しましょう。

一方で、悪い口コミや指摘には申込前に知っておきたい内容が含まれています。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
