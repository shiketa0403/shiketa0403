<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>スマホ申込から振込までの手順</h2>

申込はスマホで完結し、来店は不要です。

フォーム申込から振込までの流れを順に見ていきましょう。

[st-timeline myclass="st-timeline-count" add_style=""]
[st-timeline-list text="お申し込み" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
公式サイトのフォームまたは電話で申込み、条件の案内を受ける(必要書類は身分証+決済画面)
[/st-timeline-list]
[st-timeline-list text="決済手続き" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
案内に沿ってネットショッピングで決済する(20歳〜70歳・複数カード可の掲示)
[/st-timeline-list]
[st-timeline-list text="お振込み" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
掲示は最短10分程度(時間外の申込は翌営業日が目安)
[/st-timeline-list]
[/st-timeline]

<h3>フォーム申込と必要書類の準備</h3>

<span class="st-mymarker-s"><strong>申込は公式サイトのフォーム、または電話から始まります。</strong></span>

受付後に案内があり、条件を確認してから進む流れだからです。

必要書類は、<strong>身分証とショッピング決済画面</strong>の2点という掲示。

提示された振込額に納得できなければ、<span class="hutoaka">この段階で断りましょう</span>。

<h3>ネットショッピングでの決済</h3>

<span class="st-mymarker-s"><strong>条件に納得したら、案内に沿ってネットショッピングで決済します。</strong></span>

現金化は商品購入の形式を取るからです。

年齢制限は<strong>20歳〜70歳</strong>で、複数カードの利用も可という掲示があります。

決済前に、金額と内容を確認しましょう。

[st-kaiwa1]決済する金額と内容は、決済前に画面で確認しておきましょう。[/st-kaiwa1]

<h3>振込完了までの時間目安</h3>

<span class="st-mymarker-s"><strong>振込は最短10分程度という掲示ですが、実際は幅があります。</strong></span>

営業時間や銀行の反映時間で、<span class="hutoaka">受け取りまでの時間が変わる</span>からです。

確認できた整理は、時間外の申込は翌営業日が目安という内容。

<table>
<thead><tr><th>項目</th><th>内容</th></tr></thead>
<tbody>
<tr><td>受付</td><td>フォームまたは電話(営業は月〜土8時〜18時の紹介)</td></tr>
<tr><td>掲示の振込速度</td><td>最短10分程度</td></tr>
<tr><td>必要書類</td><td>身分証+ショッピング決済画面</td></tr>
<tr><td>注意</td><td>時間外は翌営業日が目安・平日15時以降は反映も遅れやすい</td></tr>
</tbody>
</table>

当日中に受け取りたい場合は、平日の早い時間帯の申込がおすすめです。

手順を把握したら、最後に記事全体の要点を整理します。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
