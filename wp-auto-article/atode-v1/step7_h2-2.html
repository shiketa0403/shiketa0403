<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>良い口コミ・評判に多い3つの声</h2>

確認できた肯定的な口コミを紹介します。

評価はカードの無事・振込の速さ・メルペイ対応の3点です。

<h3>カードトラブルがないという声</h3>

<span class="st-mymarker-s"><strong>「カードトラブルがなく、安心して利用できた」という声が紹介されています。</strong></span>

カード事故防止を掲げ、利用停止クレームゼロを主張しているからです(自社掲載)。

<strong>VISA・Mastercard・JCB・AMEX</strong>の主要カードに対応しています。

不安な方は、申込前の電話で対応カードを確認しましょう。

<h3>最短10分という振込の速さ</h3>

<span class="st-mymarker-s"><strong>申込から入金まで、最短10分程度という掲示があります。</strong></span>

買取例も金額で明示され、手続きが簡潔だからです。

10万円の商品購入で<strong>9万円</strong>という初回の買取例も。

急ぎの場合は、申込前に振込タイミングを聞いておきましょう。

[st-kaiwa1 r]速さ重視なら、平日の早い時間の申込が現実的です。[/st-kaiwa1]

<h3>メルペイの買取に強いという印象</h3>

<span class="st-mymarker-s"><strong>メルペイの買取に特に強い印象、という利用者の声の紹介があります。</strong></span>

後払いアプリに特化した買取メニューを持つからです。

メルペイは最大<strong>99.2%</strong>で優遇という紹介もあります。

自分の使いたい枠が対応しているか、先に確認しましょう。

[st-mybox title="こんな方に向いています" webicon="st-svg-check-circle" color="#757575" bordercolor="#BDBDBD" bgcolor="#ffffff" borderwidth="2" borderradius="5" titleweight="bold" fontsize="" myclass="st-mybox-class" margin="25px 0 25px 0"]
<div class="maruck">
<ul>
<li>メルペイや後払いアプリの枠を現金化したい方</li>
<li>会社情報を確認してから申し込みたい方</li>
<li>平日の日中に短時間で済ませたい方</li>
</ul>
</div>
[/st-mybox]

一方で、悪い口コミや指摘には申込前に知っておきたい内容が含まれています。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
