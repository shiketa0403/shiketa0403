<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>申込から振込までの手順</h2>

X GIFTの手続きは、公式サイトのフォームかLINEの申込から始まります。

流れは申込・提示額の確認・商品購入と買取・振込の順です。

[st-timeline myclass="st-timeline-count" add_style=""]
[st-timeline-list text="フォームかLINEで申込" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
[/st-timeline-list]
[st-timeline-list text="当日の提示額を文面で確認" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
[/st-timeline-list]
[st-timeline-list text="ペイディ・Apple枠で商品購入と買取" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
[/st-timeline-list]
[st-timeline-list text="お振込み(最短5〜10分紹介・混雑で変動)" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
[/st-timeline-list]
[/st-timeline]

<h3>申込と提示額の文面確認</h3>

<span class="st-mymarker-s"><strong>最初のステップは、申込と当日の提示額の確認です。</strong></span>

提示額に納得してから進めば、<span class="hutoaka">受取額のずれ</span>を防げます。

確認したいのは、当日の買取率と振込額の実額。

提示の内容は、文面で受け取ってから決めましょう。

<h3>商品購入・買取の手続き</h3>

<strong>提示に納得したら、案内に沿ってペイディやApple枠で指定商品を購入し、買取に出します。</strong>

商品の売買という方式で、買取の確認をもって振込に進むためです。

手続きは電話なしで、LINEのやり取りだけで完結したという体験談があります。

不明点は、<span class="st-mymarker-s">購入前にLINEで確かめ</span>ましょう。

[st-kaiwa1]購入前の疑問はLINEで解消。記録も残って一石二鳥です。[/st-kaiwa1]

<h3>振込までの時間目安</h3>

<span class="st-mymarker-s"><strong>振込は最短5分や10分という紹介があり、16分で完了した体験談もあります。</strong></span>

当日の混雑状況で、実際の所要時間が変わるためです。

<table>
<thead><tr><th>項目</th><th>内容</th></tr></thead>
<tbody>
<tr><td>申込</td><td>公式サイトのフォーム・LINE</td></tr>
<tr><td>購入・買取</td><td>ペイディ・Apple枠で指定商品を購入</td></tr>
<tr><td>振込</td><td>最短5〜10分の紹介・16分の体験談</td></tr>
<tr><td>掲示</td><td>当日中の振込を公式サイトに表示</td></tr>
</tbody>
</table>

時間を左右するのは、<span class="hutoaka">申込の時間帯と混雑の度合い</span>。

公式サイトは当日中の振込を掲示しているため、急ぐ日は早めに申し込みましょう。

最後に、この記事の調査結果を整理します。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
