<!DOCTYPE html>

<title>X GIFT Step05 H2_4</title>

<body>
<textarea readonly id="content" style="width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word;">
<h2>知恵袋・5chの投稿を実際に調査</h2>

Yahoo!知恵袋と5chを実際に検索して調査しました。

結論から言うと、生の投稿は見つかりません。

<h3>利用体験の実投稿は確認できず</h3>

<strong>X GIFTの利用体験に関する実投稿は、知恵袋・5chとも確認できませんでした。</strong>

検索でヒットするのは、X(旧Twitter)のギフト機能に関する無関係な話題のためです。

目立つのは、レビューサイト同士の紹介記事と別ドメインの同名ページ。

「知恵袋で話題」といった紹介も、元の投稿を確かめてから読みましょう。

<h3>検索はXのギフト機能が大半</h3>

<strong>「X GIFT」の検索結果は、X(旧Twitter)のギフト機能の話題が大半です。</strong>

サービス名が一般的な英単語の組み合わせで、同名の話題と混ざりやすいためです。

業者のX GIFTの公式はxgift.jpで、別ドメインの同名ページも存在します。

どのX GIFTの話かを確かめてから、情報を読みましょう。

生の声が少ないからこそ、申込前に押さえるべきは確認の手順です。
</textarea>
<button id="copyBtn" style="margin-top: 10px; padding: 8px 24px; font-size: 14px; cursor: pointer;">コピー</button>
<script>
document.getElementById('copyBtn').addEventListener('click', function() {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
