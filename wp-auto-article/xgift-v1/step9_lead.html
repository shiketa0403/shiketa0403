<button id="copyBtn">コピー</button>
<textarea readonly id="content">「X GIFTの買取って実際どうなの?」と気になって、口コミや評判を調べていませんか。

この記事では、Yahoo!知恵袋・5ch・レビューサイトを実際に検索して、確認できた情報を整理しました。

<span class="st-mymarker-s">結論として、振り込まれない被害の報告は見当たらず、買取率は70〜90%の幅でタイミングによって変わることがわかりました。</span>

良い口コミでは、16分で振り込まれた体験談や電話なしのLINE完結、提示額=着金額の手数料なしが紹介されています。

一方で「80%が76%に下がった」という声もあり、率の下振れは織り込んでおきたいところです。

読み終える頃には、当日の買取率の確かめ方と、申込前に確認すべきポイントがわかります。

[st-minihukidashi webicon="" fontsize="" fontweight="" bgcolor="#FFB74D" color="#fff" margin="0 0 20px 0" radius="" position="" myclass="" add_boxstyle=""]この記事のまとめ
<div class="maruck">
<ul>
 	<li>「振り込まれない」という被害の報告は見当たらず</li>
 	<li>率は70〜90%のタイミング変動(88%体験と76%の声が併存)</li>
 	<li>手数料なしで提示額=着金額という解説</li>
 	<li>知恵袋・5chとも実投稿なし(Xのギフト機能ノイズが大半)</li>
 	<li>判断基準は当日の買取率と提示された振込額</li>
</ul>
</div>
[/st-minihukidashi]
</textarea>

document.getElementById('copyBtn').addEventListener('click', () => {
