<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>向いている人と向かない人</h2>

対象アプリ・急ぎ度・規約リスクの3点で適合性が分かれます。

具体的な人物像で整理しましょう。

<h3>利用が向く人の条件</h3>

表記の最大値でなく、見積もりの振込額で判断できる人に向きます。

公表93%〜98.7%と実測の報告70%前後に、幅があるためです。

Paidyやバンドルカードの残枠を使いたい人に合う、後払いアプリ特化の設計。

土日祝に申込みたい人にも、24時間振込の掲示は相性が良好です。

<h3>利用を控えるべき人の特徴</h3>

98.6%をそのまま手取りと考える人には向きません。

最大値は大口向けで、70%前後だったという報告もあるからです。

「10分以内の入金を前提にする人」「カードローン審査に通る属性の人」も該当します。

該当する場合は、金利が明確な消費者金融・カードローンを選びましょう。

利用に向くと判断した方は、申込手順を次で確認しましょう。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
