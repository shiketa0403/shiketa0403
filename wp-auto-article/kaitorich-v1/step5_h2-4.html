<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>口コミ評判の実調査結果</h2>

知恵袋・5ch・レビューサイトの3経路を実際に調査しました。

確認できた内容を正直に紹介します。

<h3>知恵袋・5chの調査結果</h3>

知恵袋と5chでは、カイトリッチの実際の投稿を確認できませんでした。

検索でヒットするのは、別サービスや無関係の話題が中心だからです。

口コミの蓄積が少なく、第三者の生の声で判断しにくい状況。

実投稿がない事実も、判断材料のひとつとして扱いましょう。

<h3>レビューサイトの体験報告</h3>

レビューサイトには、好意的な調査と批判的な体験報告の両方があります。

「対応が速い・丁寧」の一方、「実際は70%前後」という検証があるからです。

振り込まれない詐欺の集団報告は、調査の範囲では確認できませんでした。

数字は実測の報告まで含めて、幅で見ておきましょう。

<h3>類似名カイトリングに注意</h3>

検索結果には、類似名の「カイトリング」という別サービスの記事が混在しています。

名前が似ており、口コミや換金率の情報を取り違えやすいからです。

カイトリングの評判を、カイトリッチのものと誤読しない注意が要ります。

口コミの実態を踏まえ、自分が利用に向くタイプかを次で整理します。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
