<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>注意したい3つのデメリット</h2>

つまずきやすいのは時間の実測差・手数料・規約リスクの3点です。

3つの注意点を事前に押さえましょう。

<h3>実測30〜40分の時間差</h3>

<span class="st-mymarker-s"><strong>実際は本人確認で30〜40分ほどかかったという体験報告があります。</strong></span>

初回は本人確認書類の提出と確認の工程が入るからです。

最短10分は、条件がそろった場合の上限側の数字。

急ぎの場合も、<span class="hutoaka">1時間程度の余裕</span>を見ておきましょう。

<h3>振込手数料200円の報告</h3>

<span class="st-mymarker-s"><strong>手数料なしの掲示でも、振込手数料200円程度が発生する場合の報告があります。</strong></span>

振込先の銀行やタイミングによって、実費が生じることがあるからです。

<span class="hutoaka">「割高な借入れをしている気分」</span>という利用者の指摘も紹介されています。

見積もりの段階で、差引の有無を確認しましょう。

<h3>規約違反と利用停止のリスク</h3>

<span class="st-mymarker-s"><strong>現金化は、後払いアプリやクレジットカードの規約で禁止行為とされています。</strong></span>

カード会社の規約で「換金目的の利用」が明示的に禁止されているからです。

発覚時は<span class="hutoaka">アカウント停止・利用停止・強制解約</span>のリスクがあります。

カード事故なしの掲示があっても、利用は自己責任が前提です。

[st-mybox title="注意ポイント" webicon="st-svg-exclamation-circle" color="#ef5350" bordercolor="#ef9a9a" bgcolor="#ffebee" borderwidth="2" borderradius="5" titleweight="bold" fontsize="" myclass="st-mybox-class" margin="25px 0 25px 0"]
<div class="maruck">
<ul>
<li>初回は本人確認があり最短10分では届かない報告あり</li>
<li>振込手数料200円程度が発生する場合の報告あり</li>
<li>現金化はアプリ・カードの規約上の禁止行為</li>
</ul>
</div>
[/st-mybox]

注意点を踏まえた上で、実際の口コミを調査した結果を確認します。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
