<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>スマホ申込から振込までの手順</h2>

申込はスマホで完結し、来店は不要です。

アプリ決済と本人確認の工程が入ります。

[st-timeline myclass="st-timeline-count" add_style=""]
[st-timeline-list text="フォーム・電話で申込" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
フォームは24時間受付・担当者から折り返しの連絡が入り見積もり提示
[/st-timeline-list]
[st-timeline-list text="本人確認・アプリ決済" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
初回は本人確認書類を提出し、必要に応じてバーチャルカードを発行して決済
[/st-timeline-list]
[st-timeline-list text="振込完了" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
決済確認後に振込・最短10分の掲示(実測30〜40分の報告も)
[/st-timeline-list]
[/st-timeline]

<h3>フォーム申込の流れ</h3>

<span class="st-mymarker-s"><strong>公式サイトのフォームかフリーダイヤルで申込みます。</strong></span>

フォームは24時間受付で、担当者から折り返しの連絡が入るからです。

伝えるのは氏名・連絡先・希望額・利用中のアプリの4点。

提示された振込額に納得できない場合は、この段階で断りましょう。

<h3>本人確認とアプリ決済</h3>

<span class="st-mymarker-s"><strong>初回は本人確認書類の提出と、アプリでの決済が必要です。</strong></span>

現金化は商品売買の形式を取り、本人確認が法令上必須だからです。

必要に応じて、アプリからバーチャルカードを発行して決済に使います。

決済前に金額と内容の確認がおすすめです。

[st-kaiwa1]初回は本人確認の分だけ、時間に余裕を見ておくと安心です。[/st-kaiwa1]

<h3>振込完了までの時間目安</h3>

<span class="st-mymarker-s"><strong>振込は決済確認後で、最短10分を掲示しています。</strong></span>

初回は本人確認の分、時間が長くなるからです。

<span class="hutoaka">30〜40分ほどかかった</span>という体験報告もあり、余裕を持った申込が無難です。

急ぎの場合も、1時間程度の幅を見込んで申込みましょう。

申込手順を把握したら、最後に記事全体の要点をまとめます。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
