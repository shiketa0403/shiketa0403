<strong>流れは「お申し込み→カード決済→ご入金」の3ステップ。</strong>

<h3>必要書類と本人確認の準備</h3>

<strong>初回は本人確認書類・決済用カード・本人名義口座の3点を手元に揃えましょう。</strong>

初回のみ本人確認の工程があり、不備があると振込までの時間が延びるためです。

具体的に準備するのは次の3点です。

<div class="maruck">
<ul>
<li>運転免許証またはマイナンバーカード</li>
<li>クレジットカード(VISA・Mastercard・JCB・American Express対応)</li>
<li>本人名義の振込先口座</li>
</ul>
</div>

電話を受けられる時間帯の確保も、あわせて済ませておきましょう。

<h3>カード利用停止リスクの確認</h3>

<strong>ショッピング枠の現金化は、カード会社の会員規約で禁止された行為です。</strong>

換金目的のカード利用が発覚すると、利用停止・残額の一括請求・強制解約の処分対象になるためです。

VISA・Mastercard・JCB・American Expressの主要ブランドいずれの規約にも、換金目的利用の禁止条項があります。
