<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>買取ドン Step05 H2_4</title>
</head>
<body>
<textarea readonly id="content" style="width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word;">
<h2>知恵袋・5chの投稿を実際に調査</h2>

Yahoo!知恵袋と5chを実際に検索して調査しました。

今回は知恵袋で実際の投稿を確認できています。

<h3>知恵袋に質問と回答を確認</h3>

知恵袋では、買取ドンを名指しした質問と回答を確認しました。

「口コミが少なく心配」という質問に、利用者の回答が付いている投稿のためです。

回答の内容は、42万円で77%という報告と「詐欺ではなかった」という記載。

ページ全文までは確認できていないため、要旨としての紹介にとどめます。

数少ない生の声として、率の読み方に反映しましょう。

<h3>5chの投稿は特定できず</h3>

5chでは、買取ドンへの直接の書き込みを特定できませんでした。

レビュー媒体側の調査でも「目立った投稿なし」と明記されているためです。

「5chの口コミ」と題する記事にも、元レスの引用は見当たりません。

元の書き込みが示されない口コミは、参考程度にとどめましょう。

生の声が少ないからこそ、申込前に押さえるべきは数字の条件と確認の手順です。
</textarea>
<button id="copyBtn" style="margin-top: 10px; padding: 8px 24px; font-size: 14px; cursor: pointer;">コピー</button>
<script>
document.getElementById('copyBtn').addEventListener('click', function() {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
