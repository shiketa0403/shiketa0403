<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>良い口コミ・評判でわかった3つの強み</h2>

良い口コミは、レビューサイトの検証報告が中心です。

率・速さ・手軽さの3つの軸で整理しました。

<h3>少額でも95%だった検証報告</h3>

<span class="st-mymarker-s"><strong>「1万円の少額でも95%で買い取られた」という検証報告があります。</strong></span>

金額帯制の下限でも、掲示どおりの率が適用されたという内容のためです。

9,800円が振り込まれ実質98%だったという別の検証もあり、少額帯の報告は掲示と近い数字です。

少額から試したい人は、見積もりの数字と突き合わせましょう。

[st-kaiwa1 r]少額は掲示どおりの検証も。最後は自分の見積もりで確認ですね。[/st-kaiwa1]

<h3>32分で入金という検証報告</h3>

<span class="st-mymarker-s"><strong>「32分で入金された」という検証報告があります。</strong></span>

申込から振込までがWEBのフォームとDMで完結する方式のためです。

掲示は最短30分、別の検証でも1時間かからず振込という報告。

急ぎの日は、申込前に当日の所要時間を確かめましょう。

<h3>手続きがシンプルという声</h3>

<span class="st-mymarker-s"><strong>「手続きがシンプルで助かった」という声が紹介されています。</strong></span>

電話や顔出しがないDM取引で、やり取りが文面だけで進むためです。

「対応が落ち着いていて安心できた」という感想も添えられています。

不明点は、振込前にDMで確かめましょう。

[st-mybox title="こんな方に向いています" webicon="st-svg-check-circle" color="#757575" bordercolor="#BDBDBD" bgcolor="#ffffff" borderwidth="2" borderradius="5" titleweight="bold" fontsize="" myclass="st-mybox-class" margin="25px 0 25px 0"]

<ul>

</ul>
</div>
[/st-mybox]

一方で、率と確認の手間には気になる報告もあります。

次で3つ確認しましょう。
