<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>スマホ申込から振込までの手順</h2>

申込はスマホで完結し、来店は不要です。

見積もりから振込までの流れを順に見ていきましょう。

[st-timeline myclass="st-timeline-count" add_style=""]
[st-timeline-list text="無料見積りで申込" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
Webフォームか電話で申込・受付は24時間365日・振込額の提示あり
[/st-timeline-list]
[st-timeline-list text="本人確認・カード決済" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
初回は本人確認書類をスマホで撮影して提出し、カード決済を行う
[/st-timeline-list]
[st-timeline-list text="振込完了" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
最短3分送金の掲示・休日振込対応(実際の所要時間は幅あり)
[/st-timeline-list]
[/st-timeline]

<h3>見積りフォーム申込の流れ</h3>

<span class="st-mymarker-s"><strong>申込はWebの無料見積りフォームか電話から始まります。</strong></span>

受付後に振込額の提示があり、納得してから手続きに進む流れだからです。

受付は、24時間365日。

提示された振込額に納得できなければ、<span class="hutoaka">この段階で断りましょう</span>。

<h3>本人確認とカード決済</h3>

<span class="st-mymarker-s"><strong>初回は本人確認書類の提出とカード決済が必要です。</strong></span>

現金化は商品売買の形式を取り、本人確認が法令上必須だからです。

運転免許証やマイナンバーカードをスマホで撮影して提出します。

決済前に、金額と商品の内容を確認しましょう。

[st-kaiwa1]初回は本人確認がある分、時間に余裕を見ておくと安心です。[/st-kaiwa1]

<h3>振込完了までの時間目安</h3>

<span class="st-mymarker-s"><strong>振込は最短3分の掲示ですが、実際は幅があります。</strong></span>

混雑や確認の状況によって、<span class="hutoaka">所要時間が前後する</span>からです。

掲示は、24時間365日対応で休日振込も可能という内容。

<table>
<thead><tr><th>項目</th><th>内容</th></tr></thead>
<tbody>
<tr><td>受付</td><td>24時間365日(フォーム・電話)</td></tr>
<tr><td>掲示の振込速度</td><td>最短3分送金</td></tr>
<tr><td>休日の振込</td><td>対応と掲示</td></tr>
<tr><td>実際の所要時間</td><td>幅あり(見積もり時に目安を確認)</td></tr>
</tbody>
</table>

急ぎの場合は、見積もりの際に振込までの目安時間も確認しましょう。

手順を把握したら、最後に記事全体の要点を整理します。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
