<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>悪い口コミ・評判に多い3つの不満</h2>

確認できた不満は、換金率・手数料・運営情報の3つです。

報告の内容をそのまま紹介します。

<h3>換金率70%前後という不満</h3>

「換金率が低すぎる、70%もいかない」という趣旨の不満が紹介されています。

表の82〜96%と、実際の受取額に差が出る場合があるからです。

「3回使ったが71%で変わらない」との趣旨の報告も。

決済前に振込額の提示を受け、金額で判断しましょう。

<h3>サイト非記載の手数料という報告</h3>

公式サイトに記載のないシステム手数料が差し引かれた、という報告があります。

「手数料0」の掲示だけでは、差し引かれる金額を事前に計算できないからです。

この差が「詐欺では?」との不信感につながったという紹介もあります。

見積もりの段階で、手数料込みの振込額を数字で確かめましょう。

<h3>所在地の会社が確認できない指摘</h3>

記載の所在地に同名の会社が確認できない、という指摘があります。

運営情報の透明性は、業者を判断する基本の材料だからです。

2019年創業との紹介がある一方、指摘の真偽は今回の調査では確認できませんでした。

申込前に公式サイトの会社情報を自分の目で確認しましょう。

では、知恵袋や5chには実際の投稿があるのでしょうか。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
