<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>ナンバーワンキャッシュの3つのデメリット</h2>

月間上限・営業時間・2回目以降の換金率低下は、申込前に押さえておきたい弱点です。

<h3>月間上限20万円の制限</h3>

<strong>月間の利用上限は20万円までで、高額の現金化には不向きです。</strong>

サービス運営上のリスク管理として上限が設定された構造のためです。

20万円超の現金化が必要な場面では、別の業者(月間上限の高い業者)を並列で検討する必要があります。

1回あたりの上限ではなく月の合計が制限されるため、複数回の申込で20万円に近づくケースも影響します。

<h3>営業時間20時までの締切</h3>

<strong>営業時間は20時までで、深夜・早朝の即日入金には対応しません。</strong>

スタッフによる本人確認・決済確認の工程が必要なため、24時間対応はできない運用です。

20時以降の申込は翌営業日扱いとなり、当日中の入金は受けられません。

「夜中に給料日前の急ぎで現金化したい」というニーズには、24時間対応の他社が現実的です。

申込は20時の30〜60分前までに開始しましょう。

<h3>2回目以降85%の換金率低下</h3>

<strong>初回90%だった換金率が、2回目以降は85%に下がります。</strong>

LPフッターに「初回買取率90%、2回目以降は85%」と明示された段階制のためです。

5万円申込なら、初回45,000円・2回目以降42,500円で差額は2,500円。

10万円申込なら、初回90,000円・2回目以降85,000円で差額は5,000円の試算です。

リピート利用前提の人は、2回目以降の他社比較を申込前に済ませましょう。

デメリットを確認したところで、次は自分が向くかの判断軸を整理します。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
