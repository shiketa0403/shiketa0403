<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>ナンバーワンキャッシュの申込の流れ</h2>

申込はスマホ完結で、事前準備とリスク確認を済ませれば当日中に入金まで進みます。

<h3>スマホで完結する3ステップ</h3>

<strong>流れは「申込・入力・振込」の3ステップで、スマホだけで完結します。</strong>

LP記載の3ステップ設計と、来店・電話相談不要の運用のためです。

[st-timeline myclass="st-timeline-count" add_style=""]
[st-timeline-list text="申込" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
公式フォームから申込を送信します。
[/st-timeline-list]
[st-timeline-list text="入力" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
必要事項の入力と本人確認書類の提出を済ませます。
[/st-timeline-list]
[st-timeline-list text="振込" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
営業時間内なら決済確認から最短10分で入金です。
[/st-timeline-list]
[/st-timeline]

<h3>必要書類と本人確認</h3>

<strong>必要書類は本人確認書類で、クレカ写真・後払いアプリ画面の提出が一般的です。</strong>

サービス運営上、本人確認と利用枠の確認が必要な工程のためです。

具体的に揃えるのは次の3点。

<div class="maruck">
<ul>
<li>運転免許証またはマイナンバーカード</li>
<li>クレジットカード(VISA・Mastercard・JCB・American Express対応)または後払いアプリの利用画面</li>
<li>振込先口座</li>
</ul>
</div>

クレカ写真の送信時は<strong>セキュリティコードを伏せて送る</strong>のが推奨運用です。

提出書類は申込前に手元に揃えておきましょう。

<h3>カード利用停止リスクの確認</h3>

<strong>ショッピング枠の現金化は、カード会社の会員規約で禁止された行為です。</strong>

換金目的のカード利用が発覚すると、<span class="hutoaka">利用停止・残額の一括請求・強制解約</span>の処分対象になるためです。

VISA・Mastercard・JCB・American Expressの主要ブランドいずれの規約にも、換金目的利用の禁止条項があります。

後払いアプリも各サービス規約で類似の制限がある場合があるため、申込前の規約確認が大切です。

[st-mybox title="注意ポイント" webicon="st-svg-exclamation-circle" color="#ef5350" bordercolor="#ef9a9a" bgcolor="#ffebee" borderwidth="2" borderradius="5" titleweight="bold" fontsize="" myclass="st-mybox-class" margin="25px 0 25px 0"]
<div class="maruck">
<ul>
<li>ショッピング枠の現金化はカード会員規約の禁止行為</li>
<li>発覚時は利用停止・残額の一括請求・強制解約の対象</li>
<li>後払いアプリも各サービス規約で類似の制限あり</li>
</ul>
</div>
[/st-mybox]

リスクを理解したうえで、自己責任で利用を判断しましょう。

申込手順とリスクを把握したところで、最後に総評をまとめます。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
