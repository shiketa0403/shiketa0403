<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>TOPクレカ Step05 H2_6</title>
</head>
<body>
<textarea readonly id="content" style="width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word;">
<h2>申込から振込までの手順</h2>

TOPクレカの手続きは、電話かWEBの申込から始まります。

流れは申込・本人確認・振込・商品発送の4ステップです。

<h3>電話・WEBの申込と本人確認</h3>

<strong>最初のステップは、電話かWEBフォームでの申込です。</strong>

フリーダイヤルの番号が公式サイトに掲載されています。

初回は本人確認書類の提出が必要という流れ。

見積もりの返答で、手数料込みの振込額を文面で確かめましょう。

<h3>振込と商品発送の流れ</h3>

<strong>振込のあとに、購入した商品が自宅へ発送されます。</strong>

公式サイトの流れでも、お振込みの後に商品発送が置かれているためです。

商品の受け取りまでが、この方式の一連の工程です。

配送のタイミングは、申込時に相談しておきましょう。

<h3>入金までの時間目安</h3>

<strong>入金までの時間は、2回目以降で最短5分という解説です。</strong>

初回は本人確認があるため、30分〜1時間ほどが目安です。

時間を左右するのは、初回かどうかと申込の時間帯。

着金を急ぐ日は、初回の時間も見込んで動きましょう。

最後に、この記事の調査結果を整理します。
</textarea>
<button id="copyBtn" style="margin-top: 10px; padding: 8px 24px; font-size: 14px; cursor: pointer;">コピー</button>
<script>
document.getElementById('copyBtn').addEventListener('click', function() {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
