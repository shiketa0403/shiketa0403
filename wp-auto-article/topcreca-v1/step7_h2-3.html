<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>

<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>悪い口コミ・評判で目立つ3つの指摘</h2>

気になる点は、手数料の説明・商品の受取・初回の所要時間の3つです。

いずれも申込前の確認で対処できます。

<h3>手数料の説明が見当たらない</h3>

<strong>公式サイトには、手数料についての説明が見当たらないという指摘があります。</strong>

率の確約だけでは、<span class="hutoaka">差引後の受取額を計算できない</span>ためです。

この指摘はレビュー経由の内容で、実際の差引は条件次第という前提。

手数料の有無と金額は、<span class="st-mymarker-s">見積もりの返答で確認</span>しましょう。

<h3>商品が自宅に届く受取の工程</h3>

<strong>キャッシュバック方式のため、購入した商品が自宅に届きます。</strong>

商品の購入とキャッシュバックを組み合わせる方式のためです。

<span class="hutoaka">家族に見られて現金化を知られた</span>という注意の紹介もあります。

<span class="st-mymarker-s">受取のタイミングと配送先は、申込時に確認</span>しましょう。

[st-kaiwa1]商品は自宅に届く方式。配送のタイミングは先に確認ですね。[/st-kaiwa1]

<h3>初回は30分〜1時間かかる</h3>

<strong>初回の手続きは、<span class="hutoaka">30分〜1時間ほどかかる</span>という解説があります。</strong>

最短5分は2回目以降の話で、初回は本人確認と内容確認が挟まるためです。

急ぎの初回利用ほど、時間の見込み違いが起きやすい構図です。

初回の利用日は、<span class="st-mymarker-s">時間に余裕を持って申し込み</span>ましょう。

ここまでの整理を踏まえて、では知恵袋や5chに生の投稿はあるのでしょうか。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
