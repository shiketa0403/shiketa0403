<!DOCTYPE html>

<title>TOPクレカ Step05 H2_3</title>

<body>
<textarea readonly id="content" style="width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word;">
<h2>悪い口コミ・評判で目立つ3つの指摘</h2>

気になる点は、手数料の説明・商品の受取・初回の所要時間の3つです。

いずれも申込前の確認で対処できます。

<h3>手数料の説明が見当たらない</h3>

<strong>公式サイトには、手数料についての説明が見当たらないという指摘があります。</strong>

率の確約だけでは、差引後の受取額を計算できないためです。

この指摘はレビュー経由の内容で、実際の差引は条件次第という前提。

手数料の有無と金額は、見積もりの返答で確認しましょう。

<h3>商品が自宅に届く受取の工程</h3>

<strong>キャッシュバック方式のため、購入した商品が自宅に届きます。</strong>

商品の購入とキャッシュバックを組み合わせる方式のためです。

家族に見られて現金化を知られたという注意の紹介もあります。

受取のタイミングと配送先は、申込時に確認しましょう。

<h3>初回は30分〜1時間かかる</h3>

<strong>初回の手続きは、30分〜1時間ほどかかるという解説があります。</strong>

最短5分は2回目以降の話で、初回は本人確認と内容確認が挟まるためです。

急ぎの初回利用ほど、時間の見込み違いが起きやすい構図です。

初回の利用日は、時間に余裕を持って申し込みましょう。

ここまでの整理を踏まえて、では知恵袋や5chに生の投稿はあるのでしょうか。
</textarea>
<button id="copyBtn" style="margin-top: 10px; padding: 8px 24px; font-size: 14px; cursor: pointer;">コピー</button>
<script>
document.getElementById('copyBtn').addEventListener('click', function() {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
