<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>悪い口コミ・評判で目立つ3つの指摘</h2>

気になる指摘は、少額時の率・振込手数料・広告との差の3つです。

いずれも申込前の確認で織り込めます。

<h3>少額では率が下がったという声</h3>

<strong>「少額の取引では換金率が下がった」という声が紹介されています。</strong>

率が金額に連動する方式で、<span class="hutoaka">少額は下限の83%側に寄る</span>ためです。

高額で90%以上という紹介の裏返しにあたる内容。

自分の金額での率は、<span class="st-mymarker-s">見積もりで確かめ</span>ましょう。

<h3>振込手数料が高いという声</h3>

<strong>「振込手数料が高い」という声が紹介されています。</strong>

手数料0円という掲示の紹介もあり、<span class="hutoaka">情報が食い違っている</span>ためです。

公式サイトに手数料の記載が見当たらないという指摘もあります。

手数料込みの振込額を、<span class="st-mymarker-s">決済前に文面で受け取り</span>ましょう。

[st-kaiwa1]0円掲示でも実額はどうかが肝心。文面の振込額で確認しましょう。[/st-kaiwa1]

<h3>広告と実際の率が違うという声</h3>

<strong>「<span class="hutoaka">広告の率と実際の率が違った</span>」という声も1件紹介されています。</strong>

最大値の掲示と、自分の条件で適用される率の差がそのまま不満につながる構図です。

率のゆれは、この業態で最も多い不満の型です。

掲示の数字より、<span class="st-mymarker-s">提示された実額で判断</span>しましょう。

ここまでの声はいずれもレビューサイト経由です。

では、知恵袋や5chに生の投稿はあるのでしょうか。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
