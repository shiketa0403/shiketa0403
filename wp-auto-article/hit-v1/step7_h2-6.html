<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>申込から振込までの手順</h2>

ヒットの手続きは、公式サイトの申込フォームか電話から始まります。

流れは申込・見積もり・決済・振込の順です。

[st-timeline myclass="st-timeline-count" add_style=""]
[st-timeline-list text="申込フォームか電話で申込" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
[/st-timeline-list]
[st-timeline-list text="見積もり・条件を文面で確認" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
[/st-timeline-list]
[st-timeline-list text="カードや後払いアプリの枠で決済" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
[/st-timeline-list]
[st-timeline-list text="お振込み(最短10分紹介・時間帯で変動)" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
[/st-timeline-list]
[/st-timeline]

<h3>申込と見積もりの文面確認</h3>

<span class="st-mymarker-s"><strong>最初のステップは、申込と見積もりの確認です。</strong></span>

提示額に納得してから進めば、<span class="hutoaka">受取額のずれ</span>を防げます。

確認したいのは、適用される率と手数料込みの振込額。

見積もりの内容は、文面で受け取ってから決めましょう。

<h3>カード決済の手続き</h3>

<strong>見積もりに納得したら、案内に沿ってカードや後払いアプリの枠で指定商品を決済します。</strong>

決済の確認をもって、振込の手続きに進む方式のためです。

決済でエラーが出ると、振込の手続きが止まるという説明があります。

カードや後払いアプリの<span class="st-mymarker-s">枠の残高は、決済前に確かめ</span>ましょう。

[st-kaiwa1]残高不足の決済エラーに注意。枠の確認が先です。[/st-kaiwa1]

<h3>振込までの時間目安</h3>

<span class="st-mymarker-s"><strong>振込は最短10分という紹介ですが、時間帯によっては翌営業日の着金です。</strong></span>

申込の時間帯と銀行の営業時間で、反映のタイミングが変わるためです。

<table>
<thead><tr><th>項目</th><th>内容</th></tr></thead>
<tbody>
<tr><td>申込</td><td>WEBフォーム・電話</td></tr>
<tr><td>決済</td><td>カード・後払いアプリの枠</td></tr>
<tr><td>振込</td><td>最短10分紹介・時間帯で翌営業日も</td></tr>
<tr><td>受付</td><td>年中無休・23時までの紹介</td></tr>
</tbody>
</table>

時間を左右するのは、<span class="hutoaka">申込の時間帯と決済の完了</span>。

受付は23時までのため、当日中の入金を狙う日は早めに申し込みましょう。

最後に、この記事の調査結果を整理します。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
