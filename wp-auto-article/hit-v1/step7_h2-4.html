<textarea readonly id="content"><h2>知恵袋・5chの投稿を実際に調査</h2>

Yahoo!知恵袋と5chを実際に検索して調査しました。

結論から言うと、生の投稿は見つかりません。

<h3>利用体験の実投稿は確認できず</h3>

<span class="st-mymarker-s"><strong>ヒットの利用体験に関する実投稿は、知恵袋・5chとも確認できませんでした。</strong></span>

「5ch・知恵袋の口コミ」と題する記事にも、元の投稿の引用がないためです。

検索で目立つのは、レビューサイト同士の紹介記事ばかり。

「知恵袋で話題」といった紹介も、<span class="hutoaka">元の投稿を確かめてから</span>読みましょう。

<h3>噂の中心は着金遅延の誤解</h3>

<span class="st-mymarker-s"><strong>「振り込まれない」という噂は、着金遅延の誤解という整理が紹介されています。</strong></span>

平日15時以降や土日祝の申込は、銀行の都合で着金確認が翌営業日になるためです。

指定商品の決済でエラーが出ると、振込の手続きに進まないという説明もあります。

この整理はレビュー記事側の説明のため、<span class="hutoaka">遅延自体は起こる前提</span>で計画しましょう。

[st-cmemo webicon="st-svg-exclamation-circle" iconcolor="#919191" bgcolor="#fafafa" color="#000000" bordercolor="" borderwidth="" iconsize=""]ネットの「ヒットの口コミ」はレビューサイト経由の紹介が中心です。「ヒット」は一般語のため、無関係な話題との混同にも注意しましょう。[/st-cmemo]

生の声が少ないからこそ、申込前に押さえるべきは条件の確認です。
