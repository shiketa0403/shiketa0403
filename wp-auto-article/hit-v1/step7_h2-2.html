<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }

<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>良い口コミ・評判でわかった3つの強み</h2>

良い口コミは、レビューサイト経由の紹介が中心です。

速さ・受付時間・対応の3つの軸で整理しました。

<h3>90%以上で10分振込という声</h3>

<span class="st-mymarker-s"><strong>「90%以上の率で、10分ほどで振り込まれた」という声が紹介されています。</strong></span>

掲示の最短10分と方向が一致する内容のためです。

申込から振込まで最短10〜30分程度という紹介もあります。

急ぎの日は、申込前に当日の所要時間を確かめましょう。

[st-kaiwa1 r]急ぎなら平日日中の申込が近道。当日の状況も先に確認ですね。[/st-kaiwa1]

<h3>年中無休23時までの受付</h3>

<span class="st-mymarker-s"><strong>受付は年中無休で、23時までという紹介です。</strong></span>

夜の時間帯でも申込を受け付けるため、仕事終わりでも間に合います。

ただし銀行の営業時間の関係で、夜の申込は着金が翌営業日になる場合あり。

当日中の入金を狙う日は、日中の早い時間に申し込みましょう。

<h3>スタッフ対応が丁寧という声</h3>

<span class="st-mymarker-s"><strong>「スタッフの対応が丁寧だった」という声も紹介されています。</strong></span>

初回は本人確認や利用案内のやり取りが挟まるため、対応の質が使いやすさに直結します。

対応の早さと丁寧さを、あわせて評価する内容の紹介です。

不明点は、電話で確認しながら進めましょう。

[st-mybox title="こんな方に向いています" webicon="st-svg-check-circle" color="#757575" bordercolor="#BDBDBD" bgcolor="#ffffff" borderwidth="2" borderradius="5" titleweight="bold" fontsize="" myclass="st-mybox-class" margin="25px 0 25px 0"]
<div class="maruck">
<ul>
<li>当日中の入金を狙いたい人</li>
<li>夜の時間帯に申し込みたい人</li>
<li>電話で相談しながら進めたい人</li>
</ul>
</div>
[/st-mybox]

一方で、率と手数料には厳しい声もあります。

次で3つ確認しましょう。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
