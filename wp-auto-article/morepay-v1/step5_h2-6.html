<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>モアペイ Step05 H2_6</title>
</head>
<body>
<textarea readonly id="content" style="width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word;">
<h2>モアペイの申込みから入金までの流れ</h2>

公式サイトの案内では「かんたん3STEP」で進みます。

ここでは初回利用を想定して、行動順に整理しました。

<h3>シミュレーションで概算確認</h3>

最初のステップは、公式サイトのシミュレーションで概算を出すことです。

媒体ごとに77〜90%と率の幅があり、自分の決済手段でいくら受け取れるかが先に立つためです。

入力項目は、使う決済手段（キャリア決済・atone）と希望金額の2つ。

ここで出た概算が、後の提示額と比べる基準として使えます。

<h3>申込みフォームと本人確認</h3>

概算に納得したら、申込みフォームの送信と本人確認に進みます。

初回は本人確認書類の提出があり、ここを済ませると以降の手続きが速くなるためです。

手続きはWEBとLINEのやり取りで完結し、店舗への来店はないという説明です。

振込額と時期の提示があったら、この段階で文面を保存しておきましょう。

<h3>振込確認と2回目以降の短縮</h3>

最後のステップは、着金の確認です。

提示された金額どおりに振り込まれたかを確かめて、初めて取引が完了したと判断できるためです。

初回の目安は約30分、本人確認が済んだ2回目以降は最短5分の掲示に近づく流れ。

着金額が提示と違う場合は、保存した文面をもとにやり取りの窓口へ確認しましょう。

最後に、この記事の要点を振り返ります。
</textarea>
<button id="copyBtn" style="margin-top: 10px; padding: 8px 24px; font-size: 14px; cursor: pointer;">コピー</button>
<script>
document.getElementById('copyBtn').addEventListener('click', function() {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
