<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>モアペイの口コミ・評判まとめ</h2>

モアペイは、携帯キャリア決済とatoneの買取に特化した現金化サービスです。

[st-mybox title="ポイント" webicon="st-svg-check-circle" color="#FFD54F" bordercolor="#FFD54F" bgcolor="#FFFDE7" borderwidth="2" borderradius="5" titleweight="bold" fontsize="" myclass="st-mybox-class" margin="25px 0 25px 0"]
<div class="maruck">
<ul>
<li>詐欺・未入金の報告は調査の範囲で見当たらず</li>
<li>換金率は掲示90%・紹介85〜90%・集計84〜86%</li>
<li>初回は本人確認で約30分・2回目以降は短縮</li>
<li>知恵袋・5chに名指しの生投稿は確認できず</li>
<li>申込みは概算と提示額の文面確認後に判断</li>
</ul>
</div>
[/st-mybox]

調査の範囲では、詐欺・未入金といった被害報告は見当たりませんでした。

換金率は掲示の最大90%に対し、紹介は85〜90%・集計は84〜86%と、掲示に近い帯の報告が中心です。

一方で、初回は本人確認で約30分という報告があり、対応時間にも範囲があります。

知恵袋・5chにモアペイを名指しした生の投稿は確認できておらず、第三者の声はまだ少ない段階です。

申し込むかどうかは、シミュレーションの概算と提示額を文面で見比べてから判断しましょう。

シミュレーションと申込みは24時間いつでも試せます。

公式サイトで概算を確かめたうえで、判断してください。

[st-mcbutton url="https://more-pay.jp/" title="今すぐ申し込む" rel="" webicon="" target="" color="#fff" bgcolor="#e53935" bgcolor_top="#f44336" bordercolor="#e57373" borderwidth="1" borderradius="10" fontweight="bold" fontsize="120" width="90" webicon_after="st-svg-chevron-right" shadow="#c62828" ref="on" mcbox_bg="#fafafa" mcbox_color="" mcbox_title="最大90%を掲示・シミュレーション対応" beacon=""]※シミュレーションは24時間いつでも試せます[/st-mcbutton]
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
