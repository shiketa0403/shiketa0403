<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>モアペイの申込みから入金までの流れ</h2>

公式サイトの案内では「かんたん3STEP」で進みます。

ここでは初回利用を想定して、行動順に整理しました。

[st-timeline myclass="st-timeline-count" add_style=""]
[st-timeline-list text="シミュレーション" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
決済手段と希望金額を入れて概算を確認します。
[/st-timeline-list]
[st-timeline-list text="申込みフォーム送信" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
WEBフォームから申込み。以降はLINEでやり取りします。
[/st-timeline-list]
[st-timeline-list text="本人確認・金額提示" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
初回は書類を提出。振込額と時期の文面を保存します。
[/st-timeline-list]
[st-timeline-list text="振込・着金確認" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
着金額が提示どおりかを確認して完了です。
[/st-timeline-list]
[/st-timeline]

<h3>シミュレーションで概算確認</h3>

<span class="st-mymarker-s"><strong>最初のステップは、公式サイトのシミュレーションで概算を出すことです。</strong></span>

媒体ごとに77〜90%と率の幅があり、自分の決済手段でいくら受け取れるかが先に立つためです。

<table>
<thead><tr><th>項目</th><th>内容</th></tr></thead>
<tbody>
<tr><td>申込受付</td><td>24時間・年中無休</td></tr>
<tr><td>振込対応</td><td>9時〜20時の記載(レビュー媒体)</td></tr>
<tr><td>初回の目安</td><td>本人確認込みで約30分</td></tr>
<tr><td>2回目以降</td><td>最短5分の掲示</td></tr>
</tbody>
</table>

入力項目は、使う決済手段（キャリア決済・atone）と希望金額の2つ。

ここで出た概算が、後の提示額と比べる基準として使えます。

<h3>申込みフォームと本人確認</h3>

<span class="st-mymarker-s"><strong>概算に納得したら、申込みフォームの送信と本人確認に進みます。</strong></span>

初回は本人確認書類の提出があり、ここを済ませると以降の手続きが速くなるためです。

手続きはWEBとLINEのやり取りで完結し、店舗への来店はないという説明です。

振込額と時期の提示があったら、<span class="hutoaka">この段階で文面を保存</span>しておきましょう。

[st-kaiwa1]LINEのやり取りは残ります。振込額と時期の画面は保存しておくと安心です。[/st-kaiwa1]

<h3>振込確認と2回目以降の短縮</h3>

<span class="st-mymarker-s"><strong>最後のステップは、着金の確認です。</strong></span>

提示された金額どおりに振り込まれたかを確かめて、初めて取引が完了したと判断できるためです。

初回の目安は約30分、本人確認が済んだ2回目以降は最短5分の掲示に近づく流れ。

<span class="hutoaka">着金額が提示と違う場合</span>は、保存した文面をもとにやり取りの窓口へ確認しましょう。

最後に、この記事の要点を振り返ります。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
