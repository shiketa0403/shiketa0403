<textarea readonly id="content"><h2>SheDollの3つのデメリット</h2>

直販なし・実績の浅さ・在庫の限定性は、申込前に押さえておきたい弱点です。

<h3>直販なし・代理店経由のみ</h3>

<strong>SheDoll公式は直販を行っておらず、購入は国内代理店経由が基本です。</strong>

公式サイト(shedollofficial.com)はメーカー情報の発信が中心で、購入カートや決済機能を持たないためです。

希望モデルの注文は、OLdoll・kumadoll・Dachi Wife・yourdoll・楽園ドールといった代理店から個別に依頼する流れ。

代理店ごとに価格・キャンペーン・配送オプションが異なるため、複数見積りの比較が大切です。

<h3>創業3年の実績の浅さ</h3>

<strong>SheDollは2022年5月設立で、創業3年程度と業界では新興メーカーです。</strong>

老舗メーカー(WM Dollは2008年〜・Sino Dollは2015年〜)と比べて運営実績の蓄積が浅いためです。

長期使用後の経年劣化データや、複数年運用での品質維持の口コミは現時点で限定的。

10年単位での所有を前提に選ぶなら、老舗ブランドの安心感が優ります。

<h3>即納在庫が限定的</h3>

<strong>SheDollの納期は、代理店の在庫状況によって2週間〜2か月の幅があります。</strong>

新興メーカーで国内倉庫在庫が限定的なため、中国本国からの直送が多くなる構造のためです。

人気モデルは代理店在庫が枯渇しやすく、注文後にメーカー発注→中国直送の待ち時間が発生します。

即日入手を希望するなら、別メーカー(在庫の厚い大手)を検討する流れが現実的です。

デメリットを確認したところで、次は実際に購入できる主要代理店を整理します。
