<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>SheDollの3つのメリット</h2>

写真詐欺なしの仕上がり・素材構成・軽量化オプションの3点が、SheDollを選ぶ実利的な理由です。

<h3>写真詐欺なしの仕上がり</h3>

<strong>SheDollの最大の強みは、宣材写真と実物の見た目のギャップが小さい点です。</strong>

職人によるメイク仕上げと塗装で、写真上の色味や表情を実物にも再現する運用のためです。

二次レビューサイトと購入者の体験談では「思っていた通りに届いた」「広告写真の加工感が少ない」という評価が多く確認できます。

新興メーカーの懸念点である「写真と違う」リスクを抑えた設計が、コスト面での選びやすさにつながっています。

<h3>TPE+シリコンヘッドの組合せ</h3>

<strong>ボディはTPE(熱可塑性エラストマー)、ヘッドはシリコンの異素材構成が標準仕様です。</strong>

TPEは柔らかさと触感、シリコンはメイクの剥がれにくさと造形精度に優れる素材で、用途別に使い分けることで両方の長所を取れるためです。

シリコン製ヘッドはメイクが剥がれにくく、写真と同じ表情を維持しやすい特性があります。

TPEボディは抱き心地が柔らかく、純シリコンボディと比べて軽量です。

<h3>軽量化オプションの選択肢</h3>

<strong>SheDollには軽量化オプション(super lightweight)を選べる対応モデルがあります。</strong>

ラブドールは身長160cm台で30kg前後の重量があり、運搬・保管の負担を減らしたい層への対応策のためです。

公式案内では163cm-H・168cm-Dといった特定モデルが軽量化対応で、追加料金で標準モデルより数kgの軽量化が可能(要確認:対応モデル・追加料金額)。

一人暮らしの搬入や保管スペースで重量を気にする層に向く選択肢です。

メリットを確認したところで、次は申込前に把握すべきデメリットも見ておきます。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
