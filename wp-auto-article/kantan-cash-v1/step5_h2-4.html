出てくるのは、auかんたん決済や楽天キャッシュに関する質問。

別サービスへの回答を、かんたんキャッシュの評判と混同しないようにしましょう。

<h3>5chの生の書き込みは確認できず</h3>

5chでも、かんたんキャッシュに関する生の書き込みは今回の調査では確認できませんでした。

ネット上の実績情報が少ない、という指摘もあります。

出どころの分からない引用は、確認できた事実と分けて判断しましょう。
