<!DOCTYPE html>
<html lang="ja">
<head>

<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>悪い口コミ・評判に多い3つの不満</h2>

確認できた不満は、換金率・手数料・初回の所要時間の3つです。

報告の内容をそのまま紹介します。

<h3>表示より換金率が低いという不満</h3>

<span class="st-mymarker-s"><strong>「思ったより換金率が低かった」という趣旨の不満が紹介されています。</strong></span>

表の91〜99.8%と、<span class="hutoaka">実際の受取額に差が出る</span>場合があるからです。

「やってみた結果やばい業者だった」との趣旨の批判的な体験記事も。

決済前に振込額の提示を受け、金額で判断しましょう。

<h3>不透明な手数料という指摘</h3>

<span class="st-mymarker-s"><strong>高い還元率の裏側に不透明な手数料がある、という指摘があります。</strong></span>

表示の率だけでは、<span class="hutoaka">差し引かれる金額を事前に計算できない</span>からです。

「低評価ばかりの実態」と題する批判的な記事も確認しています。

見積もりの段階で、手数料込みの振込額を数字で確かめましょう。

[st-kaiwa1]手数料の有無は、見積もりの振込額を数字で確認するのが早いです。[/st-kaiwa1]

<h3>初回は3分で終わらなかった報告</h3>

<span class="st-mymarker-s"><strong>「初回は3分では終わらなかった」という報告があります。</strong></span>

初回は本人確認の工程が入り、<span class="hutoaka">掲示どおりの時間では進まない</span>からです。

「初回は<strong>1時間程度</strong>かかった」との報告もあります。

初回の申込は、時間に余裕を見ておきましょう。

では、知恵袋や5chには実際の投稿があるのでしょうか。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
