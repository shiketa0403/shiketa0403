<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>申込前に知るべき3つの注意点</h2>

「思ったより少ない」と感じる原因の多くは、表示の読み方にあります。

申込前に3つの注意点を確認しましょう。

<h3>99.8%は上限のキャンペーン表示</h3>

<span class="st-mymarker-s"><strong>最大99.8%という表示は、91万円以上の利用に適用される上限のキャンペーン表示です。</strong></span>

換金率は利用額に応じた段階表示で、1〜10万円では91%と差があるからです。

一方で実勢の検証は、<span class="hutoaka">80%を超えないという内容</span>。

適用される率は、申込時の見積もりで確認しましょう。

[st-kaiwa1 r]迷ったときは、率や口コミより見積もりの振込額で判断するのがおすすめです。[/st-kaiwa1]

<h3>92%や3分という数字の表記ゆれ</h3>

<span class="st-mymarker-s"><strong>リピート率や振込時間の数字は、媒体によって表記がゆれています。</strong></span>

公式サイトはリピート率92%・最短3分、レビューサイトの紹介は83%・最短7分と異なるからです。

公式サイトのA社・B社との比較表も、<span class="hutoaka">自社掲載の情報</span>です。

数字は鵜呑みにせず、見積もりの金額で確認しましょう。

<h3>カード会員規約上の禁止行為</h3>

<span class="st-mymarker-s"><strong>クレジットカードの現金化は、業者を問わずカード会社が禁止している行為です。</strong></span>

カード会社の規約で「換金目的の利用」が明示的に禁止されているからです。

発覚した場合、カードの<span class="hutoaka">利用停止や強制退会につながるリスク</span>があります。

業者選び以前に、この前提を理解した上で判断しましょう。

[st-mybox title="注意ポイント" webicon="st-svg-exclamation-circle" color="#ef5350" bordercolor="#ef9a9a" bgcolor="#ffebee" borderwidth="2" borderradius="5" titleweight="bold" fontsize="" myclass="st-mybox-class" margin="25px 0 25px 0"]
<div class="maruck">
<ul>
<li>表の99.8%は上限表示(実勢は80%を超えない検証)</li>
<li>数字に表記ゆれあり・比較表は自社掲載</li>
<li>現金化はカード会員規約上の禁止行為</li>
</ul>
</div>
[/st-mybox]

注意点を押さえたところで、実際の申込手順を確認します。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
