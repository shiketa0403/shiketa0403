<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>スマホ申込から振込までの手順</h2>

申込はスマホで完結し、来店は不要です。

見積もりから振込までの流れを順に見ていきましょう。

[st-timeline myclass="st-timeline-count" add_style=""]
[st-timeline-list text="Webフォーム・電話で申込" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
フォームか電話(0120-849-850)で申込・振込額の提示あり
[/st-timeline-list]
[st-timeline-list text="本人確認・カード決済" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
初回は本人確認書類をスマホで撮影して提出し、カード決済を行う
[/st-timeline-list]
[st-timeline-list text="振込完了" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
最短3分の掲示(報告は15分〜初回1時間程度)
[/st-timeline-list]
[/st-timeline]

<h3>Webフォーム申込の流れ</h3>

<span class="st-mymarker-s"><strong>申込はWebフォームか電話(0120-849-850)から始まります。</strong></span>

受付後に振込額の提示があり、納得してからカード決済に進む流れだからです。

対応カードは、VISA・Mastercard・JCB・AMEXと<strong>ペイディを含む後払い</strong>。

提示された振込額に納得できなければ、<span class="hutoaka">この段階で断りましょう</span>。

<h3>本人確認とカード決済</h3>

<span class="st-mymarker-s"><strong>初回は本人確認書類の提出とカード決済が必要です。</strong></span>

現金化は商品売買の形式を取り、本人確認が法令上必須だからです。

運転免許証やマイナンバーカードをスマホで撮影して提出します。

決済前に、金額と商品の内容を確認しましょう。

[st-kaiwa1]初回は本人確認がある分、時間に余裕を見ておくと安心です。[/st-kaiwa1]

<h3>振込完了までの時間目安</h3>

<span class="st-mymarker-s"><strong>振込は最短3分の掲示ですが、実際は幅があります。</strong></span>

初回の本人確認や混雑の状況で、<span class="hutoaka">所要時間が前後する</span>からです。

確認できた報告は、15分から初回1時間程度まで。

<table>
<thead><tr><th>項目</th><th>内容</th></tr></thead>
<tbody>
<tr><td>受付</td><td>Webフォーム・電話(0120-849-850)</td></tr>
<tr><td>掲示の振込速度</td><td>最短3分</td></tr>
<tr><td>確認できた報告</td><td>15分〜初回1時間程度</td></tr>
<tr><td>2回目以降</td><td>10分しないくらいという声</td></tr>
</tbody>
</table>

当日中に受け取りたい場合は、早めの申込がおすすめです。

手順を把握したら、最後に記事全体の要点を整理します。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
