<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>悪い口コミ・評判に多い3つの不満</h2>

確認できた不満は、換金率・手数料・初回の所要時間の3つです。

報告の内容をそのまま紹介します。

<h3>表示より換金率が低いという不満</h3>

「思ったより換金率が低かった」という趣旨の不満が紹介されています。

表の91〜99.8%と、実際の受取額に差が出る場合があるからです。

「やってみた結果やばい業者だった」との趣旨の批判的な体験記事も。

決済前に振込額の提示を受け、金額で判断しましょう。

<h3>不透明な手数料という指摘</h3>

高い還元率の裏側に不透明な手数料がある、という指摘があります。

表示の率だけでは、差し引かれる金額を事前に計算できないからです。

「低評価ばかりの実態」と題する批判的な記事も確認しています。

見積もりの段階で、手数料込みの振込額を数字で確かめましょう。

<h3>初回は3分で終わらなかった報告</h3>

「初回は3分では終わらなかった」という報告があります。

初回は本人確認の工程が入り、掲示どおりの時間では進まないからです。

「初回は1時間程度かかった」との報告もあります。

初回の申込は、時間に余裕を見ておきましょう。

では、知恵袋や5chには実際の投稿があるのでしょうか。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
