<textarea readonly id="content" style="width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word;">
<h2>悪い口コミ・評判で目立つ3つの指摘</h2>

気になる指摘は、追加手数料・振込の遅れ・連絡経路の3つです。

いずれも申込前の対処で織り込めます。

<h3>追加手数料の相談事例の紹介</h3>

<strong>名目を変えた追加手数料が発生したという、消費生活センターへの相談事例が紹介されています。</strong>

掲示の率と実際の受取額の間に、説明と異なる差引が挟まったという内容のためです。

「説明と異なる手数料の請求」という声の紹介も、同じ型の報告。

手数料込みの振込額を、決済前に文面で受け取りましょう。

<h3>月初は振込が遅れる場合あり</h3>

<strong>「振込が遅かった」という声が紹介されています。</strong>

月初は利用者が多く、窓口の混雑で振込が遅くなる場合があるという説明のためです。

30分程度で完了したという声との差は、時期と混雑によるものです。

当日中に使う予定がある日は、時間に余裕を持って申し込みましょう。

<h3>SMS個別連絡の念押し報告</h3>

<strong>「2回目以降は個人のショートメールで連絡を」と念押しされた、という報告が紹介されています。</strong>

レビュー側は、正規の窓口を外れた取引につながる懸念を挙げているためです。

この報告は知恵袋の投稿として紹介されている内容で、元の投稿は確認できていません。

連絡は公式サイトの窓口を通し、個別の連絡先への誘導には応じないようにしましょう。

ここまでの声の多くはレビューサイト経由です。

では、知恵袋や5chに生の投稿はあるのでしょうか。
