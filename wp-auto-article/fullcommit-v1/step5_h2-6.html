<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>フルコミット Step05 H2_6</title>
</head>
<body>
<textarea readonly id="content" style="width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word;">
<h2>申込から振込までの手順</h2>

フルコミットの手続きは、公式サイトの申込フォームから始まります。

流れは申込・見積もり・決済・振込の順です。

<h3>申込と見積もりの文面確認</h3>

<strong>最初のステップは、申込フォームの送信と見積もりの確認です。</strong>

提示額に納得してから進めば、受取額のずれを防げます。

確認したいのは、適用される率と手数料込みの振込額。

見積もりの内容は、文面で受け取ってから決めましょう。

<h3>カード決済の手続き</h3>

<strong>見積もりに納得したら、案内に沿ってカードや後払いアプリの枠で指定商品を決済します。</strong>

決済の確認をもって、振込の手続きに進む方式のためです。

初回は本人確認のやり取りが挟まるため、書類を手元に用意しておくと止まりません。

不明点は、決済前に公式窓口で確かめましょう。

<h3>振込までの時間目安</h3>

<strong>振込は30分程度という声がありますが、月初は遅れる場合があるという説明です。</strong>

利用者が集中する時期は、窓口の処理が混み合うためです。

時間を左右するのは、申込の時期と当日の混雑。

着金を急ぐ日は、月初を避けて早めの時間に申し込みましょう。

最後に、この記事の調査結果を整理します。
</textarea>
<button id="copyBtn" style="margin-top: 10px; padding: 8px 24px; font-size: 14px; cursor: pointer;">コピー</button>
<script>
document.getElementById('copyBtn').addEventListener('click', function() {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
