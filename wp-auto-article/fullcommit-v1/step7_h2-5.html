<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>申込前に知るべき3つの注意点</h2>

申込を決める前に、率の適用条件・連絡経路・規約の3点を押さえておきましょう。

特に3つ目は、現金化サービス全体に共通する重要な注意点です。

<h3>99.2%は法人70万円以上の条件</h3>

<span class="st-mymarker-s"><strong>最高99.2%は、法人プランかつ70万円以上の利用という条件の解説です。</strong></span>

個人の少額利用に、<span class="hutoaka">最高値がそのまま適用されるわけではありません</span>。

個人の目安として紹介されるのは、一律80%という数字。

自分のプランと金額での率を、見積もりで確かめましょう。

<h3>連絡は公式窓口を通す</h3>

<strong>やり取りは、公式サイトの窓口を通して行いましょう。</strong>

<span class="hutoaka">個人のショートメールへの誘導</span>が報告され、正規窓口を外れると記録が残らないためです。

レビューには許可の取得を疑問視する指摘もあり、開示情報は自分の目でも確かめる対象です。

<span class="st-mymarker-s">文面の残る連絡手段で</span>、金額と条件を受け取りましょう。

[st-kaiwa1 r]連絡は公式窓口が原則。記録に残る形が安心ですね。[/st-kaiwa1]

<h3>カード会員規約上の禁止行為</h3>

<span class="st-mymarker-s"><strong>クレジットカード枠の現金化は、カード会員規約上の禁止行為に該当します。</strong></span>

カード会社の規約で「換金目的の利用」が明示的に禁止されているからです。

発覚した場合、カードの<span class="hutoaka">利用停止や強制解約</span>につながるおそれがあります。

日本クレジット協会も、ショッピング枠の現金化を利用しないよう注意を呼びかけています。

ペイディやバンドルカードにも換金目的を禁じる規約があるため、後払いアプリでの利用も同じリスクを踏まえて判断しましょう。

[st-mybox title="注意ポイント" webicon="st-svg-exclamation-circle" color="#ef5350" bordercolor="#ef9a9a" bgcolor="#ffebee" borderwidth="2" borderradius="5" titleweight="bold" fontsize="" myclass="st-mybox-class" margin="25px 0 25px 0"]
<div class="maruck">
<ul>
<li>99.2%は法人プラン・70万円以上の条件</li>
<li>連絡は公式窓口を通し文面で記録を残す</li>
<li>現金化はカード会員規約上の禁止行為</li>
</ul>
</div>
[/st-mybox]

注意点を踏まえて使うと決めたら、残る疑問は具体的な手順です。

申込から振込までの流れを見ていきましょう。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
