<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>悪い口コミ・評判で目立つ3つの指摘</h2>

目立つ指摘は、実質の換金率・手数料の説明・待ち時間の3つです。

内容をそのまま紹介します。

<h3>消費税差引で実質70%の体験談</h3>

「消費税を取られて実質70%くらいだった」という体験談の紹介があります。

表示の率から消費税や振込手数料が差し引かれる場合があるからです。

実際は80%程度という紹介とも方向が一致する内容。

決済前に振込額の提示を受け、金額で判断しましょう。

<h3>手数料の説明が不明瞭という不満</h3>

手数料の説明が不明瞭だった、という不満の紹介があります。

公式サイトに手数料無料の記載がなく、差引の内訳が見えにくいからです。

個人情報の管理に不安を感じたという声もあります。

見積もりの段階で、差引の内訳を確認しましょう。

<h3>待ち時間が掲示と違うという指摘</h3>

待ち時間が掲示と違った、という指摘があります。

混雑や銀行の反映タイミングで、着金までの時間が延びる場合があるからです。

振込遅れの多くは15時以降や土日祝の銀行側の事情という指摘です。

急ぎの場合は、着金の目安を申込時に確認しましょう。

では、知恵袋や5chには実際の投稿があるのでしょうか。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
