<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>申込前に知るべき3つの注意点</h2>

「思ったより少ない」と感じる原因の多くは、表示の読み方にあります。

申込前に3つの注意点を確認しましょう。

<h3>99.5%は上限側という表示条件</h3>

最大99.5%という表示は、条件がそろった場合の上限側の数字です。

換金率は1万〜10万円で91%からの金額別表示だからです。

表では100万円以上99.9%と、数字がゆれる表記も。

適用される率は、申込時の見積もりで確認しましょう。

<h3>No.1や総合4.8は自社掲載の情報</h3>

No.1表示や総合4.8の評価は、自社サイト掲載の情報です。

3冠No.1は2023年11月の調査という注記で、お客様の声も公式サイト内の掲載だからです。

運営情報では、法人格の記載がないという指摘もあります。

掲示は参考にしつつ、会社概要は自分の目で確認しましょう。

<h3>カード会員規約上の禁止行為</h3>

クレジットカードの現金化は、業者を問わずカード会社が禁止している行為です。

カード会社の規約で「換金目的の利用」が明示的に禁止されているからです。

発覚した場合、カードの利用停止や強制退会につながるリスクがあります。

業者選び以前に、この前提を理解した上で判断しましょう。

注意点を押さえたところで、実際の申込手順を確認します。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
