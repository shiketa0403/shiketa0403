<textarea readonly id="content"><h2>知恵袋・5chの投稿を実際に調査</h2>

本記事で実際に調査した内容を紹介します。

<h3>知恵袋は実投稿を直接確認できず</h3>

Yahoo!知恵袋では、いますぐクレジットに関する実投稿を直接確認できませんでした。

「クレジット」が一般的な言葉で、カード全般や映画の話題に埋もれやすいからです。

出てくるのは、クレジット表記やカード一般の質問。

元投稿が確認できない引用は、参考程度にとどめましょう。

<h3>5chはスレ実在も言及は確認できず</h3>

5chには現金化業者の情報交換スレがありますが、言及は確認できませんでした。

スレ自体は実在するものの、本文での書き込みまでは確認できないからです。

現金化系のスレには業者のサクラ投稿が混じる、という指摘もあります。

出どころの分からない引用は、確認できた事実と分けて判断しましょう。

ここまでは口コミの話でしたが、数字と掲示の見方も押さえておきましょう。
