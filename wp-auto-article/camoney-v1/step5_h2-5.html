<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>申込前に知るべき3つの注意点</h2>

「思ったより少ない・遅い」と感じる原因の多くは、条件の読み方にあります。

申込前に3つの注意点を確認しましょう。

<h3>初回85〜90%と2回目80%の差</h3>

初回85〜90%の買取率は、2回目以降80%に下がります。

公式サイトのよくある質問で、条件が分かれて明示されているからです。

90%と80%では、10万円の決済で手取りに1万円の差。

自分に適用される率は、申込時の見積もりで確認しましょう。

<h3>振込は営業時間内のみという条件</h3>

受付は24時間でも、振込は営業時間内のみです。

「振り込まれない」と感じる報告の多くは、この条件が理由と整理されているからです。

繁忙期の毎月1日には、他社で待ち時間が300分を超えた例も掲載されています。

当日中に受け取りたい場合は、受付時間を先に確認しましょう。

<h3>カード会員規約上の禁止行為</h3>

キャリア決済やクレジットカードの現金化は、運営側が禁止している行為です。

カード会社の規約で「換金目的の利用」が明示的に禁止されているからです。

キャリアマネー自身も、発覚時はカードの利用停止や解約の可能性があると明記しています。

業者選び以前に、この前提を理解した上で判断しましょう。

注意点を押さえたところで、実際の申込手順を確認します。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
