<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>スマホ申込から振込までの手順</h2>

申込はスマホで完結し、来店は不要です。

Web申込から振込までの流れを順に見ていきましょう。

[st-timeline myclass="st-timeline-count" add_style=""]
[st-timeline-list text="Webフォームで申込" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
公式サイトのフォーム(受付24時間365日)で申込み、買取額の提示を受ける
[/st-timeline-list]
[st-timeline-list text="本人確認・キャリア決済" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
初回は本人確認を行い、キャリア決済枠で購入手続きをする
[/st-timeline-list]
[st-timeline-list text="振込完了" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
掲示は最短10分(確認できた報告は約50分・振込は営業時間内のみ)
[/st-timeline-list]
[/st-timeline]

<h3>Web申込から見積もりの流れ</h3>

<span class="st-mymarker-s"><strong>申込は公式サイトのフォームから始まります。</strong></span>

受付後に買取額の提示があり、納得してから決済に進む流れだからです。

掲げる流れは、申込・決済・振込の3段階。

提示された振込額に納得できなければ、<span class="hutoaka">この段階で断りましょう</span>。

<h3>本人確認とキャリア決済</h3>

<span class="st-mymarker-s"><strong>初回は本人確認と、キャリア決済での購入手続きが必要です。</strong></span>

現金化は商品売買の形式を取り、本人確認が法令上必須だからです。

買取式とキャッシュバック式の仕組みは、公式サイトに解説があります。

決済前に、金額と商品の内容を確認しましょう。

[st-kaiwa1]初回は本人確認がある分、時間に余裕を見ておくと安心です。[/st-kaiwa1]

<h3>振込完了までの時間目安</h3>

<span class="st-mymarker-s"><strong>振込は最短10分の掲示ですが、実際は幅があります。</strong></span>

営業時間や混雑で、<span class="hutoaka">所要時間が前後する</span>からです。

確認できた報告は、約50分かかったという内容。

<table>
<thead><tr><th>項目</th><th>内容</th></tr></thead>
<tbody>
<tr><td>受付</td><td>Webフォーム(24時間365日)</td></tr>
<tr><td>掲示の振込速度</td><td>最短10分</td></tr>
<tr><td>確認できた報告</td><td>約50分かかった内容</td></tr>
<tr><td>振込の条件</td><td>営業時間内のみ・毎月1日は繁忙期</td></tr>
</tbody>
</table>

当日中に受け取りたい場合は、早めの時間帯の申込がおすすめです。

手順を把握したら、最後に記事全体の要点を整理します。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
