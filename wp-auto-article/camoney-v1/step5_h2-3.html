<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>悪い口コミ・評判で目立つ3つの指摘</h2>

目立つ指摘は、5chの報告・振込時間・運営情報の3つです。

内容をそのまま紹介します。

<h3>振り込まれないという5chの報告</h3>

5chには「振り込まれない」というトラブル報告があった、という紹介があります。

ただし多くは、振込が営業時間内のみという条件を知らずに申し込んだケースだからです。

元の書き込みは、今回の調査では未確認。

申込前に、その日の振込受付時間を確認しましょう。

<h3>最短10分に対し約50分の報告</h3>

「最短10分」の掲示に対し、実際は約50分かかったという報告があります。

混雑や確認の状況で、所要時間が前後するからです。

毎月1日は業界的な繁忙期で、遅れやすいという指摘もあります。

急ぎの場合は、時間に余裕を持って申し込みましょう。

<h3>代表者名や電話番号が非公開な点</h3>

運営情報は住所のみの公開で、代表者名や電話番号が非公開という指摘があります。

会社概要のページに、千葉県船橋市の所在地だけが記載されているからです。

透明性の面で課題とするレビューもあります。

問い合わせ手段は、申込前に自分の目で確認しましょう。

では、知恵袋や5chには実際の投稿があるのでしょうか。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
