<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>注意したい3つのデメリット</h2>

メリットだけで判断すると、手数料や申込時間でつまずきます。

3つの注意点を事前に押さえましょう。

<h3>手数料の事前確認が必須</h3>

<strong>手数料0円の掲示と、実際の請求が異なるという指摘があります。</strong>

換金率とは別の費用を、申込時に提示されたという投稿があるからです。

実投稿には「申込時に<strong>25%の手数料</strong>と言われた」という報告。

申込前に「振込額はいくらか」を手数料込みの見積もりで確認しましょう。

<h3>夜間申込は翌日対応の可能性</h3>

<strong>振込対応は9時〜18時で、夜間の申込は翌日に回る場合があります。</strong>

申込受付は24時間でも、振込処理は営業時間内に行われるからです。

18時以降の申込は、翌朝9時以降の処理になる可能性があります。

急ぎの場合は、平日の早い時間帯に申込みましょう。

<h3>カード会員規約違反のリスク</h3>

<strong>クレジットカード現金化は<span class="hutoaka">カード会員規約上の禁止行為</span>です。</strong>

カード会社の規約で「換金目的の利用」が明示的に禁止されているからです。

発覚時のリスクは利用停止・残額の一括請求・強制解約の3点。

決済アプリも規約で現金化を禁止しており、利用は自己責任での判断が前提です。

[st-mybox title="注意ポイント" webicon="st-svg-exclamation-circle" color="#ef5350" bordercolor="#ef9a9a" bgcolor="#ffebee" borderwidth="2" borderradius="5" titleweight="bold" fontsize="" myclass="st-mybox-class" margin="25px 0 25px 0"]
<div class="maruck">
<ul>
<li>手数料0円掲示でも「25%の手数料」の報告あり(見積もりで確認)</li>
<li>振込対応は9時〜18時・夜間申込は翌日の可能性</li>
<li>現金化はカード・決済アプリの規約上の禁止行為</li>
</ul>
</div>
[/st-mybox]

注意点を把握したら、口コミの実調査結果を確認しましょう。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
