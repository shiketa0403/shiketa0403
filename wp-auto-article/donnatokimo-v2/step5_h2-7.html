<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }

<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>まとめ</h2>

どんなときも。クレジットは公表91〜98%の換金率をうたう現金化サービスです。

実投稿では「実質70〜80%だった」という乖離報告と「振込は速い」という評価が混在します。

手数料0円の掲示と実際の請求が異なる指摘もあるため、見積もり確認が前提です。

実調査では、振り込まれない詐欺の集団報告は確認できませんでした。

振込対応は9時〜18時のため、夜間の申込は翌日対応になる可能性があります。

利用する場合は、手数料込みの振込額に納得してから決済に進みましょう。

[CTA: アフィリエイトリンクなし(公式サイトへの素リンク https://donnatokimo-c.com/)]
公式サイトで手数料込みの見積もりを確認したうえで、利用可否を判断しましょう。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
