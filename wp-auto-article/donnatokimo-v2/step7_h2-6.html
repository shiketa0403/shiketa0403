<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>スマホ申込から振込までの手順</h2>

申込はスマホで完結し、来店は不要です。

3つの工程で振込完了まで進みます。

[st-timeline myclass="st-timeline-count" add_style=""]
[st-timeline-list text="申込フォーム送信" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
公式サイトのフォームから24時間申込み、金額と手数料の提示を受ける
[/st-timeline-list]
[st-timeline-list text="本人確認・カード決済" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
初回は本人確認書類をスマホで撮影して提出し、カード決済を行う
[/st-timeline-list]
[st-timeline-list text="振込完了" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
最短10分の表記・初回は30分〜60分ほど長くかかる想定(振込対応9時〜18時)
[/st-timeline-list]
[/st-timeline]

<h3>申込フォーム入力の流れ</h3>

<strong>公式サイトのフォームから24時間申込めます。</strong>

氏名・連絡先・希望額・利用カードに入力項目を絞った設計だからです。

送信後は担当者から連絡が入り、金額と手数料の提示に進みます。

提示された振込額に納得できない場合は、この段階で断りましょう。

<h3>本人確認と決済の進め方</h3>

<strong>初回は本人確認書類の提出とカード決済が必要です。</strong>

現金化は商品売買の形式を取り、本人確認が法令上必須だからです。

運転免許証・マイナンバーカード・健康保険証のいずれかをスマホで撮影して提出。

初回は本人確認の分、30分〜60分ほど長くかかる想定でいましょう。

<h3>振込完了までの時間目安</h3>

<strong>振込は最短10分の表記で、初回はそれより時間がかかります。</strong>

振込対応が<strong>9時〜18時</strong>の体制で、時間帯により前後するからです。

「翌日にはきちんと入金された」という実投稿があり、振込自体の実績は確認できます。

急ぎの場合は、平日の午前中に申込みましょう。

申込手順を把握したら、最後に記事全体の要点をまとめます。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
