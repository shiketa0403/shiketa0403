<body>
<textarea readonly id="content" style="width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word;">
<h2>悪い口コミ・評判で目立つ3つの指摘</h2>

気になる指摘は、率の変動・振込の手数料・情報の少なさの3点です。

いずれも利用前の確認で対処できます。

<h3>率は82%からで利用額次第</h3>

<strong>換金率は82%からで、実際の率は利用額次第です。</strong>

少額の利用では下限に近い率になり、掲示の印象と受取額に差が出やすいためです。

率を左右するのは、利用する金額の大きさ。

自分の額での率を先に聞けば、期待とのずれは防げます。

<h3>振込は手数料が利用者負担</h3>

<strong>振込で受け取る場合は、振込手数料が利用者負担という紹介があります。</strong>

その他の手数料は掛からないという紹介の一方で、振込分は受取額から差し引かれるためです。

来店で受け取る場合、振込手数料の負担はありません。

受取方法ごとの差を踏まえて、受取額で比べましょう。

<h3>口コミの数自体が少ない</h3>

<strong>セブンギフトは口コミの数自体が少なく、判断材料が限られています。</strong>

札幌の店舗型サービスで、全国型のWEB完結業者より利用者の声が集まりにくいためです。

情報が少ない以上、良い評判も悪い評判も鵜呑みにできません。

確認できた事実と掲示を分けて、冷静に判断しましょう。

ここまでの整理を踏まえて、では知恵袋や5chに生の投稿はあるのでしょうか。
</textarea>
<button id="copyBtn" style="margin-top: 10px; padding: 8px 24px; font-size: 14px; cursor: pointer;">コピー</button>
<script>
document.getElementById('copyBtn').addEventListener('click', function() {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
