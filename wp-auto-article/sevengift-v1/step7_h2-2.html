<!DOCTYPE html>
<html lang="ja">
<head>

<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>良い口コミ・評判で確認できた3点</h2>

確認できた良い材料は、店舗の実態・来店のしやすさ・営業体制の3点です。

店舗型ならではの判断材料として整理します。

<h3>店舗と所在地を公開する実態</h3>

<span class="st-mymarker-s"><strong>セブンギフトは、店舗の所在地を公開して営業しています。</strong></span>

所在地を明かさない業者と異なり、店の実態を自分の目で確かめられるためです。

場所は札幌の大通駅から徒歩1分、南一条西5-13の太陽ビルアネックス2階にあります。

来店前に場所を地図で確認できる点は、安心材料の1つです。

[st-kaiwa1 r]所在地と営業時間が公開されているのは、確認しやすいですね。[/st-kaiwa1]

<h3>周りの目を気にせず来店できる</h3>

<strong>「<span class="st-mymarker-s">周りの目を気にせず来店できる</span>」という紹介が、店舗型の利点として挙がっています。</strong>

セブンギフトが商品券・ギフト券の買取業を併営しているためです。

外から見えるのは、金券買取の店を使う姿まで。

現金化の利用だと周囲に分かりにくい点は、来店派には利点です。

<h3>年中無休10時から19時の営業</h3>

<span class="st-mymarker-s"><strong>営業は年中無休で、10時から19時まで対応しています。</strong></span>

土日祝を含めて開いており、平日に時間を取れない人も使えるためです。

LINE公式アカウント(認証済み)やブログでの情報発信も確認できます。

急ぎの週末でも、営業時間内なら選択肢に入れられます。

[st-mybox title="こんな方に向いています" webicon="st-svg-check-circle" color="#757575" bordercolor="#BDBDBD" bgcolor="#ffffff" borderwidth="2" borderradius="5" titleweight="bold" fontsize="" myclass="st-mybox-class" margin="25px 0 25px 0"]
<div class="maruck">
<ul>
<li>札幌市内・近郊で来店できる方</li>
<li>店の実態を確かめてから使いたい方</li>
<li>土日祝に手続きしたい方</li>
</ul>
</div>
[/st-mybox]

一方で、良い材料だけを見て決めるのは早計です。

次は目立った指摘を確認します。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
