<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>スマホ申込から振込までの手順</h2>

申込はスマホで完結し、来店は不要です。

見積もりから振込までの流れを順に見ていきましょう。

<h3>LINE・フォーム見積りの流れ</h3>

申込はLINEかWebの見積りフォームから始まります。

見積もり後に利用確認・商品購入・振込という4ステップで進むからです。

LINEからの見積りは、換金率UPのキャンペーン対象。

提示された振込額に納得できなければ、この段階で断りましょう。

<h3>本人確認とカード決済</h3>

初回は本人確認書類の提出とカード決済が必要です。

現金化は商品売買の形式を取り、本人確認が法令上必須だからです。

運転免許証やマイナンバーカードをスマホで撮影して提出します。

求められた情報の用途は、その場で確認しましょう。

<h3>振込完了までの時間目安</h3>

振込は最短3分の掲示ですが、実際は幅があります。

営業時間が9時〜19時30分で、確認の状況によって前後するからです。

確認できた報告は、5分から初回15分程度まで。

当日中に受け取りたい場合は、営業時間内の早めの申込がおすすめです。

手順を把握したら、最後に記事全体の要点を整理します。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
