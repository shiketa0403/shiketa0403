<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>スマホ申込から振込までの手順</h2>

申込はスマホで完結し、来店は不要です。

見積もりから振込までの流れを順に見ていきましょう。

[st-timeline myclass="st-timeline-count" add_style=""]
[st-timeline-list text="かんたん見積り" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
LINEまたはWebフォームで申込・LINEは換金率UPのキャンペーン対象
[/st-timeline-list]
[st-timeline-list text="利用確認" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
初回は本人確認書類をスマホで撮影して提出する
[/st-timeline-list]
[st-timeline-list text="商品購入" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
指定された商品をクレジットカードで決済する
[/st-timeline-list]
[st-timeline-list text="お振込み" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
最短3分の掲示(報告は5分〜初回15分程度・営業時間9時〜19時30分)
[/st-timeline-list]
[/st-timeline]

<h3>LINE・フォーム見積りの流れ</h3>

<span class="st-mymarker-s"><strong>申込はLINEかWebの見積りフォームから始まります。</strong></span>

見積もり後に利用確認・商品購入・振込という4ステップで進むからです。

LINEからの見積りは、換金率UPのキャンペーン対象。

提示された振込額に納得できなければ、<span class="hutoaka">この段階で断りましょう</span>。

<h3>本人確認とカード決済</h3>

<span class="st-mymarker-s"><strong>初回は本人確認書類の提出とカード決済が必要です。</strong></span>

現金化は商品売買の形式を取り、本人確認が法令上必須だからです。

運転免許証やマイナンバーカードをスマホで撮影して提出します。

求められた情報の用途は、その場で確認しましょう。

[st-kaiwa1]初回は本人確認がある分、時間に余裕を見ておくと安心です。[/st-kaiwa1]

<h3>振込完了までの時間目安</h3>

<span class="st-mymarker-s"><strong>振込は最短3分の掲示ですが、実際は幅があります。</strong></span>

<span class="hutoaka">営業時間が9時〜19時30分</span>で、確認の状況によって前後するからです。

確認できた報告は、5分から初回15分程度まで。

<table>
<thead><tr><th>項目</th><th>時間</th></tr></thead>
<tbody>
<tr><td>LINE・フォーム受付</td><td>24時間</td></tr>
<tr><td>営業時間(対応・振込)</td><td>9時〜19時30分</td></tr>
<tr><td>掲示の振込速度</td><td>最短3分</td></tr>
<tr><td>確認できた報告</td><td>5分〜初回15分程度</td></tr>
</tbody>
</table>

当日中に受け取りたい場合は、営業時間内の早めの申込がおすすめです。

手順を把握したら、最後に記事全体の要点を整理します。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
