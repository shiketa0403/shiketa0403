<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>知恵袋・5chの投稿を実際に調査</h2>

Yahoo!知恵袋と5chを実際に検索して調査しました。

今回は知恵袋で実際の質問を確認できています。

<h3>知恵袋に質問1件を確認</h3>

<span class="st-mymarker-s"><strong>知恵袋では、即金キンタロウを名指しした質問を1件確認しました。</strong></span>

「実際の換金率や振込はどうか」を尋ねる、利用検討者の質問のためです。

当方の検索で確認できたのは質問文までで、<span class="hutoaka">回答の内容は未確認</span>。

数少ない生の声として、率を確かめる姿勢だけ参考にしましょう。

<h3>5chの投稿は特定できず</h3>

<span class="st-mymarker-s"><strong>5chでは、即金キンタロウへの直接の書き込みを特定できませんでした。</strong></span>

レビュー媒体側の調査でも「有益な体験談はほとんどない」と記載されているためです。

「5chの口コミ」と題する記事にも、<span class="hutoaka">元レスの引用は見当たりません</span>。

元の書き込みが示されない口コミは、参考程度にとどめましょう。

[st-cmemo webicon="st-svg-exclamation-circle" iconcolor="#919191" bgcolor="#fafafa" color="#000000" bordercolor="" borderwidth="" iconsize=""]「即金キンタロウの口コミ」はレビューサイト経由の紹介が中心です。元の投稿があるかを確かめて読みましょう。[/st-cmemo]

生の声が少ないからこそ、申込前に押さえるべきは数字の条件と確認の手順です。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
