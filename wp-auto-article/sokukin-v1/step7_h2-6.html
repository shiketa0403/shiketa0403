<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>申込から振込までの手順</h2>

即金キンタロウの手続きは、公式サイトの申込フォームから始まります。

流れは申込・見積もり・商品購入・振込の順です。

[st-timeline myclass="st-timeline-count" add_style=""]
[st-timeline-list text="申込フォームで申込" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
[/st-timeline-list]
[st-timeline-list text="見積もり・条件を文面で確認" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
[/st-timeline-list]
[st-timeline-list text="案内に沿って指定商品を決済" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
[/st-timeline-list]
[st-timeline-list text="お振込み(初回最短10分の紹介)" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
[/st-timeline-list]
[/st-timeline]

<h3>申込と見積もりの文面確認</h3>

<span class="st-mymarker-s"><strong>最初のステップは、申込と見積もりの確認です。</strong></span>

提示額に納得してから進めば、<span class="hutoaka">受取額のずれ</span>を防げます。

確認したいのは、適用される率と手数料込みの振込額。

見積もりの内容は、文面で受け取ってから決めましょう。

<h3>商品購入と買取の手続き</h3>

<strong>見積もりに納得したら、案内に沿って指定の商品を決済します。</strong>

購入した商品の買取という方式で、決済の確認をもって振込に進むためです。

初回は本人確認のやり取りが挟まるため、書類を手元に用意しておくと止まりません。

不明点は、<span class="st-mymarker-s">決済前に窓口で確かめ</span>ましょう。

[st-kaiwa1]初回は本人確認書類を手元に。準備しておくと止まりません。[/st-kaiwa1]

<h3>振込までの時間目安</h3>

<span class="st-mymarker-s"><strong>振込は初回最短10分、2回目以降は最短3分という紹介です。</strong></span>

365日対応で、申込から振込までがWEBで完結する方式のためです。

<table>
<thead><tr><th>項目</th><th>内容</th></tr></thead>
<tbody>
<tr><td>申込</td><td>WEBフォーム</td></tr>
<tr><td>決済</td><td>後払いアプリ・キャリア決済・クレカ</td></tr>
<tr><td>振込</td><td>初回最短10分・2回目最短3分の紹介</td></tr>
<tr><td>確認</td><td>手数料込みの振込額を文面で</td></tr>
</tbody>
</table>

実際の着金を左右するのは、<span class="hutoaka">申込の時刻と当日の混雑</span>。

当日中の入金を狙う日は、時間に余裕を持って申し込みましょう。

最後に、この記事の調査結果を整理します。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
