<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>即金キンタロウ Step05 H2_3</title>
</head>
<body>
<textarea readonly id="content" style="width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word;">
<h2>悪い口コミ・評判で目立つ3つの指摘</h2>

気になる指摘は、実質の率・2回目の条件・運営情報の3つです。

いずれも申込前の対処で織り込めます。

<h3>実質68%だったという利用報告</h3>

「手数料込みで実質68%だった」という利用報告があります。

掲示の90%と受け取った額の間に、説明との差があったという検証のためです。

掲示どおりなら10万円で89,800円の計算に対し、報告の受取額は大きく下。

決済前に、手数料込みの振込額を文面で受け取りましょう。

<h3>2回目以降の率は情報が食い違う</h3>

2回目以降の率は、媒体によって情報が食い違っています。

現行の掲示は80%ですが、87%や83〜87%と書く紹介記事もあるためです。

条件が変わり中の可能性があり、古い記事の数字は当てになりません。

リピートの率は、申込時点の案内で確かめましょう。

<h3>運営情報が未公表という指摘</h3>

運営法人名や古物商許可が確認できない、という指摘があります。

検証系の媒体が、公的データベースで運営実体を確認できないと記載しているためです。

会社概要のページはありますが、法人名・電話番号の記載は確認できていません。

会社情報の弱さは、少額テストと文面保存で補いましょう。

ここまでの声はレビューサイト経由の紹介が中心です。

では、知恵袋や5chに生の投稿はあるのでしょうか。
</textarea>
<button id="copyBtn" style="margin-top: 10px; padding: 8px 24px; font-size: 14px; cursor: pointer;">コピー</button>
<script>
document.getElementById('copyBtn').addEventListener('click', function() {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
