<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>まとめ</h2>

ラブドール通販は、正規代理店契約と取扱メーカー・価格帯・配送対応で絞り込むのが基本です。

11社の特徴を踏まえると、初心者の入口には<strong>kumadoll・OLdoll・yourdoll</strong>の3社、シリコン高品質なら<strong>Dachi Wife</strong>、10万円以下の予算なら<strong>Knadoll</strong>、即日入手なら<strong>FANZA・Amazon</strong>、軽量モデルなら<strong>WHODOLL</strong>が候補です。

申込前は配送のプライバシー対応・返品の対応範囲・カスタマイズの納期・関税の負担有無の4点を確認しましょう。

候補が3社に絞れたら、各公式サイトで希望スペックの見積もりを並列で取り、納期と総額で最終1社を決定しましょう。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
