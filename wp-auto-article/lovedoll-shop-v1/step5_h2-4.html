<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>購入前に確認すべき4つの注意点</h2>

申込前に必ず確認すべきは、配送・返品・カスタマイズ・関税の4点です。

<h3>配送・梱包のプライバシー対応</h3>

<strong>配送伝票の品名は「人形」「玩具」「フィギュア」のいずれかが基本です。</strong>

「ラブドール」と明記される伝票では、家族や近隣に内容が察知されるリスクがあるためです。

WHODOLLは営業所止め・配達日時指定に対応し、kumadoll・OLdollも無記名梱包の運用を案内しています。

受取の時間帯指定や営業所止めの可否を、申込前に確認しましょう。

家族と同居の場合は、営業所止め+対面受取の組み合わせが安心です。

<h3>返品・初期不良時の対応範囲</h3>

<strong>返品は基本不可で、初期不良のみメーカー保証の対象です。</strong>

カスタマイズ製造のため返品再販ができず、メーカー保証は到着時の輸送破損や工場欠陥に限定されるためです。

OLdoll・kumadollは到着前に検品工程を挟み、Karendollは不良品を工場へ返送する運用。

Happiness Dollは二重検品体制を掲げます。

到着後はすぐ動画・写真で開封記録を残し、不良があれば早期にサポートへ連絡しましょう。

<h3>カスタマイズ可否と納期目安</h3>

<strong>フルカスタマイズは正規専門店で可能、納期は2週間〜2か月が目安です。</strong>

ヘッド・スケルトン・メイク・乳房タイプといったオーダーは工場直結の専門店でのみ受付可能なためです。

楽園ドール・OLdoll・Dachi Wife・kumadollは公式サイトでカスタマイズ画面を提供します。

納期は在庫品なら即日〜1週間、フルカスタムなら3週間〜2か月が目安(要確認:メーカー繁忙期で変動)です。

イベント・記念日に合わせるなら、最低2か月前の発注が安全です。

<h3>関税・送料の負担有無</h3>

<strong>中国直送モデルは関税・送料が見積りに含まれるかを必ず確認しましょう。</strong>

ラブドールの関税は無税ですが、消費税(10%)と通関手数料が後日請求される場合があるためです。

WHODOLL・OLdoll・Happiness Dollといった国内拠点を持つ代理店は税・送料込みの見積りが基本。

中国直送中心の楽園ドール・Karendoll・Knadollは、見積り内訳の事前確認が安心です。

合計金額は「本体+税+送料+通関手数料」で判断しましょう。

申込前の4点確認が済めば、安心してカスタマイズ画面に進めます。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
