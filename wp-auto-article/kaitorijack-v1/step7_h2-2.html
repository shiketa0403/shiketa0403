<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>公式サイトでわかった3つの強み</h2>

ここで挙げる強みは、公式サイトの掲示と掲載情報がもとです。

第三者の裏付けはまだない前提で読み進めてください。

<h3>買取率表を金額帯で明示</h3>

<span class="st-mymarker-s"><strong>買取率の表が、金額帯ごとに明示されています。</strong></span>

1〜5万円の95.1%から30万円以上の99.8%まで、条件が数字で示されているためです。

「最大」だけを大きく掲げる業者より、適用の目安を突き合わせやすい掲示です。

申込前に、自分の金額の帯を表で確かめましょう。

[st-kaiwa1 r]条件が数字で見える掲示です。自分の帯を確かめてくださいね。[/st-kaiwa1]

<h3>スマホ完結で最短即日振込</h3>

<span class="st-mymarker-s"><strong>申込から振込まで、スマホで完結する方式の掲示です。</strong></span>

申込・指定商品の購入・振込の3STEPで進む案内のためです。

掲示は最短即日振込、初回買取率9%UPのキャンペーンも記載。

急ぎの日は、申込前に当日の所要時間を確かめましょう。

<h3>会社情報と窓口の記載あり</h3>

<span class="st-mymarker-s"><strong>公式サイトには、住所・フリーダイヤル・営業時間の記載があります。</strong></span>

連絡先と所在が示されているかは、確認材料の1つになるためです。

「家族にバレずに利用できた」という声も掲載されていますが、これは公式サイト掲載の声です。

記載の窓口が実際につながるかも、申込前に確かめましょう。

[st-mybox title="こんな方に向いています" webicon="st-svg-check-circle" color="#757575" bordercolor="#BDBDBD" bgcolor="#ffffff" borderwidth="2" borderradius="5" titleweight="bold" fontsize="" myclass="st-mybox-class" margin="25px 0 25px 0"]
<div class="maruck">
<ul>
<li>ペイディのApple専用枠を現金に変えたい人</li>
<li>スマホだけで完結させたい人</li>
<li>条件を数字で確かめてから決めたい人</li>
</ul>
</div>
[/st-mybox]

一方で、この業者には掲示だけでは埋まらない懸念もあります。

次で3つ確認しましょう。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
