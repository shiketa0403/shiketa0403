<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>

<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>申込前に気になる3つの懸念</h2>

気になる懸念は、口コミの不在・率の上限帯・掲載の声の3つです。

いずれも申込前の対処で織り込めます。

<h3>第三者の口コミが確認できず</h3>

<strong>買取JACKの第三者の口コミは、<span class="hutoaka">当方の調査では確認できませんでした</span>。</strong>

レビュー記事・知恵袋・5chのいずれにも、名指しの言及が見当たらないためです。

考えられるのは、開設から日が浅く情報が蓄積されていない状態。

確認できないことは危険の証拠ではなく、<span class="st-mymarker-s">検証材料がない状態として扱い</span>ましょう。

[st-kaiwa1]口コミゼロの新顔業者。文面と少額テストで補うのが現実的です。[/st-kaiwa1]

<h3>99.8%は30万円以上の上限帯</h3>

<strong>最大99.8%は、30万円以上の利用に適用される上限の帯です。</strong>

掲示の表は金額帯制で、1〜5万円の帯は95.1%と示されています。

上限の数字だけで期待値を作ると、<span class="hutoaka">受取額との差</span>に驚きやすくなります。

期待値は、<span class="st-mymarker-s">掲示の最大値でなく見積もりで合わせ</span>ましょう。

<h3>掲載の声と口コミは別物</h3>

<strong>公式サイト掲載の「お客さまの声」は、第三者の口コミとは別物です。</strong>

掲載する声は運営側が選べるため、<span class="hutoaka">評価の偏りを避けられない</span>からです。

第三者の場に投稿された声が出てくるまでは、検証の代わりにはなりません。

掲載の声は参考にとどめ、<span class="st-mymarker-s">判断は文面の見積もりで行い</span>ましょう。

では、知恵袋や5chの実調査では何が確認できたのでしょうか。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
