<!DOCTYPE html>
<html lang="ja">
<head>

  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>申込から振込までの手順</h2>

買取JACKの手続きは、公式サイトの申込フォームから始まります。

流れは申込・見積もり・商品購入・振込の順です。

[st-timeline myclass="st-timeline-count" add_style=""]
[st-timeline-list text="申込フォームで申込" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
[/st-timeline-list]
[st-timeline-list text="見積もり・条件を文面で確認" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
[/st-timeline-list]
[st-timeline-list text="ペイディApple専用枠で商品購入" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
[/st-timeline-list]
[st-timeline-list text="お振込み(最短即日の掲示・要事前確認)" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
[/st-timeline-list]
[/st-timeline]

<h3>申込と見積もりの文面確認</h3>

<span class="st-mymarker-s"><strong>最初のステップは、申込と見積もりの確認です。</strong></span>

提示額に納得してから進めば、<span class="hutoaka">受取額のずれ</span>を防げます。

確認したいのは、適用される率とキャンペーン込みの振込額。

見積もりの内容は、文面で受け取ってから決めましょう。

<h3>商品購入と買取の手続き</h3>

<strong>見積もりに納得したら、案内に沿ってペイディのApple専用枠で指定の商品を購入します。</strong>

購入した商品の買取という方式で、購入の確認をもって振込に進むためです。

買取の手続きでは、本人確認書類の提出を求められる場合があります。

不明点は、<span class="st-mymarker-s">購入前に窓口で確かめ</span>ましょう。

[st-kaiwa1]初回は本人確認書類を手元に。準備しておくと止まりません。[/st-kaiwa1]

<h3>振込までの時間目安</h3>

<span class="st-mymarker-s"><strong>最短即日振込の掲示ですが、実際の所要時間を裏付ける報告はありません。</strong></span>

<span class="hutoaka">第三者の検証や体験談が、現時点で確認できない</span>ためです。

<table>
<thead><tr><th>項目</th><th>内容</th></tr></thead>
<tbody>
<tr><td>申込</td><td>WEBフォーム</td></tr>
<tr><td>購入</td><td>ペイディApple専用枠で指定商品</td></tr>
<tr><td>振込</td><td>最短即日の掲示(報告は未確認)</td></tr>
<tr><td>確認</td><td>キャンペーン込みの振込額を文面で</td></tr>
</tbody>
</table>

頼れるのは、営業時間の記載と申込時の案内。

当日中の入金を狙う日は、受付時間と締切を窓口で確かめてから申し込みましょう。

最後に、この記事の調査結果を整理します。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
