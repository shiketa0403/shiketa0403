<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>悪い口コミ・評判で目立つ3つの指摘</h2>

目立つ指摘は、未入金の声・対応のばらつき・2回目以降の条件の3つです。

内容をそのまま紹介します。

<h3>入金されていないという声の存在</h3>

<span class="st-mymarker-s"><strong>「振込完了と言われたが、入金されていない」という声が散見される、という紹介があります。</strong></span>

銀行の反映タイミングや確認の行き違いが起きうるからです。

詐欺と断定する検証は、今回の調査では見当たらない状況。

<span class="hutoaka">着金を自分の口座で確認するまで</span>、取引を終えないようにしましょう。

[st-kaiwa1]着金の確認までが取引です。完了連絡だけで安心しないでください。[/st-kaiwa1]

<h3>スタッフ対応に当たり外れの指摘</h3>

<span class="st-mymarker-s"><strong>「スタッフの対応に当たりはずれがある」という指摘があります。</strong></span>

やり取りがLINE中心で、担当者によって差が出やすいからです。

対応への満足の声と不満の声が、どちらも紹介されています。

違和感があれば、<span class="hutoaka">決済前の段階で立ち止まりましょう</span>。

<h3>2回目以降は83%に下がる条件</h3>

<span class="st-mymarker-s"><strong>初回90%の買取率は、2回目以降83%に下がるという紹介があります。</strong></span>

初回限定の条件と、通常時の条件が分かれているからです。

90%と83%では、10万円の決済で<span class="hutoaka">手取りに7000円の差</span>が出ます。

2回目以降に使う場合ほど、見積もりの振込額を確認しましょう。

では、知恵袋や5chには実際の投稿があるのでしょうか。
</textarea>
