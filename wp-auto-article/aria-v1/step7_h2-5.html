<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>申込前に知るべき3つの注意点</h2>

不安の多くは、取引の進め方と情報の見分け方で小さくできます。

申込前に3つの注意点を確認しましょう。

<h3>入金確認までは取引を終えない基準</h3>

<span class="st-mymarker-s"><strong>着金を確認するまでは、取引が終わっていないと考えましょう。</strong></span>

「振込完了と言われたが入金されていない」という声が紹介されているからです。

確認の順番は、見積もり・決済・着金の3段階。

<span class="hutoaka">着金前の追加決済には応じない</span>ようにしましょう。

[st-kaiwa1 r]見積もり・決済・着金の3段階を順に確認すると安心です。[/st-kaiwa1]

<h3>即日アリアという類似名との混同</h3>

<span class="st-mymarker-s"><strong>「即日アリア」「即日アリスちゃん」という類似名のサービスがあります。</strong></span>

知恵袋の投稿の多くは、類似名サービスに関する相談だからです。

<span class="hutoaka">家族にバレたという相談</span>も、類似名サービスの投稿です。

口コミを読むときは、どのサービスの話かを確かめましょう。

<h3>カード会員規約上の禁止行為</h3>

<span class="st-mymarker-s"><strong>クレジットカードや後払いアプリの現金化は、運営側が禁止している行為です。</strong></span>

カード会社の規約で「換金目的の利用」が明示的に禁止されているからです。

知恵袋の回答でも、<span class="hutoaka">カード情報の提供は禁止</span>という注意が寄せられています。

業者選び以前に、この前提を理解した上で判断しましょう。

[st-mybox title="注意ポイント" webicon="st-svg-exclamation-circle" color="#ef5350" bordercolor="#ef9a9a" bgcolor="#ffebee" borderwidth="2" borderradius="5" titleweight="bold" fontsize="" myclass="st-mybox-class" margin="25px 0 25px 0"]
<div class="maruck">
<ul>
<li>着金を確認するまで取引を終えない(追加決済に応じない)</li>
<li>即日アリア・即日アリスちゃんという類似名と混同しない</li>
<li>現金化は後払いアプリ・カード規約上の禁止行為</li>
</ul>
</div>
[/st-mybox]

注意点を押さえたところで、実際の申込手順を確認します。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
