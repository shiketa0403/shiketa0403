<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>スマホ申込から振込までの手順</h2>

申込はスマホで完結し、来店は不要です。

LINE申込から振込までの流れを順に見ていきましょう。

[st-timeline myclass="st-timeline-count" add_style=""]
[st-timeline-list text="LINEで申し込み" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
LINE登録後に相談し、買取額(振込額)の提示を受ける(見積もり無料・相談のみOK)
[/st-timeline-list]
[st-timeline-list text="指定の商品を購入" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
ペイディApple専用枠を含む後払いで、指定された商品を購入する
[/st-timeline-list]
[st-timeline-list text="買取代金のお振込み" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
掲示は最短10分(実際は幅あり・受付は7時〜22時の表示)
[/st-timeline-list]
[/st-timeline]

<h3>LINE申込から見積もりの流れ</h3>

<span class="st-mymarker-s"><strong>申込はLINEの登録から始まります。</strong></span>

登録後に相談し、買取額の提示を受けてから進む流れだからです。

見積もりは無料で、相談のみでも可という掲示。

提示された振込額に納得できなければ、<span class="hutoaka">この段階で断りましょう</span>。

<h3>指定商品の購入という買取式</h3>

<span class="st-mymarker-s"><strong>見積もりに納得したら、指定された商品を購入します。</strong></span>

現金化は商品買取の形式を取るからです。

対応は<strong>ペイディApple専用枠</strong>のほか、atone・B/43・ファミペイを含む後払いです。

購入前に、金額と商品の内容を確認しましょう。

[st-kaiwa1]購入する商品と金額は、決済前に画面で確認しておきましょう。[/st-kaiwa1]

<h3>振込完了までの時間目安</h3>

<span class="st-mymarker-s"><strong>振込は最短10分という紹介ですが、実際は幅があります。</strong></span>

商品の確認や混雑で、<span class="hutoaka">所要時間が前後する</span>からです。

受付時間は7時〜22時の表示。

<table>
<thead><tr><th>項目</th><th>内容</th></tr></thead>
<tbody>
<tr><td>受付時間</td><td>7:00〜22:00の表示</td></tr>
<tr><td>掲示の振込速度</td><td>最短10分</td></tr>
<tr><td>実際の所要時間</td><td>商品の確認や混雑で幅あり</td></tr>
<tr><td>見積もり</td><td>無料・相談のみOKの掲示</td></tr>
</tbody>
</table>

当日中に受け取りたい場合は、早めの時間帯の申込がおすすめです。

手順を把握したら、最後に記事全体の要点を整理します。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
