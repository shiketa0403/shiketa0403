<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>知恵袋・5chの投稿を実際に調査</h2>

Yahoo!知恵袋と5chを実際に検索して調査しました。

知恵袋では2件の実投稿を確認できました。

<h3>知恵袋で確認できた実投稿2件</h3>

<span class="st-mymarker-s"><strong>今回の調査では、Yahoo!知恵袋でタスカルに関する実投稿を2件確認できました。</strong></span>

「商品買取現金化のタスカルという業者は危ないですか」という質問と、クレジットカード現金化について尋ねる質問です。

中身はいずれも、利用前に安全性を尋ねる事前の相談。

被害を訴える投稿ではない点を、区別して読みましょう。

<h3>5chは要旨のみで直接確認できず</h3>

<span class="st-mymarker-s"><strong>5chの言及は、レビュー経由の要旨のみで生のレスは直接確認できませんでした。</strong></span>

現金化関連のスレッドは多く、<span class="hutoaka">個別のレスの特定が難しい</span>ためです。

仮想通貨相談の「Task-all」のような<span class="hutoaka">同名の別サービスも検索に混ざります</span>。

実投稿が限られる以上、確認できた事実と掲示を軸に判断しましょう。

[st-cmemo webicon="st-svg-exclamation-circle" iconcolor="#919191" bgcolor="#fafafa" color="#000000" bordercolor="" borderwidth="" iconsize=""]「タスカル」の検索結果には、仮想通貨相談の「Task-all」のような同名の別サービスが混ざります。口コミを探すときは、現金化業者タスカルの話かを確かめて読みましょう。[/st-cmemo]

生の体験談が少ないからこそ、申込前に押さえるべきは条件面の注意点です。
</textarea>

document.getElementById('copyBtn').addEventListener('click', () => {
