<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>悪い口コミ・評判で目立つ3つの指摘</h2>

気になる指摘は、率の低下・入金の遅れ・保証線どおりの率の3点です。

いずれも申込前の確認で対処できます。

<h3>使ううちに率が下がったという声</h3>

<strong>「使ううちに換金率が下がった」という声が紹介されています。</strong>

初回向けの上乗せが外れると、<span class="hutoaka">リピート時は条件が変わる場合</span>があるためです。

リピート利用で確かめたいのは、その回に適用される率。

2回目以降も、<span class="st-mymarker-s">見積もりで率を聞いてから進めましょう</span>。

[st-kaiwa1]最低80%は下限の保証。率は決済前のやり取りで確認ですね。[/st-kaiwa1]

<h3>入金まで3時間待ったという報告</h3>

<strong>「平均5分のはずが、入金まで3時間待った」という報告も紹介されています。</strong>

混雑や時間帯によって、<span class="hutoaka">処理が掲示どおりに進まない場合</span>があるためです。

平均の掲示は、すべての申込に当てはまる約束ではありません。

着金を急ぐ日は、<span class="st-mymarker-s">時間に余裕を持って申し込みましょう</span>。

<h3>クレカの率は80%だったという声</h3>

<strong>クレジットカードの利用で「率は掲示より低い80%だった」という声も紹介されています。</strong>

最低80%の保証は、保証線に張り付く場合があることも意味するためです。

下限保証は「80%より下がらない」であり、<span class="hutoaka">「80%より高い」の約束ではありません</span>。

自分の条件での率を、<span class="st-mymarker-s">決済前のやり取りで確かめましょう</span>。

ここまでの声は、いずれもレビューサイト経由の紹介です。

では、知恵袋や5chに生の投稿はあるのでしょうか。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
