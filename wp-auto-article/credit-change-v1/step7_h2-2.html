<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>

<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>良い口コミ・評判に多い3つの声</h2>

確認できた肯定的な口コミを紹介します。

評価は振込時間・対応の姿勢・相談のしやすさの3点に集中していました。

<h3>30〜40分で振り込まれた報告</h3>

<span class="st-mymarker-s"><strong>「実際は30〜40分ほどで振り込まれた」という報告があります。</strong></span>

最短15分の掲示どおりではないものの、当日中に受け取れる速さだからです。

営業は年中無休の<strong>9時〜20時</strong>で、時間内なら当日対応が基本です。

急ぎの場合は、午前中の申込で余裕を持たせましょう。

<h3>押し売りなしで柔軟な対応の声</h3>

<span class="st-mymarker-s"><strong>「押し売りがなく、キャンセルも簡単だった」という声が確認できました。</strong></span>

現金化の利用者は、強引な営業への警戒心が強いからです。

あわせて目立つのは、スタッフの柔軟な対応への評価。

迷いがある段階でも、見積もりだけで判断できます。

[st-kaiwa1 r]相談しながら慎重に進めたい方には、候補になるサービスです。[/st-kaiwa1]

<h3>LINEで気軽に相談できる評価</h3>

<span class="st-mymarker-s"><strong>LINEから気軽に問い合わせできる点を評価する紹介があります。</strong></span>

電話に抵抗がある人でも、文字で条件を確認してから進められるからです。

メールの受付は24時間で、<strong>フリーダイヤル(0120-766-566)</strong>も用意されています。

連絡手段を選べる点は、初めての人に使いやすいところです。

[st-mybox title="こんな方に向いています" webicon="st-svg-check-circle" color="#757575" bordercolor="#BDBDBD" bgcolor="#ffffff" borderwidth="2" borderradius="5" titleweight="bold" fontsize="" myclass="st-mybox-class" margin="25px 0 25px 0"]
<div class="maruck">
<ul>
<li>押し売りなしで慎重に検討したい方</li>
<li>LINEやメールで相談しながら進めたい方</li>
<li>営業時間内に当日中の受け取りを狙いたい方</li>
</ul>
</div>
[/st-mybox]

一方で、悪い口コミには申込前に知っておきたい内容が含まれています。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
