<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>悪い口コミ・評判に多い3つの不満</h2>

確認できた不満は、振込額・手数料・手続きの手間の3つです。

報告の内容をそのまま紹介します。

<h3>振込額が表示と全然違ったという声</h3>

「公式サイトの換金率と、実際に振り込まれた金額が全然違った」という声があります。

表示の率から、記載のない費用が差し引かれる場合があるからです。

「やってみた結果やばい業者だった」との趣旨の批判的な体験記事も。

決済前に振込額の提示を受け、金額で判断しましょう。

<h3>手数料の記載がないという指摘</h3>

公式サイトに手数料の記載が見当たらない、という指摘があります。

表示の換金率だけでは、差し引かれる金額を事前に計算できないからです。

「下がらない換金率の保証」をうたう表示と実際の差が、不信感につながったとの紹介もあります。

見積もりの段階で、手数料込みの振込額を数字で確かめましょう。

<h3>自撮り写真の提出が面倒という声</h3>

電話でのヒアリングや自撮り写真の提出が面倒だった、という指摘があります。

本人確認とカードの不正利用防止のため、確認の工程が多いからです。

高額の利用では、振込まで2日ほどかかったケースも紹介されています。

初回の申込は、時間に余裕を見ておきましょう。

では、知恵袋や5chには実際の投稿があるのでしょうか。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
