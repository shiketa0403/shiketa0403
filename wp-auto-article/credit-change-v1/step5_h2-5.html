<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>申込前に知るべき3つの注意点</h2>

「思ったより少ない」と感じる原因の多くは、表示の読み方にあります。

申込前に3つの注意点を確認しましょう。

<h3>98%は上限のキャンペーン表示</h3>

表の98%は、90万円以上の利用に適用される上限のキャンペーン表示です。

換金率は利用額に応じた段階表示で、1万〜7万円では約90%と差があるからです。

「下がらない換金率の保証」も、この表示条件の範囲での話。

適用される率は、申込時の見積もりで確認しましょう。

<h3>7件で2.5という集計の読み方</h3>

総合評価2.5という数字は、7件という少ない投稿数の集計です。

件数が少ないと、1件の低評価で数字が大きく動くからです。

類似名の別業者の評判が検索結果に混ざる点にも注意が要ります。

点数だけでなく、批判的な記事と公表条件をあわせて判断しましょう。

<h3>カード会員規約上の禁止行為</h3>

クレジットカードの現金化は、業者を問わずカード会社が禁止している行為です。

カード会社の規約で「換金目的の利用」が明示的に禁止されているからです。

発覚した場合、カードの利用停止や強制退会につながるリスクがあります。

業者選び以前に、この前提を理解した上で判断しましょう。

注意点を押さえたところで、実際の申込手順を確認します。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
