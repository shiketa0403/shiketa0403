<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>スマホ申込から振込までの手順</h2>

申込はスマホで完結し、来店は不要です。

受付時間と振込対応時間の違いに注意しながら、流れを見ていきましょう。

[st-timeline myclass="st-timeline-count" add_style=""]
[st-timeline-list text="メール・電話で申込" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
メールは24時間受付・電話(0120-766-566)は年中無休9時〜20時・振込額の提示あり
[/st-timeline-list]
[st-timeline-list text="本人確認・ネットでカード決済" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
初回は本人確認書類をスマホで撮影して提出し、指定商品をカード決済する
[/st-timeline-list]
[st-timeline-list text="現金のお振込み" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
最短15分の掲示(報告は30〜40分・高額利用は2日の例あり)
[/st-timeline-list]
[/st-timeline]

<h3>メール・電話申込の流れ</h3>

<span class="st-mymarker-s"><strong>申込はメールフォームか電話(0120-766-566)から始まります。</strong></span>

受付後に振込額の提示があり、納得してからカード決済に進む流れだからです。

メールの受付は24時間、対応は年中無休の<strong>9時〜20時</strong>。

提示された振込額に納得できなければ、<span class="hutoaka">この段階で断りましょう</span>。

<h3>本人確認とカード決済</h3>

<span class="st-mymarker-s"><strong>初回は本人確認書類の提出とカード決済が必要です。</strong></span>

現金化は商品売買の形式を取り、本人確認が法令上必須だからです。

運転免許証やマイナンバーカードに加え、自撮り写真を求められたという指摘もあります。

決済前に、金額と商品の内容を確認しましょう。

[st-kaiwa1]初回は本人確認がある分、時間に余裕を見ておくと安心です。[/st-kaiwa1]

<h3>振込完了までの時間目安</h3>

<span class="st-mymarker-s"><strong>振込は最短15分の掲示ですが、実際は幅があります。</strong></span>

<span class="hutoaka">振込の対応が9時〜20時に限られ</span>、確認の状況で前後するからです。

確認できた報告は、30〜40分から高額利用の2日まで。

<table>
<thead><tr><th>項目</th><th>時間</th></tr></thead>
<tbody>
<tr><td>メール受付</td><td>24時間</td></tr>
<tr><td>電話受付・対応</td><td>年中無休9時〜20時</td></tr>
<tr><td>掲示の振込速度</td><td>最短15分</td></tr>
<tr><td>確認できた報告</td><td>30〜40分(高額は2日の例)</td></tr>
</tbody>
</table>

当日中に受け取りたい場合は、営業時間内の早めの申込がおすすめです。

手順を把握したら、最後に記事全体の要点を整理します。
</textarea>

document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
