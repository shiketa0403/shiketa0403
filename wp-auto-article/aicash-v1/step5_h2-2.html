<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>良い口コミ・評判に多い3つの声</h2>

確認できた肯定的な口コミを紹介します。

旧A-pay時代の声を含め、評価は入金の速さ・対応・手数料の3点です。

<h3>最短1時間で受け取れた報告</h3>

「最短1時間で現金を受け取れた」という報告があります。

Web完結で、手続き自体は最短3分という紹介もあるからです。

営業時間は9時〜21時で、時間内なら当日対応を受けられます。

急ぎの場面でも選択肢になるスピード感です。

<h3>スタッフが親切だったという声</h3>

「スタッフが親切だった」という声が確認できました。

現金化の利用が初めての人は不安を抱えやすく、対応の印象が評価に直結するからです。

初心者でもスムーズに手続きできたという趣旨の報告も。

不明点は電話(06-6575-6931)で確認しながら進められます。

<h3>手数料がかからなかった声</h3>

「手数料がかからなかった」という利用者の評価があります。

見積もりで提示された金額から、後から差し引かれなかったという趣旨だからです。

Paidyやメルペイを含む後払いアプリにも対応しています。

手数料の扱いは、申込のたびに見積もりで確認しましょう。

一方で、悪い口コミや指摘には申込前に知っておきたい内容が含まれています。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
