<textarea readonly id="content"><h2>悪い口コミ・評判で目立つ3つの指摘</h2>

目立つ指摘は、批判的な体験記事・実績の不透明さ・掲示への疑義の3つです。

内容をそのまま紹介します。

<h3>やばい業者だったという体験記事</h3>

<span class="st-mymarker-s"><strong>「やってみた結果やばい業者だった」という趣旨の批判的な体験記事があります。</strong></span>

<span class="hutoaka">表示の率と実際の受取額の差</span>を指摘する検証が公開されているからです。

実勢80%台前半という紹介とも方向が一致する内容。

決済前に振込額の提示を受け、金額で判断しましょう。

<h3>口コミが少なく実績が不明な指摘</h3>

<span class="st-mymarker-s"><strong>口コミや利用者の声が少なく、実績が不明という指摘があります。</strong></span>

現ページの開設は<strong>2025年6月頃</strong>という検証があり、<span class="hutoaka">運営期間が浅い</span>からです。

実勢の換金率や入金時間のデータがそろっておらず、判断材料が少ない状態です。

情報が少ないサービスは、少額から試して確かめましょう。

[st-kaiwa1]情報が少ないうちは、まず少額で試すのが手堅い方法です。[/st-kaiwa1]

<h3>利用者数の掲示への疑義</h3>

<span class="st-mymarker-s"><strong>利用者1万5000人という掲示は虚偽の可能性が高い、という指摘があります。</strong></span>

サイトの開設時期と、掲げる実績の規模が合わないという検証があるからです。

<span class="hutoaka">「創業13年」の掲示にも同じ疑義</span>が向けられています。

掲示の数字は鵜呑みにせず、確認できた事実で判断しましょう。

では、知恵袋や5chには実際の投稿があるのでしょうか。
