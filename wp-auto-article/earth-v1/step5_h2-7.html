<textarea readonly id="content" style="width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word;">
<h2>まとめ</h2>

アースサポートの現金化の口コミ・評判を調査した結果、振り込まれない被害の報告は確認できませんでした。

一方で掲示の最大98.8%と、平均72%前後という集計の間には開きがありました。

この記事の要点は以下の5点です。

<ul>
<li>「振り込まれない」という被害の報告は確認できず</li>
<li>掲示は最大98.8%・口コミ集計は平均72%前後という開き</li>
<li>手数料の後出しという指摘あり(文面での事前確認が対処)</li>
<li>知恵袋の検索結果は同名の介護会社が大半(実投稿は確認できず)</li>
<li>判断基準は率でなく見積もりで確認した手数料込みの振込額</li>
</ul>

現金化はカード会員規約上の禁止行為というリスクを踏まえた上で、使うかどうかを決めましょう。

[CTA: 公式サイト(素リンク) https://earthgekinka.com/ ]
申込前に、見積もりで手数料込みの振込額を確認しましょう。

掲示と集計のずれは、見積もりの段階で防げます。
</textarea>
<button id="copyBtn" style="margin-top: 10px; padding: 8px 24px; font-size: 14px; cursor: pointer;">コピー</button>
<script>
document.getElementById('copyBtn').addEventListener('click', function() {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
