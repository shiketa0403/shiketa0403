<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>アースサポート Step05 H2_6</title>
</head>
<body>
<textarea readonly id="content" style="width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word;">
<h2>申込から振込までの手順</h2>

アースサポートの手続きは、WEBの申込から始まります。

流れは申込・見積もり・決済・振込の順です。

<h3>申込と見積もりの文面確認</h3>

<strong>最初のステップは、申込と見積もりの確認です。</strong>

提示額に納得してから進めば、受取額のずれを防げます。

確認したいのは、手数料込みの振込額と必要書類。

見積もりの内容は、文面で受け取ってから決めましょう。

<h3>カード決済の手続き</h3>

<strong>見積もりに納得したら、案内に沿ってカードのショッピング枠で決済します。</strong>

決済の確認をもって、振込の手続きに進む方式のためです。

初回は身分証に加えて、収入証明系の書類を求められる場合があります。

書類は事前に手元へ用意して、手続きの中断を防ぎましょう。

<h3>振込までの時間目安</h3>

<strong>受付は24時間365日で、モアタイム参加口座なら夜間の即時振込も可能という解説です。</strong>

振込の反映が、口座側の対応で変わるためです。

着金を左右するのは、口座の条件と手続きの時間帯。

着金を急ぐ日は、対応口座を振込先に選びましょう。

最後に、この記事の調査結果を整理します。
</textarea>
<button id="copyBtn" style="margin-top: 10px; padding: 8px 24px; font-size: 14px; cursor: pointer;">コピー</button>
<script>
document.getElementById('copyBtn').addEventListener('click', function() {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
