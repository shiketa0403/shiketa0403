<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>アースサポート Step05 H2_3</title>
</head>
<body>
<textarea readonly id="content" style="width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word;">
<h2>悪い口コミ・評判で目立つ3つの指摘</h2>

気になる点は、実質の率・手数料の出方・提出書類の3つです。

いずれも申込前の確認で対処できます。

<h3>実質は平均72%前後という集計</h3>

<strong>口コミを集計すると、実質は平均72%前後という紹介があります。</strong>

最大98.8%の掲示がそのまま適用されるとは限らないためです。

相場の70〜80%と比べて、高くも低くもない水準という評価。

自分の場合の率は、見積もりの金額で確かめましょう。

<h3>手数料の後出しという指摘</h3>

<strong>「手数料が事前に開示されない」「後から名目を変えた請求があった」という指摘があります。</strong>

手数料の出方が読めないと、受取額を事前に確定できません。

これらは口コミ・レビュー経由の報告で、実際の条件は案件次第です。

手数料の内訳と振込額は、文面で受け取ってから決めましょう。

<h3>収入証明も求められるという声</h3>

<strong>本人確認では、身分証に加えて収入証明系の書類を求められたという声があります。</strong>

提出書類が多いと、初回の手続きに時間がかかるためです。

他社より面倒だったという比較の声も紹介されています。

必要書類は、申込時に一覧で確かめて準備しましょう。

ここまでの整理を踏まえて、では知恵袋や5chに生の投稿はあるのでしょうか。
</textarea>
<button id="copyBtn" style="margin-top: 10px; padding: 8px 24px; font-size: 14px; cursor: pointer;">コピー</button>
<script>
document.getElementById('copyBtn').addEventListener('click', function() {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
