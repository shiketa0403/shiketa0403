<button id="copyBtn">コピー</button>
<textarea readonly id="content">「アースサポートの現金化って実際どうなの?」と気になって、口コミや評判を調べていませんか。

この記事では、Yahoo!知恵袋・5ch・レビューサイトを実際に検索して、確認できた情報を整理しました。

<span class="st-mymarker-s">結論として、振り込まれない被害の報告は確認できず、最大98.8%の掲示と平均72%前後という口コミ集計には開きがありました。</span>

良い口コミでは24時間365日の受付や対応の早さが評価される一方、手数料の後出しという指摘もあります。

知恵袋の検索結果は、同名の訪問入浴・介護会社への相談が大半でした。

読み終える頃には、掲示と集計の差の読み方と、申込前に確認すべきポイントがわかります。

[st-minihukidashi webicon="" fontsize="" fontweight="" bgcolor="#FFB74D" color="#fff" margin="0 0 20px 0" radius="" position="" myclass="" add_boxstyle=""]この記事のまとめ

 	<li>「振り込まれない」という被害の報告は確認できず</li>
 	<li>掲示は最大98.8%・口コミ集計は平均72%前後という開き</li>
 	<li>手数料の後出しという指摘あり(文面での事前確認が対処)</li>
 	<li>知恵袋の検索結果は同名の介護会社が大半(実投稿は確認できず)</li>
 	<li>判断基準は率でなく見積もりで確認した手数料込みの振込額</li>
</ul>
</div>

</textarea>
