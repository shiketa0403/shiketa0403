<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>申込前に知るべき3つの注意点</h2>

申込を決める前に、手数料・キャンペーン・規約の3点を押さえておきましょう。

特に3つ目は、全ての現金化サービスに共通する重要な注意点です。

<h3>手数料は見積もりでしか確定せず</h3>

<span class="st-mymarker-s"><strong>手数料の総額は、申込時の見積もりでしか確定できません。</strong></span>

公式サイトに具体額の記載がなく、<span class="hutoaka">カードの種類や振込口座で変わる</span>ためです。

目安になるのは、消費税相当・カード種別・振込手数料という3つの内訳。

見積もりの段階で振込額を聞き、納得してから進めましょう。

<h3>最大25,000円は5回の累計</h3>

<span class="st-mymarker-s"><strong>最大25,000円の現金プレゼントは、1回でもらえる金額ではありません。</strong></span>

5回目の利用まで毎回最大5,000円という、累計の上限額のためです。

<span class="hutoaka">1回あたりの上限は最大5,000円</span>で、受け取りには複数回の利用が前提です。

キャンペーン額でなく、毎回の振込額で判断しましょう。

[st-kaiwa1 r]25,000円は5回の累計。1回あたり最大5,000円と覚えておきましょう。[/st-kaiwa1]

<h3>カード会員規約上の禁止行為</h3>

<span class="st-mymarker-s"><strong>クレジットカード枠の現金化は、カード会員規約上の禁止行為に該当します。</strong></span>

カード会社の規約で「換金目的の利用」が明示的に禁止されているからです。

発覚した場合、カードの<span class="hutoaka">利用停止や強制解約</span>につながるおそれがあります。

日本クレジット協会も、ショッピング枠の現金化を利用しないよう注意を呼びかけています。

業者選び以前のリスクとして、理解した上で判断しましょう。

[st-mybox title="注意ポイント" webicon="st-svg-exclamation-circle" color="#ef5350" bordercolor="#ef9a9a" bgcolor="#ffebee" borderwidth="2" borderradius="5" titleweight="bold" fontsize="" myclass="st-mybox-class" margin="25px 0 25px 0"]
<div class="maruck">
<ul>
<li>手数料は見積もりでしか確定しない</li>
<li>最大25,000円は5回の累計(毎回最大5,000円)</li>
<li>現金化はカード会員規約上の禁止行為</li>
</ul>
</div>
[/st-mybox]

注意点を踏まえて使うと決めたら、残る疑問は具体的な手順です。

申込から受け取りまでの流れを見ていきましょう。
</textarea>
