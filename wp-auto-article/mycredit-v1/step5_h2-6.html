<!DOCTYPE html>

<title>マイクレジット Step05 H2_6</title>

<body>
<textarea readonly id="content" style="width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word;">
<h2>申込から現金受け取りまでの手順</h2>

マイクレジットの手続きは、公式サイトが掲示する4つのSTEPで完結します。

申込はWEBのフォームか電話で進められます。

<h3>申込フォームと本人確認書類</h3>

<strong>最初のステップは、申込フォームの送信と本人確認です。</strong>

公式サイトの流れでは、STEP01がお申し込み、STEP02がご本人様確認のためです。

窓口は、WEBのお問い合わせフォームとフリーダイヤルの2つ。

案内は営業時間の9:00〜19:00に対応するため、時間内に申し込むとやり取りが早く進みます。

<h3>カード決済と見積もりの確認</h3>

<strong>次のステップは、案内に沿ったカード決済と見積もりの確認です。</strong>

決済の前に条件を確かめておかないと、手取りの金額を確定できないためです。

手数料は見積もりでしか確定しないため、この段階で振込額を聞いておきましょう。

振込額に納得してから、決済の手続きに進みましょう。

<h3>振込完了までの時間目安</h3>

<strong>振込までの時間は、初回で最短10分が掲示の目安です。</strong>

2回目以降は最短3分と、利用回数で目安が変わるためです。

ただし営業時間9:00〜19:00の外に申し込むと、対応は翌日に回ります。

急ぎの日に選びたいのは、平日の営業時間内・早めの時間帯。

着金を急ぐ日は、時間に余裕を持って申し込みましょう。

最後に、この記事の調査結果を整理します。
</textarea>
