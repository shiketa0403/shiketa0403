換金率99%という掲示を見て、「高すぎて逆に怪しい」と感じている方も多いはずです。

この記事では、知恵袋・5chの実調査結果と、レビューで確認できた良い声・悪い指摘を整理しました。

<span class="st-mymarker-s">結論として、詐欺と断定できる被害報告の集まりは確認できず、99%は掲示上の上限という整理が必要です。</span>

手数料の内訳や最大25,000円キャンペーンの条件、振込が翌日に回る場合まで一つずつまとめています。

読み終えるころには、見積もりで振込額を確かめてから申し込むかどうかを、自分で判断できる状態です。
