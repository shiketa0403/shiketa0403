<!DOCTYPE html>

<body>
<textarea readonly id="content" style="width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word;">
<h2>悪い口コミ・評判で目立つ3つの指摘</h2>

悪い指摘として確認できたのは、記載のない手数料・手取りの目減り・対応時間の3点です。

いずれも申込前の確認で対処できます。

<h3>手数料の記載がないという指摘</h3>

<strong>「具体的な手数料の記載がない」という指摘が、不満の中心です。</strong>

公式サイトの掲示は「可能な限り低い手数料を設定する」という表現にとどまるためです。

不満が集まりやすいのは、条件を確かめにくい初回の利用者。

金額を確定させるには、申込時の見積もりで確認するしかありません。

<h3>手取りが掲示より減るという整理</h3>

<strong>実際の手取りは、掲示の率からさらに減るという整理がレビューにあります。</strong>

消費税10%相当のほか、カードの種類で2〜3%、振込口座により数百円が引かれる場合があるためです。

91〜99%の掲示をそのまま手取りと考えると、受取額に差が出ます。

手数料込みの振込額で比べれば、実質的な条件が明確です。

<h3>対応が翌日になるという不満</h3>

<strong>「対応が翌日になった」という不満も紹介されています。</strong>

営業時間が9:00〜19:00で、24時間対応ではないためです。

時間外の申込は翌日の扱いに回ります。

急いでいる場合は、営業時間内の早い時間帯に申し込みましょう。

ここまでの声は、いずれもレビューサイト経由の紹介です。

では、知恵袋や5chに生の投稿はあるのでしょうか。
</textarea>
<button id="copyBtn" style="margin-top: 10px; padding: 8px 24px; font-size: 14px; cursor: pointer;">コピー</button>
<script>
document.getElementById('copyBtn').addEventListener('click', function() {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
