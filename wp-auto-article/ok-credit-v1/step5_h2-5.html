<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>向いている人と向かない人</h2>

換金率・振込スピード・規約リスクの3点で適合性が分かれます。

具体的な人物像で整理しましょう。

<h3>利用が向く人の条件</h3>

電話で確認しながら進めたい慎重派の初回利用者に向きます。

フリーダイヤルの問い合わせ窓口と2012年からの運営実績があるからです。

具体的には「給料日前の家賃・税金の支払い」「冠婚葬祭の急な出費」を想定する利用者。

2回目以降の3%アップを活かせるリピート前提の人にも適合します。

<h3>利用を控えるべき人の特徴</h3>

公表の最大99.7%を前提に資金計画を立てる人には向きません。

実勢では87〜91%の報告があり、期待額との差が出る可能性があるからです。

具体的には「1円単位でぎりぎりの資金繰りをしている人」「カードローン審査に通る属性の人」が該当します。

該当する場合は消費者金融・カードローンの方が安全な選択肢です。

利用に向くと判断した方は、申込手順を次節で確認しましょう。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
