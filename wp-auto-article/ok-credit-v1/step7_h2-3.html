<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>注意したい3つのデメリット</h2>

メリットだけで判断すると、実勢換金率や営業時間でつまずきます。

3つの注意点を事前に押さえましょう。

<h3>実勢換金率87〜91%の報告</h3>

<strong>実際の振込額は公表値より低かったという報告があります。</strong>

公表の93%〜99.7%は上限側の数字で、実際は条件により変動するからです。

利用報告では「初回20万円で87%」「2回目30万円で91%」という体験談。

公表値をそのまま期待せず、<span class="hutoaka">実勢は80%台後半〜90%前後もあり得る</span>前提で判断しましょう。

<h3>営業9時〜21時の時間制限</h3>

<strong>振込処理の営業時間は9時〜21時です。</strong>

申込フォームは24時間受け付けても、処理は営業時間内に行われるからです。

21時以降の申込は翌朝9時以降の処理に回ります。

深夜の急ぎ調達には対応できない点を把握しておきましょう。

<h3>カード会員規約違反のリスク</h3>

<strong>クレジットカード現金化は<span class="hutoaka">カード会員規約上の禁止行為</span>です。</strong>

カード会社の規約で「換金目的の利用」が明示的に禁止されているからです。

発覚時のリスクは利用停止・残額の一括請求・強制解約の3点。

利用は自己責任での判断が前提です。

[st-mybox title="注意ポイント" webicon="st-svg-exclamation-circle" color="#ef5350" bordercolor="#ef9a9a" bgcolor="#ffebee" borderwidth="2" borderradius="5" titleweight="bold" fontsize="" myclass="st-mybox-class" margin="25px 0 25px 0"]
<div class="maruck">
<ul>
<li>実勢換金率は87〜91%の報告あり(公表値との差に注意)</li>
<li>振込処理は営業時間9時〜21時のみ</li>
<li>現金化はカード会員規約上の禁止行為</li>
</ul>
</div>
[/st-mybox]

デメリットを把握したら、口コミの実調査結果を確認しましょう。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
