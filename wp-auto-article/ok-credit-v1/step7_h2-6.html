<textarea readonly id="content"><h2>スマホ申込から振込までの手順</h2>

申込はスマホで完結し、来店は不要です。

3つの工程で振込完了まで進みます。

[st-timeline myclass="st-timeline-count" add_style=""]
[st-timeline-list text="申込フォーム送信" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
公式サイトのフォームから30秒で申込情報を送信(受付は24時間365日)
[/st-timeline-list]
[st-timeline-list text="本人確認・カード決済" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]

[/st-timeline-list]
[st-timeline-list text="振込完了" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]

<h3>30秒申込フォームの流れ</h3>

<strong>公式サイトのフォームから30秒で申込情報を送信します。</strong>

氏名・連絡先・希望金額・利用カード情報に入力項目を絞った設計だからです。

受付自体は24時間365日で、営業時間内に担当者から確認の連絡が入ります。

入力ミスがあると確認に時間がかかるため、申込前に必要情報を手元に揃えましょう。

<h3>本人確認と決済の進め方</h3>

<strong>初回は本人確認書類の提出とカード決済が必要です。</strong>

現金化は商品売買の形式を取り、本人確認が法令上必須だからです。

運転免許証・マイナンバーカード・健康保険証のいずれかをスマホで撮影し提出します。

初回に時間がかかる主因はこの本人確認工程で、2回目以降は省略されて速くなります。

<h3>振込完了までの時間目安</h3>

<strong>決済完了から2回目以降は最短3分、初回は20分〜1時間が目安です。</strong>

初回のみ本人確認を挟むため、処理時間に差が出るからです。

営業時間は<strong>9時〜21時</strong>で、土日祝の振込にも対応。

急ぎの場合は営業時間の早い時間帯に申込みましょう。

申込手順を把握したら、最後に記事全体の要点をまとめます。
</textarea>
