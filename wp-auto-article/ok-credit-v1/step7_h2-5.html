換金率・振込スピード・規約リスクの3点で適合性が分かれます。

<h3>利用が向く人の条件</h3>

<strong>電話で確認しながら進めたい慎重派の初回利用者に向きます。</strong>

フリーダイヤルの問い合わせ窓口と2012年からの運営実績があるからです。

具体的には「給料日前の家賃・税金の支払い」「冠婚葬祭の急な出費」を想定する利用者。

2回目以降の3%アップを活かせるリピート前提の人にも適合します。

[st-mybox title="こんな方に向いています" webicon="st-svg-check-circle" color="#757575" bordercolor="#BDBDBD" bgcolor="#ffffff" borderwidth="2" borderradius="5" titleweight="bold" fontsize="" myclass="st-mybox-class" margin="25px 0 25px 0"]
<div class="maruck">
<ul>
<li>電話で確認しながら進めたい慎重派の人</li>
<li>給料日前の支払いなど短期の資金需要がある人</li>
<li>リピート利用で2回目以降の3%アップを活かしたい人</li>
</ul>
</div>
[/st-mybox]

<h3>利用を控えるべき人の特徴</h3>

<strong>公表の最大99.7%を前提に資金計画を立てる人には向きません。</strong>

実勢では87〜91%の報告があり、期待額との差が出る可能性があるからです。

具体的には「1円単位でぎりぎりの資金繰りをしている人」「カードローン審査に通る属性の人」が該当します。

[st-cmemo webicon="st-svg-exclamation-circle" iconcolor="#919191" bgcolor="#fafafa" color="#000000" bordercolor="" borderwidth="" iconsize=""]該当する場合は消費者金融・カードローンの方が安全な選択肢です。[/st-cmemo]

利用に向くと判断した方は、申込手順を次節で確認しましょう。
