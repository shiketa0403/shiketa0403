<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>注意したい3つのデメリット</h2>

メリットだけで判断すると、手数料や情報量でつまずきます。

3つの注意点を事前に押さえましょう。

<h3>手数料差引で実質減の指摘</h3>

<strong>手数料の差引で、<span class="hutoaka">受取額が実質70%台まで下がる可能性</span>の指摘があります。</strong>

公表の換金率とは別に、振込手数料や決済手数料がかかる場合があるからです。

検証記事には「最終的な手取りは70%台、条件次第では60%台」という試算。

申込前に「振込額はいくらか」を手数料込みで確認しましょう。

<h3>口コミ件数の少なさ</h3>

<strong>プレミアムは利用者の生の投稿が少なめです。</strong>

知恵袋の実投稿は1件で、5chの投稿は確認できなかったからです。

知恵袋でも「評判がほとんど見つからず少し不安」という質問が投稿されています。

情報の少なさは悪評がない事実と同義ではないため、少額から試す判断も選択肢です。

<h3>カード会員規約違反のリスク</h3>

<strong>クレジットカード現金化は<span class="hutoaka">カード会員規約上の禁止行為</span>です。</strong>

カード会社の規約で「換金目的の利用」が明示的に禁止されているからです。

発覚時のリスクは利用停止・残額の一括請求・強制解約の3点。

利用は自己責任での判断が前提です。

[st-mybox title="注意ポイント" webicon="st-svg-exclamation-circle" color="#ef5350" bordercolor="#ef9a9a" bgcolor="#ffebee" borderwidth="2" borderradius="5" titleweight="bold" fontsize="" myclass="st-mybox-class" margin="25px 0 25px 0"]
<div class="maruck">
<ul>
<li>手数料差引で受取額が実質70%台まで下がる指摘あり(見積もりで確認)</li>
<li>知恵袋1件・5chなしと口コミ件数が少ない</li>
<li>現金化はカード会員規約上の禁止行為</li>
</ul>
</div>
[/st-mybox]

注意点を把握したら、口コミの実調査結果を確認しましょう。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
