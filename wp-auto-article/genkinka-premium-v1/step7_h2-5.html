<textarea readonly id="content"><h2>向いている人と向かない人</h2>

プライバシー・実質換金率・規約リスクの3点で適合性が分かれます。

具体的な人物像で整理しましょう。

<h3>利用が向く人の条件</h3>

<strong>電話や郵送物を避けて、周囲に知られず使いたい人に向きます。</strong>

メール完結・郵送物なし・在籍確認なしの体制だからです。

具体的には「仕事中に電話へ出られない人」「家族と同居で郵送物を避けたい人」を想定する利用者。

文面でやり取りを残したい慎重派にも適合します。

[st-mybox title="こんな方に向いています" webicon="st-svg-check-circle" color="#757575" bordercolor="#BDBDBD" bgcolor="#ffffff" borderwidth="2" borderradius="5" titleweight="bold" fontsize="" myclass="st-mybox-class" margin="25px 0 25px 0"]
<div class="maruck">
<ul>
<li>仕事中に電話へ出られない人・通話を避けたい人</li>
<li>家族や職場に知られず郵送物なしで使いたい人</li>
<li>やり取りを文面で残したい慎重派の人</li>
</ul>
</div>
[/st-mybox]

<h3>利用を控えるべき人の特徴</h3>

<strong>公表の80%以上をそのまま手取りと考える人には向きません。</strong>

手数料差引で実質70%台まで下がる可能性の指摘があるからです。

「電話で相談しながら進めたい人」「カードローン審査に通る属性の人」も該当します。

[st-cmemo webicon="st-svg-exclamation-circle" iconcolor="#919191" bgcolor="#fafafa" color="#000000" bordercolor="" borderwidth="" iconsize=""]該当する場合は、金利が明確な消費者金融・カードローンを選びましょう。[/st-cmemo]

利用に向くと判断した方は、申込手順を次節で確認しましょう。
