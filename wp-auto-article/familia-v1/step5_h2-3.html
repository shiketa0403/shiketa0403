<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>悪い口コミ・評判に多い3つの不満</h2>

確認できた不満は、受取額・手数料の不透明さ・本人確認の時間の3つです。

報告の内容をそのまま紹介します。

<h3>振込額に絶句という体験記事</h3>

「振込額を見て絶句した」という趣旨の批判的な体験記事があります。

表示の率と、手数料を引いた後の受取額に差が出る場合があるからです。

具体的な金額は確認できなかったものの、約20%下がる分析と方向が一致。

決済前に振込額の提示を受け、金額で判断しましょう。

<h3>手数料の内訳が不明という指摘</h3>

手数料の上乗せがあるかどうかを明示していない、という指摘があります。

公表の換金率だけでは、差し引かれる金額を事前に計算できないからです。

この不透明さは現金化業者に共通する傾向で、ファミリアも例外ではありません。

見積もりの段階で、手数料込みの振込額を数字で確かめましょう。

<h3>本人確認に時間がかかった声</h3>

「本人確認に多少時間がかかった」という軽い不満が確認できました。

初回は本人確認書類の提出と確認の工程が入るからです。

クレームと呼べるほどの悪評は見当たらないとの集計もあります。

初回の申込は、時間に余裕を見ておきましょう。

では、知恵袋や5chには実際の投稿があるのでしょうか。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
