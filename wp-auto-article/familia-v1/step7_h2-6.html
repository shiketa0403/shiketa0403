<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>スマホ申込から振込までの手順</h2>

申込はスマホで完結し、来店は不要です。

受付時間と振込対応時間の違いに注意しながら、流れを見ていきましょう。

[st-timeline myclass="st-timeline-count" add_style=""]
[st-timeline-list text="フォーム・電話で申込" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
フォームは24時間・電話は9時〜20時・受付後に見積もり提示
[/st-timeline-list]
[st-timeline-list text="本人確認・カード決済" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
初回は本人確認書類をスマホで撮影して提出し、カード決済を行う
[/st-timeline-list]
[st-timeline-list text="振込完了" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
初回最短15分・2回目以降最短5分の掲示(対応は営業時間内のみ)
[/st-timeline-list]
[/st-timeline]

<h3>フォーム・電話申込の流れ</h3>

<span class="st-mymarker-s"><strong>申込はWebフォーム(24時間)か電話(9時〜20時)で行います。</strong></span>

受付後に担当者から連絡が入り、見積もり提示に進むからです。

伝える内容は、氏名・連絡先・希望額・利用カードの4点。

提示された振込額に納得できなければ、<span class="hutoaka">この段階で断りましょう</span>。

<h3>本人確認とカード決済</h3>

<span class="st-mymarker-s"><strong>初回は本人確認書類の提出とカード決済が必要です。</strong></span>

現金化は商品売買の形式を取り、本人確認が法令上必須だからです。

運転免許証やマイナンバーカードをスマホで撮影して提出します。

決済前に、金額と商品の内容を確認しましょう。

[st-kaiwa1]初回は本人確認がある分、時間に余裕を見ておくと安心です。[/st-kaiwa1]

<h3>振込完了までの時間目安</h3>

<span class="st-mymarker-s"><strong>振込は初回最短15分・2回目以降最短5分の掲示ですが、対応は営業時間内のみです。</strong></span>

フォームの受付は24時間でも、<span class="hutoaka">振込の実行は9時〜20時に限られる</span>からです。

確認できたのは、その日のうちに受け取れたという紹介まで。

<table>
<thead><tr><th>項目</th><th>時間</th></tr></thead>
<tbody>
<tr><td>フォーム受付</td><td>24時間</td></tr>
<tr><td>電話受付</td><td>9時〜20時</td></tr>
<tr><td>振込の実行</td><td>9時〜20時(営業時間内のみ)</td></tr>
<tr><td>掲示の振込速度</td><td>初回最短15分・2回目以降最短5分</td></tr>
</tbody>
</table>

当日中に受け取りたい場合は、営業時間内の早めの申込がおすすめです。

手順を把握したら、最後に記事全体の要点を整理します。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
