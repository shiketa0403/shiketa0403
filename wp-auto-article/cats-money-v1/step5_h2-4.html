<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>知恵袋・5chのリアル口コミ</h2>

口コミは知恵袋・5ch・SNSの3経路で傾向を確認できます。

肯定的な声と否定的な声を整理して紹介します。

<h3>知恵袋の質問と回答</h3>

知恵袋では91%保証の実態に関する質問が多めです。

公式の保証表記と実際の振込額の差を気にする検索者が多いからです。

回答の多くは「初回は91%通り」「2回目以降は82〜87%」と公式表記との一致を確認する内容。

詐欺被害の集団報告は確認できません。

<h3>5chでの評価傾向</h3>

5chでは振込スピードを評価する声が目立ちます。

匿名掲示板の性質上、リアルな利用報告が集まりやすいからです。

「平日の昼間に申込んで15分で振込完了」の事例報告が複数件確認できます。

一方で「土日申込は翌営業日になった」との不満も投稿されています。

<h3>SNSでの利用報告</h3>

SNSでは画像付きの振込報告が散見されます。

利用直後の振込完了画面を投稿するユーザーが一定数いるからです。

「キャリア決済枠で現金化できた」「初回91%通りだった」の報告が見られます。

ただしSNS投稿は個別事例のため、平均的な数字とは限らない点に留意しましょう。

口コミ傾向を踏まえ、自分が利用に向くタイプかを次節で整理します。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
