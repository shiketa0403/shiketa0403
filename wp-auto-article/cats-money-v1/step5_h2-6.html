<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>スマホ申込から振込までの手順</h2>

申込はスマホで完結し、来店は不要です。

3つの工程で振込完了まで進みます。

<h3>公式フォーム入力の流れ</h3>

公式サイトのフォームから申込情報を送信します。

スマホ画面から氏名・連絡先・希望金額・利用決済情報を入力する設計だからです。

入力後はメッセージまたは電話で担当者から確認の連絡が入ります。

入力ミスがあると確認に時間がかかるため、申込前に必要情報を手元に揃えましょう。

<h3>商品購入と本人確認の進め方</h3>

指定商品の購入と本人確認書類の提出が必要です。

現金化は商品売買の形式を取り、本人確認が法令上必須だからです。

運転免許証・マイナンバーカード・健康保険証のいずれかをスマホで撮影し提出します。

書類が鮮明でない場合は再提出となるため、明るい場所で撮影しましょう。

<h3>振込完了までの時間目安</h3>

確認完了から振込まで合計15分が目安です。

申込から振込までの全工程をスマホ完結で進める設計だからです。

最も着金が早いのは平日10〜15時の申込。

15時以降や土日祝は銀行振込の都合で翌営業日扱いになる場合があります。

申込手順を把握したら、最後に記事全体の要点をまとめます。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
