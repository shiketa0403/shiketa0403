<!DOCTYPE html>

<title>買取無双 Step05 H2_3</title>

<body>
<textarea readonly id="content" style="width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word;">
<h2>悪い口コミ・評判で目立つ3つの指摘</h2>

気になる点は、率の情報のばらつき・条件の後出し・対応の評価の3つです。

いずれも申込前の確認で対処できます。

<h3>換金率の情報が媒体でばらつく</h3>

<strong>買取無双の換金率の情報は、媒体によって大きくばらついています。</strong>

80%保証の掲示に対し、88%保証や最低85%と伝える紹介が並ぶためです。

平均85〜92%という集計もあれば、75%まで下がる場合があるという紹介。

どの数字も前提にせず、査定の提示額で確かめましょう。

<h3>金額帯で率が変わった体験</h3>

<strong>「10万円以下は70%だった」という金額帯の条件に触れる体験の要旨があります。</strong>

掲示の率がすべての金額に適用されるとは限らないためです。

この体験では、83%の表示に対して実際の振込は70%だったという内容です。

自分の申込金額での適用率を、査定の返答で確認しましょう。

<h3>対応が悪いという低評価の声</h3>

<strong>「対応が悪い」「換金率が悪い」という低評価が目立つ媒体もあります。</strong>

一方で苦情はなかったとする媒体もあり、評価が割れているためです。

どちらもレビューサイト経由の情報で、元投稿の特定はできませんでした。

評価の割れは、やり取りの質を自分の査定で見極める前提で読みましょう。

ここまでの整理を踏まえて、では知恵袋や5chに生の投稿はあるのでしょうか。
</textarea>
<button id="copyBtn" style="margin-top: 10px; padding: 8px 24px; font-size: 14px; cursor: pointer;">コピー</button>

document.getElementById('copyBtn').addEventListener('click', function() {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
