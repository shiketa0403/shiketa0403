<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>注意したい3つのデメリット</h2>

メリットだけで判断すると、実勢換金率や初回の所要時間でつまずきます。

3つの注意点を事前に押さえましょう。

<h3>実勢換金率75〜90%の報告</h3>

<strong>実際の振込額は公表値より低い報告が中心です。</strong>

公表の最大98.5%はキャンペーン込みの上限で、実際は申込額と条件で変動するからです。

利用報告では「20万円で15万円(75%)」「20万円で16万円(80%)」「メルペイで90%」という実例。

<span class="hutoaka">実勢は75〜90%の前提</span>で、必要額から逆算して判断しましょう。

<h3>初回30分の本人確認</h3>

<strong>初回は本人確認があり、手続きに30分程度かかります。</strong>

買取契約に本人確認書類の提出が必須だからです。

2回目以降は省略され、本人確認後10分で振り込まれた報告もあります。

最短表記どおりの入金は、初回には期待しないでおきましょう。

<h3>後払いアプリ規約違反のリスク</h3>

<strong>後払いアプリの現金化は<span class="hutoaka">各アプリの利用規約で禁止</span>されています。</strong>

メルペイもPaidyも、換金目的の利用を規約で明示的に禁止しているからです。

発覚時のリスクはアプリの利用停止・残債の一括請求の2点。

消費者庁も後払い現金化への注意喚起を公表しており、利用は自己責任での判断が前提です。

[st-mybox title="注意ポイント" webicon="st-svg-exclamation-circle" color="#ef5350" bordercolor="#ef9a9a" bgcolor="#ffebee" borderwidth="2" borderradius="5" titleweight="bold" fontsize="" myclass="st-mybox-class" margin="25px 0 25px 0"]
<div class="maruck">
<ul>
<li>実勢換金率は75〜90%の報告あり(公表値との差に注意)</li>
<li>初回は本人確認で30分程度かかる</li>
<li>後払いアプリの現金化は利用規約上の禁止行為</li>
</ul>
</div>
[/st-mybox]

デメリットを把握したら、口コミの実調査結果を確認しましょう。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
