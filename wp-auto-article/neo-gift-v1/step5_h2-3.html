<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>注意したい3つのデメリット</h2>

つまずきやすいのは率の上限・入金時間・規約リスクの3点です。

3つの注意点を事前に押さえましょう。

<h3>80%止まりの換金率上限</h3>

高い換金率を狙う人には、80%は物足りない数字です。

90%台の最大値を掲げる他社があるからです。

「他社の方が率が高かった」という利用者の指摘も、実際に確認できる状況。

率の高さと受取額の確実さの、どちらを取るかで判断しましょう。

<h3>入金1時間超の報告</h3>

「入金までに1時間以上かかった」という報告があります。

混雑や確認の状況で、最短30分より延びる場合があるからです。

「振込までも非常に遅い」との強めの不満も5chで紹介されています。

急ぎの場合は、時間に余裕のあるタイミングで申込みましょう。

<h3>カード会員規約違反のリスク</h3>

クレジットカード現金化はカード会員規約上の禁止行為です。

カード会社の規約で「換金目的の利用」が明示的に禁止されているからです。

発覚時は利用停止・残額の一括請求・強制解約のリスクがあります。

利用は自己責任が前提と理解しておきましょう。

注意点を踏まえた上で、実際の口コミを調査した結果を確認します。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
