<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>口コミ評判の実調査結果</h2>

知恵袋・5ch・レビューサイトの3経路を実際に調査しました。

確認できた投稿と調査結果を紹介します。

<h3>知恵袋の利用者投稿</h3>

知恵袋には「比較サイトがネオギフトをやたらに高く評価している」と疑う実投稿があります。

比較サイトの評価を信用してよいか、という相談が実際に投稿されているからです。

回答本文はアクセス制限により確認できず、投稿数自体は少ない状況。

比較サイトの順位より、実投稿ベースで判断しましょう。

<h3>5chの安定評価と不満</h3>

5chでは「昔から安定」という評価と、時間・率への不満が併存しています。

「換金率も対応も悪くない」との書き込みの一方、「表記-5%」の声も紹介されているからです。

生のスレッドや書き込みは、今回の調査では直接確認できませんでした。

書き込みを鵜呑みにせず、参考情報のひとつとして扱いましょう。

<h3>レビューサイトの評価傾向</h3>

レビューサイトでは「80%保証どおりに換金できた」という好意的な評価が目立ちます。

手数料の業者負担と、料金の透明性を評価する記事が多いからです。

振り込まれない詐欺の集団報告は、調査の範囲では確認できませんでした。

口コミの実態を踏まえ、自分が利用に向くタイプかを次で整理します。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
