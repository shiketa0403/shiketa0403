<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>向いている人と向かない人</h2>

求める率・急ぎ度・規約リスクの3点で適合性が分かれます。

具体的な人物像で整理しましょう。

<h3>利用が向く人の条件</h3>

最大値の高さより、受取額の分かりやすさを重視する人に向きます。

一律80%と手数料無料で、差引後の手取りを読みやすいためです。

後払いアプリやキャリア決済を使いたい人にも合う、広い対応範囲。

深夜や休日に申込みたい人にも、24時間365日の掲示は相性が良好です。

<h3>利用を控えるべき人の特徴</h3>

90%台の換金率を求める人には向きません。

一律80%の設計で、上限が伸びないからです。

「30分以内の入金を前提にする人」「カードローン審査に通る属性の人」も該当します。

該当する場合は、金利が明確な消費者金融・カードローンを選びましょう。

利用に向くと判断した方は、申込手順を次で確認しましょう。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
