<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>悪い口コミ・評判で目立つ3つの指摘</h2>

目立つ指摘は、繁忙期の遅延・手数料・2回目以降の条件の3つです。

内容をそのまま紹介します。

<h3>繁忙期に入金が遅れたという批判</h3>

繁忙期に入金が遅れた、という批判の紹介があります。

申込が集中する時期は、処理に時間がかかるからです。

最短3分の紹介どおりに進まないケースがある状況。

急ぎの場合は、申込前に振込タイミングを聞いておきましょう。

<h3>振込手数料が有料という指摘</h3>

振込手数料が有料である点への批判があります。

率とは別に手数料が差し引かれ、手取りが目減りするからです。

一覧の率をそのまま手取りと考えると、差にがっかりしやすい構図です。

シミュレーションで、手数料込みの振込額を確認しましょう。

<h3>2回目以降は微妙という声</h3>

「初回は満足だったけど2回目以降は微妙」という声の紹介があります。

複数回の利用や高額の利用では、率が下がるケースがあるからです。

スピード重視の人向きで、率にこだわる人には不向きという整理もあります。

2回目以降も、毎回見積もりで条件を確認しましょう。

では、知恵袋や5chには実際に投稿があるのでしょうか。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
