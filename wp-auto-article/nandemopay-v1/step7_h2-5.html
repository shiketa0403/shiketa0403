<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>申込前に知るべき3つの注意点</h2>

不安の多くは、数字の読み方と情報の見分け方で小さくできます。

申込前に3つの注意点を確認しましょう。

<h3>メニュー別で75%まで変わる率</h3>

<span class="st-mymarker-s"><strong>換金率はメニュー別で、90%から75%まで幅があります。</strong></span>

バンドルカードやキャリア決済は90%、ペイディApple専用枠は80%、メルペイは75%の掲示だからです。

10万円なら、90%と75%で<span class="hutoaka">手取りに1万5000円の差</span>。

自分が使う枠の率を、一覧とシミュレーションで確認しましょう。

[st-kaiwa1 r]使う枠の率から確認するのが、このサービスの読み方です。[/st-kaiwa1]

<h3>本日の換金率という日次更新</h3>

<span class="st-mymarker-s"><strong>換金率一覧は「本日の換金率」として、日付付きで更新されます。</strong></span>

率が日々変わる前提の掲示だからです。

申込む日の一覧が、<span class="hutoaka">過去に見た率と違う場合</span>もあります。

申込直前に、その日の一覧を確認しましょう。

<h3>カード会員規約上の禁止行為</h3>

<span class="st-mymarker-s"><strong>クレジットカードや後払いアプリの現金化は、運営側が禁止している行為です。</strong></span>

カード会社の規約で「換金目的の利用」が明示的に禁止されているからです。

発覚すると、<span class="hutoaka">利用停止や強制解約</span>につながる可能性があります。

業者選び以前に、この前提を理解した上で判断しましょう。

[st-mybox title="注意ポイント" webicon="st-svg-exclamation-circle" color="#ef5350" bordercolor="#ef9a9a" bgcolor="#ffebee" borderwidth="2" borderradius="5" titleweight="bold" fontsize="" myclass="st-mybox-class" margin="25px 0 25px 0"]
<div class="maruck">
<ul>
<li>率はメニュー別に75%〜90%(枠によって差がある)</li>
<li>換金率一覧は日付付きで日々更新される</li>
<li>現金化はカード・後払いアプリ規約上の禁止行為</li>
</ul>
</div>
[/st-mybox]

注意点を押さえたところで、実際の申込手順を確認します。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
