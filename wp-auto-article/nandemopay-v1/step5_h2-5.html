<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>申込前に知るべき3つの注意点</h2>

不安の多くは、数字の読み方と情報の見分け方で小さくできます。

申込前に3つの注意点を確認しましょう。

<h3>メニュー別で75%まで変わる率</h3>

換金率はメニュー別で、90%から75%まで幅があります。

バンドルカードやキャリア決済は90%、ペイディApple専用枠は80%、メルペイは75%の掲示だからです。

10万円なら、90%と75%で手取りに1万5000円の差。

自分が使う枠の率を、一覧とシミュレーションで確認しましょう。

<h3>本日の換金率という日次更新</h3>

換金率一覧は「本日の換金率」として、日付付きで更新されます。

率が日々変わる前提の掲示だからです。

申込む日の一覧が、過去に見た率と違う場合もあります。

申込直前に、その日の一覧を確認しましょう。

<h3>カード会員規約上の禁止行為</h3>

クレジットカードや後払いアプリの現金化は、運営側が禁止している行為です。

カード会社の規約で「換金目的の利用」が明示的に禁止されているからです。

発覚すると、利用停止や強制解約につながる可能性があります。

業者選び以前に、この前提を理解した上で判断しましょう。

注意点を押さえたところで、実際の申込手順を確認します。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
