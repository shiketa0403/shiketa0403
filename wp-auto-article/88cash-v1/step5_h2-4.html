<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>口コミ評判の実調査結果</h2>

知恵袋・5ch・レビューサイトの3経路を実際に調査しました。

確認できた投稿と調査結果を紹介します。

<h3>知恵袋の利用報告</h3>

知恵袋では実際に利用した人の投稿が確認できます。

「先日、88キャッシュという現金化を利用した」という相談が投稿されているからです。

利用者の実在を示す投稿で、回答本文はアクセス制限により確認できず。

投稿数は多くないため、他の媒体とあわせて判断しましょう。

<h3>5chの調査結果</h3>

5chでは目立った悪評が見当たらないという調査結果です。

複数のレビューメディアが5chを調査し、悪い評判は特に見られなかったと報告しているからです。

ただし生のスレッドや書き込みは、今回の調査では直接確認できませんでした。

悪評がない状態を、良い評判の証拠とまでは考えないでおきましょう。

<h3>レビューサイトの両論</h3>

レビューサイトの評価は肯定と不満の両論です。

「最短8分」「対応丁寧」の一方、「74%だった」「遅い」の報告が並ぶからです。

実質換金率81〜85%という検証も複数のメディアが掲載しています。

振り込まれない詐欺の集団報告は確認できませんでした。

口コミの実態を踏まえ、自分が利用に向くタイプかを次節で整理します。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
