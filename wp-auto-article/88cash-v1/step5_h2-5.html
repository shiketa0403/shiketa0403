<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>向いている人と向かない人</h2>

申込タイミング・実質換金率・規約リスクの3点で適合性が分かれます。

具体的な人物像で整理しましょう。

<h3>利用が向く人の条件</h3>

申込日を選べて、下限保証を重視する人に向きます。

8の付く日の優遇と最低88%保証を組み合わせられるからです。

具体的には「給料日前の支払いに備えたい人」「他社からの乗り換えを検討中の人」を想定する利用者。

法人の大口調達を検討している事業者にも適合します。

<h3>利用を控えるべき人の特徴</h3>

88%をそのまま手取り額と考える人には向きません。

実質81〜85%の検証や74%だった報告があり、差が出る可能性があるからです。

「深夜に今すぐ入金してほしい人」「カードローン審査に通る属性の人」も該当します。

該当する場合は、金利が明確な消費者金融・カードローンを選びましょう。

利用に向くと判断した方は、申込手順を次節で確認しましょう。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
