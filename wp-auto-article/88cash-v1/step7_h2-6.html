<!DOCTYPE html>

<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>スマホ申込から振込までの手順</h2>

申込はスマホで完結し、来店は不要です。

キャッシュバック方式のため、商品購入の工程が入ります。

[st-timeline myclass="st-timeline-count" add_style=""]
[st-timeline-list text="フォーム・電話で申込" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
フォームは24時間受付・営業時間内に担当者から連絡が入り見積もり提示
[/st-timeline-list]
[st-timeline-list text="指定商品の購入・本人確認" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
案内された指定商品をカード決済で購入・初回は本人確認書類を提出
[/st-timeline-list]
[st-timeline-list text="振込完了" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
購入確認後に振込・最短8分の報告あり(営業8時〜18時)
[/st-timeline-list]
[/st-timeline]

<h3>フォーム・電話申込の流れ</h3>

<strong>公式サイトのフォームか電話で申込みます。</strong>

フォームは24時間受付で、営業時間内に担当者から連絡が入るからです。

氏名・連絡先・希望額・利用カードを伝え、見積もりの提示に進みます。

提示された振込額に納得できない場合は、この段階で断りましょう。

<h3>指定商品の購入と確認</h3>

<strong>案内された指定商品を、ネット上でカード決済して購入します。</strong>

商品売買を介するキャッシュバック方式のため、購入確認が振込の条件だからです。

初回は本人確認書類の提出も必要で、運転免許証やマイナンバーカードを撮影して提出。

決済前に金額と内容を確認してから進みましょう。

<h3>振込完了までの時間目安</h3>

<strong>振込は購入確認後で、最短8分の報告があります。</strong>

営業時間8時〜18時の体制で、時間帯により前後するからです。

「入金が遅かった」という不満もあるため、余裕を持った申込が無難です。

急ぎの場合は、平日の午前中に申込みましょう。

申込手順を把握したら、最後に記事全体の要点をまとめます。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
