<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>注意したい3つのデメリット</h2>

メリットだけで判断すると、営業時間や条件の限定でつまずきます。

3つの注意点を事前に押さえましょう。

<h3>営業8時〜18時の時間制限</h3>

<strong>営業時間は8時〜18時で、夜間の振込には対応していません。</strong>

申込フォームは24時間受け付けても、処理は営業時間内に行われるからです。

18時以降の申込は、翌朝8時以降の処理に回る可能性。

急ぎの場合は、平日の早い時間帯に申込みましょう。

<h3>最大98%の限定条件</h3>

<strong>最大98%は、101万円以上の申込と8の付く日が条件という解説があります。</strong>

最大値は上限側の数字で、少額・通常日の申込には適用されないからです。

一般的な10万〜20万円の申込では、最低保証の88%側を基準に考える方が現実的です。

自分の申込額でいくらになるかを、見積もりで確認しましょう。

<h3>カード会員規約違反のリスク</h3>

<strong>クレジットカード現金化は<span class="hutoaka">カード会員規約上の禁止行為</span>です。</strong>

カード会社の規約で「換金目的の利用」が明示的に禁止されているからです。

発覚時のリスクは利用停止・残額の一括請求・強制解約の3点。

公式が創業以来カード利用停止ゼロを掲げていても、利用は自己責任が前提です。

[st-mybox title="注意ポイント" webicon="st-svg-exclamation-circle" color="#ef5350" bordercolor="#ef9a9a" bgcolor="#ffebee" borderwidth="2" borderradius="5" titleweight="bold" fontsize="" myclass="st-mybox-class" margin="25px 0 25px 0"]
<div class="maruck">
<ul>
<li>営業時間は8時〜18時・夜間申込は翌朝の処理</li>
<li>最大98%は101万円以上+8の付く日の限定条件</li>
<li>現金化はカード会員規約上の禁止行為</li>
</ul>
</div>
[/st-mybox]

注意点を把握したら、口コミの実調査結果を確認しましょう。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
