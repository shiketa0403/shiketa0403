<!DOCTYPE html>
<html lang="ja">

<meta charset="UTF-8">
<title>らくらくマネー Step05 H2_2</title>

<body>
<textarea readonly id="content" style="width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word;">
<h2>良い口コミ・評判で確認できた3点</h2>

確認できた良い材料は、振込の速さ・窓口の手軽さ・受付体制の3点です。

いずれも公式サイトの掲示とレビューの紹介として整理します。

<h3>決済後10分で振込という体験</h3>

<strong>カード決済から10分後に振り込まれたという体験が紹介されています。</strong>

電話1本で即振込・最短3分の申込を打ち出しているためです。

最短5分で受け取れたと伝える紹介もあります。

実際の所要時間は状況で変わるため、見積もり時に確かめましょう。

<h3>電話1本とLINEの申込窓口</h3>

<strong>申込の窓口は、電話1本のほかWEBフォームとLINEにも対応しています。</strong>

フリーコールの番号が公式サイトに掲載されているためです。

記録を残しやすいのは、WEBフォームやLINEでの申込。

電話で聞いた条件は、文面でも受け取っておきましょう。

<h3>年中無休・全国対応の掲示</h3>

<strong>受付は年中無休で、日本全国に対応という掲示です。</strong>

土日祝の急な出費でも、申込自体は止まりません。

対応ブランドはVISA・Mastercard・JCB・AMEX・Dinersの表示です。

自分のカードが対象かは、見積もり時に確かめましょう。

一方で、良い材料だけを見て決めるのは早計です。

次は気になる指摘を確認します。
</textarea>
<button id="copyBtn" style="margin-top: 10px; padding: 8px 24px; font-size: 14px; cursor: pointer;">コピー</button>
<script>
document.getElementById('copyBtn').addEventListener('click', function() {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
