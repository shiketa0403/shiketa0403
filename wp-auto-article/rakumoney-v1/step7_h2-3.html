<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>悪い口コミ・評判で目立つ3つの指摘</h2>

気になる点は、率の開き・手数料・初回の所要時間の3つです。

いずれも申込前の確認で対処できます。

<h3>掲示と実質の率の大きな開き</h3>

<strong>掲示の91〜98%と、口コミが伝える<span class="hutoaka">実質の間には大きな開きがあります</span>。</strong>

実質は70%前後が目安と伝える紹介が複数あるためです。

高い掲示でも、実質が60〜70%台になる業者は少なくないという解説の紹介。

掲示でなく、<span class="st-mymarker-s">自分の見積もりの金額で確かめ</span>ましょう。

<h3>別途手数料が引かれる指摘</h3>

<strong>「換金率表のとおりに振り込まれず、<span class="hutoaka">別途手数料が引かれる</span>」という指摘があります。</strong>

率と手数料が分かれていると、表の数字だけでは受取額が読めません。

この指摘は口コミ・解説記事経由の内容で、金額は条件次第です。

確認すべきは率でなく、<span class="st-mymarker-s">手数料込みの振込額の1点</span>です。

[st-kaiwa1]表の率と振込額は別物。手数料込みの金額で確認ですね。[/st-kaiwa1]

<h3>初回は1時間近くかかる声</h3>

<strong>「<span class="hutoaka">初回は手続きに1時間近くかかった</span>」という声が散見されます。</strong>

最短3分の掲示は申込の入力時間で、初回は本人確認が挟まるためです。

2回目以降は早かったと伝える紹介もあります。

初回の利用日は、<span class="st-mymarker-s">時間に余裕を持って申し込み</span>ましょう。

ここまでの整理を踏まえて、では知恵袋や5chに生の投稿はあるのでしょうか。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
