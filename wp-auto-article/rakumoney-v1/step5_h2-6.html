<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>らくらくマネー Step05 H2_6</title>
</head>
<body>
<textarea readonly id="content" style="width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word;">
<h2>申込から振込までの手順</h2>

らくらくマネーの手続きは、電話・WEB・LINEの申込から始まります。

流れは申込・決済・振込の3ステップです。

<h3>電話・WEB・LINEの申込窓口</h3>

<strong>最初のステップは、電話・WEBフォーム・LINEのいずれかでの申込です。</strong>

急ぎなら電話、記録を残すならWEBやLINEという使い分けができます。

受付は年中無休の掲示。

見積もりの返答で、手数料込みの振込額を文面で確かめましょう。

<h3>見積もりとカード決済</h3>

<strong>申込後は、案内に沿ってカードのショッピング枠で決済します。</strong>

決済の確認をもって、振込の手続きに進む方式のためです。

対応はVISA・Mastercard・JCB・AMEX・Dinersの5ブランドの表示です。

自分のカードが対象かは、見積もりの返答で確かめましょう。

<h3>振込までの時間目安</h3>

<strong>振込までの時間は、決済後10分という体験の紹介があります。</strong>

即日即金を掲げ、決済確認後すぐに振込へ進むためです。

初回にかかった時間の声は、1時間近くという内容。

着金を急ぐ日は、初回の時間も見込んで動きましょう。

最後に、この記事の調査結果を整理します。
</textarea>
<button id="copyBtn" style="margin-top: 10px; padding: 8px 24px; font-size: 14px; cursor: pointer;">コピー</button>
<script>
document.getElementById('copyBtn').addEventListener('click', function() {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
