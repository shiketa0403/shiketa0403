<body>
<textarea readonly id="content" style="width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word;">
<h2>悪い口コミ・評判で目立つ3つの指摘</h2>

気になる点は、率の開き・手数料・初回の所要時間の3つです。

いずれも申込前の確認で対処できます。

<h3>掲示と実質の率の大きな開き</h3>

<strong>掲示の91〜98%と、口コミが伝える実質の間には大きな開きがあります。</strong>

実質は70%前後が目安と伝える紹介が複数あるためです。

高い掲示でも、実質が60〜70%台になる業者は少なくないという解説の紹介。

掲示でなく、自分の見積もりの金額で確かめましょう。

<h3>別途手数料が引かれる指摘</h3>

<strong>「換金率表のとおりに振り込まれず、別途手数料が引かれる」という指摘があります。</strong>

率と手数料が分かれていると、表の数字だけでは受取額が読めません。

この指摘は口コミ・解説記事経由の内容で、金額は条件次第です。

確認すべきは率でなく、手数料込みの振込額の1点です。

<h3>初回は1時間近くかかる声</h3>

<strong>「初回は手続きに1時間近くかかった」という声が散見されます。</strong>

最短3分の掲示は申込の入力時間で、初回は本人確認が挟まるためです。

2回目以降は早かったと伝える紹介もあります。

初回の利用日は、時間に余裕を持って申し込みましょう。

ここまでの整理を踏まえて、では知恵袋や5chに生の投稿はあるのでしょうか。
</textarea>
<button id="copyBtn" style="margin-top: 10px; padding: 8px 24px; font-size: 14px; cursor: pointer;">コピー</button>
<script>
document.getElementById('copyBtn').addEventListener('click', function() {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
