<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>悪い口コミ・評判に多い3つの不満</h2>

確認できた不満は、換金率の乖離・表示の条件・営業電話の3つです。

報告の内容をそのまま紹介します。

<h3>換金率67〜74%という投稿</h3>

口コミ集約サイトには、換金率67〜74%だったという投稿があります。

表示の90%〜と、実際の受取額に差が出る場合があるからです。

3件の平均で70%という、公式表示より10%以上低い集計。

決済前に振込額の提示を受け、金額で判断しましょう。

<h3>表示の率で現金化できない指摘</h3>

「ホームページに記載の換金率では現金化できない場合がある」という指摘があります。

表示の率は条件がそろった場合の上限で、手数料の内訳も事前に計算できないからです。

実勢の投稿とも方向が一致する内容です。

見積もりの段階で、手数料込みの振込額を数字で確かめましょう。

<h3>営業電話が頻繁という指摘</h3>

「営業電話を頻繁に行っている」との指摘がネット上にあります。

一度利用すると、案内の連絡が入りやすくなるという趣旨の内容だからです。

電話対応の丁寧さを評価する声と、連絡の頻度への指摘が併存しています。

案内が不要な場合は、その場ではっきり断りましょう。

では、知恵袋や5chには実際の投稿があるのでしょうか。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
