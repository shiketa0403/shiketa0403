<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>スマホ申込から振込までの手順</h2>

申込はスマホで完結し、来店は不要です。

プラン選びから振込までの流れを順に見ていきましょう。

[st-timeline myclass="st-timeline-count" add_style=""]
[st-timeline-list text="プランを選んで申込" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
安心・当日・事業支援から選び、電話(0120-836-444)かフォームで申込
[/st-timeline-list]
[st-timeline-list text="本人確認・カード決済" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
初回は本人確認書類をスマホで撮影して提出し、カード決済を行う
[/st-timeline-list]
[st-timeline-list text="振込完了" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
最短5分の掲示(報告は平均20分・15時以降の当日入金も掲示)
[/st-timeline-list]
[/st-timeline]

<h3>プラン選択から申込までの流れ</h3>

<span class="st-mymarker-s"><strong>申込は3つのプランを選び、電話(0120-836-444)かフォームから行います。</strong></span>

換金率重視なら安心プラン、急ぎなら当日プランと、目的で選ぶ設計だからです。

受付後の流れは、確認・カード決済・振込・リピートの5ステップ。

提示された振込額に納得できなければ、<span class="hutoaka">この段階で断りましょう</span>。

<h3>本人確認とカード決済</h3>

<span class="st-mymarker-s"><strong>初回は本人確認書類の提出とカード決済が必要です。</strong></span>

現金化は商品売買の形式を取り、本人確認が法令上必須だからです。

運転免許証やマイナンバーカードをスマホで撮影して提出します。

決済前に、金額と商品の内容を確認しましょう。

[st-kaiwa1]初回は本人確認がある分、時間に余裕を見ておくと安心です。[/st-kaiwa1]

<h3>振込完了までの時間目安</h3>

<span class="st-mymarker-s"><strong>振込は最短5分の掲示ですが、実際は幅があります。</strong></span>

初回の本人確認や口座の種類で、<span class="hutoaka">所要時間が前後する</span>からです。

確認できた報告は、平均20分という内容。

<table>
<thead><tr><th>項目</th><th>内容</th></tr></thead>
<tbody>
<tr><td>受付</td><td>電話(0120-836-444)・フォーム</td></tr>
<tr><td>掲示の振込速度</td><td>最短5分</td></tr>
<tr><td>確認できた報告</td><td>平均20分</td></tr>
<tr><td>当日入金</td><td>15時以降・地銀・信金も対応と掲示</td></tr>
</tbody>
</table>

当日中に受け取りたい場合は、早めの申込がおすすめです。

手順を把握したら、最後に記事全体の要点を整理します。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
