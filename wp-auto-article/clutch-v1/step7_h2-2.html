<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>良い口コミ・評判で確認できた3点</h2>

確認できた良い材料は、スピード・手数料・手続きの手軽さの3点です。

いずれもレビュー経由の紹介として整理します。

<h3>最短10分・当日振込の紹介</h3>

<span class="st-mymarker-s"><strong>振込までの時間は、最短10分という掲示です。</strong></span>

当日現金化を打ち出しており、スピードを強みにしているためです。

実際の声としても、申込から数時間で口座に振り込まれたという紹介があります。

急ぎの出費に間に合うかは、申込の時間帯もあわせて確かめましょう。

<h3>手数料0・差引なしという紹介</h3>

<span class="st-mymarker-s"><strong>手数料は0円で、消費税のような差引もないという紹介です。</strong></span>

差し引かれるのが率の分だけなら、受取額の計算を立てやすいためです。

振込手数料も業者側の負担という紹介で、差引は率の分のみ。

査定の提示額と振込額が一致するかを、申込時に確認しましょう。

[st-kaiwa1 r]手数料0で差引は率の分だけ。受取額の計算がしやすいですね。[/st-kaiwa1]

<h3>審査なしのスマホ完結</h3>

<strong>手続きは<span class="st-mymarker-s">審査なしで、スマホだけで完結</span>します。</strong>

貸金業の融資ではなく、買取方式のサービスという位置づけのためです。

受付は年中無休で、対象は18歳以上という条件の紹介があります。

必要な書類は、申込前に手元へ用意しておきましょう。

[st-mybox title="こんな方に向いています" webicon="st-svg-check-circle" color="#757575" bordercolor="#BDBDBD" bgcolor="#ffffff" borderwidth="2" borderradius="5" titleweight="bold" fontsize="" myclass="st-mybox-class" margin="25px 0 25px 0"]
<div class="maruck">
<ul>
<li>スピード重視で当日中に受け取りたい方</li>
<li>手数料の差引なしで計算したい方</li>
<li>審査なしでスマホだけで済ませたい方</li>
</ul>
</div>
[/st-mybox]

一方で、良い材料だけを見て決めるのは早計です。

次は気になる指摘を確認します。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
