<!DOCTYPE html>
<html lang="ja">

</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>申込から振込までの手順</h2>

クラッチの手続きは、公式サイトの申込フォームから始まりスマホで完結します。

手順は申込・本人確認・査定・振込の4ステップです。

[st-timeline myclass="st-timeline-count" add_style=""]
[st-timeline-list text="公式サイトの申込フォームから申込" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
[/st-timeline-list]
[st-timeline-list text="初回は本人確認書類を提出" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
[/st-timeline-list]
[st-timeline-list text="査定で振込額を確認" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
[/st-timeline-list]
[st-timeline-list text="現金のお振込み(最短10分の掲示)" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
[/st-timeline-list]
[/st-timeline]

<h3>申込フォームと受付時間</h3>

<span class="st-mymarker-s"><strong>最初のステップは、公式サイトの申込フォームからの申込です。</strong></span>

フォームに、利用したいアプリと金額を入力して送ります。

受付は<span class="hutoaka">9時から21時まで</span>・年中無休。

当日中に受け取りたい日は、早い時間に申し込みましょう。

<h3>本人確認と対応アプリ</h3>

<strong>初回は<span class="hutoaka">本人確認書類の提出が必要</span>です。</strong>

申込の次のステップに、本人確認が置かれているためです。

対象はペイディ・B/43・バンドルカード・ウルトラペイの表示で、対応は30種以上という紹介もあります。

使いたいアプリが対象かは、<span class="st-mymarker-s">査定の返答で確かめましょう</span>。

[st-kaiwa1]非対応の紹介もあるアプリは要注意。査定で最新の対応を確認しましょう。[/st-kaiwa1]

<h3>振込完了までの時間目安</h3>

<span class="st-mymarker-s"><strong>振込までの時間は、最短10分が掲示です。</strong></span>

査定と本人確認が済めば、振込の手続き自体は短時間で進むためです。

<table>
<thead><tr><th>項目</th><th>内容</th></tr></thead>
<tbody>
<tr><td>申込</td><td>フォーム(公式サイト)</td></tr>
<tr><td>受付</td><td>9:00〜21:00・年中無休</td></tr>
<tr><td>振込の目安</td><td>最短10分</td></tr>
<tr><td>初回</td><td>本人確認書類が必要</td></tr>
</tbody>
</table>

実際の声では、申込から数時間で振り込まれたという紹介。

着金を急ぐ日は、受付時間内の早めの手続きを心がけましょう。

最後に、この記事の調査結果を整理します。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
