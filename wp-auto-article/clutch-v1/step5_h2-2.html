<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>クラッチ Step05 H2_2</title>
</head>
<body>
<textarea readonly id="content" style="width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word;">
<h2>良い口コミ・評判で確認できた3点</h2>

確認できた良い材料は、スピード・手数料・手続きの手軽さの3点です。

いずれもレビュー経由の紹介として整理します。

<h3>最短10分・当日振込の紹介</h3>

<strong>振込までの時間は、最短10分という掲示です。</strong>

当日現金化を打ち出しており、スピードを強みにしているためです。

実際の声としても、申込から数時間で口座に振り込まれたという紹介があります。

急ぎの出費に間に合うかは、申込の時間帯もあわせて確かめましょう。

<h3>手数料0・差引なしという紹介</h3>

<strong>手数料は0円で、消費税のような差引もないという紹介です。</strong>

差し引かれるのが率の分だけなら、受取額の計算を立てやすいためです。

振込手数料も業者側の負担という紹介で、差引は率の分のみ。

査定の提示額と振込額が一致するかを、申込時に確認しましょう。

<h3>審査なしのスマホ完結</h3>

<strong>手続きは審査なしで、スマホだけで完結します。</strong>

貸金業の融資ではなく、買取方式のサービスという位置づけのためです。

受付は年中無休で、対象は18歳以上という条件の紹介があります。

必要な書類は、申込前に手元へ用意しておきましょう。

一方で、良い材料だけを見て決めるのは早計です。

次は気になる指摘を確認します。
</textarea>
<button id="copyBtn" style="margin-top: 10px; padding: 8px 24px; font-size: 14px; cursor: pointer;">コピー</button>
<script>
document.getElementById('copyBtn').addEventListener('click', function() {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
