<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>クラッチ Step05 H2_6</title>
</head>
<body>
<textarea readonly id="content" style="width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word;">
<h2>申込から振込までの手順</h2>

クラッチの手続きは、公式サイトの申込フォームから始まりスマホで完結します。

手順は申込・本人確認・査定・振込の4ステップです。

<h3>申込フォームと受付時間</h3>

<strong>最初のステップは、公式サイトの申込フォームからの申込です。</strong>

フォームに、利用したいアプリと金額を入力して送ります。

受付は9時から21時まで・年中無休。

当日中に受け取りたい日は、早い時間に申し込みましょう。

<h3>本人確認と対応アプリ</h3>

<strong>初回は本人確認書類の提出が必要です。</strong>

申込の次のステップに、本人確認が置かれているためです。

対象はペイディ・B/43・バンドルカード・ウルトラペイの表示で、対応は30種以上という紹介もあります。

使いたいアプリが対象かは、査定の返答で確かめましょう。

<h3>振込完了までの時間目安</h3>

<strong>振込までの時間は、最短10分が掲示です。</strong>

査定と本人確認が済めば、振込の手続き自体は短時間で進むためです。

実際の声では、申込から数時間で振り込まれたという紹介。

着金を急ぐ日は、受付時間内の早めの手続きを心がけましょう。

最後に、この記事の調査結果を整理します。
</textarea>
<button id="copyBtn" style="margin-top: 10px; padding: 8px 24px; font-size: 14px; cursor: pointer;">コピー</button>
<script>
document.getElementById('copyBtn').addEventListener('click', function() {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
