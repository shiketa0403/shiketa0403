<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>悪い口コミ・評判で目立つ3つの指摘</h2>

目立つ指摘は、換金率への不満・振込タイミング・営業時間の3つです。

内容をそのまま紹介します。

<h3>換金率70%は安すぎという声</h3>

「換金率70%くらいは安すぎ」という趣旨の声の紹介があります。

表示の最大82%を見て申し込むと、提示額との差を感じやすいからです。

実際にやってみて73%だったという検証とも重なる内容。

決済前に振込額の提示を受け、金額で判断しましょう。

<h3>即日入金は難しいという検証</h3>

「即日現金化は難しく、最短でも翌日」という検証があります。

買取型のため、商品がコウタローに届いてから振込になるケースがあるからです。

掲示の「入金速度最短10分」との差を指摘する内容です。

急ぎの場合は、振込タイミングをLINEで先に確認しましょう。

<h3>日曜定休と営業時間への不満</h3>

営業時間9時〜19時と日曜定休への不満が見受けられます。

夜間や日曜に申し込むと、対応が翌営業日扱いになるからです。

繁忙時はLINEの返事や振込が遅くなるという指摘もあります。

受付自体は24時間のため、余裕を持って申し込みましょう。

では、知恵袋や5chには実際の投稿があるのでしょうか。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
