<!DOCTYPE html>

<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>申込前に知るべき3つの注意点</h2>

「思ったより少ない」と感じる原因の多くは、表示の読み方にあります。

申込前に3つの注意点を確認しましょう。

<h3>最大82%は上限側という表示</h3>

<span class="st-mymarker-s"><strong>最大82%という表示は、ブランド別の上限側の数字です。</strong></span>

クレジットカード82%からZOZOツケ払い55%まで、<span class="hutoaka">ブランドで率が違う</span>からです。

最大98%と紹介する媒体もある表記のゆれ。

適用される率は、申込時の見積もりで確認しましょう。

<h3>会社名の記載が媒体でゆれる点</h3>

<span class="st-mymarker-s"><strong>運営会社の記載が、公式サイトとレビューで異なります。</strong></span>

公式サイトは<strong>株式会社アドバンス</strong>、一部レビューは株式会社リードと記載しているからです。

公式サイトには古物商許可(第303322518750号)の掲載があります。

会社概要は、<span class="hutoaka">申込前に自分の目で確認</span>しましょう。

[st-kaiwa1 r]迷ったときは、率や掲示より見積もりの振込額で判断するのがおすすめです。[/st-kaiwa1]

<h3>カード会員規約上の禁止行為</h3>

<span class="st-mymarker-s"><strong>クレジットカードの現金化は、業者を問わずカード会社が禁止している行為です。</strong></span>

カード会社の規約で「換金目的の利用」が明示的に禁止されているからです。

発覚した場合、<span class="hutoaka">カードの利用停止や強制退会</span>につながるリスクがあります。

業者選び以前に、この前提を理解した上で判断しましょう。

[st-mybox title="注意ポイント" webicon="st-svg-exclamation-circle" color="#ef5350" bordercolor="#ef9a9a" bgcolor="#ffebee" borderwidth="2" borderradius="5" titleweight="bold" fontsize="" myclass="st-mybox-class" margin="25px 0 25px 0"]
<div class="maruck">
<ul>
<li>最大82%はブランド別の上限側の表示(98%の紹介もあり表記ゆれ)</li>
<li>運営会社の記載が媒体でゆれる(公式は株式会社アドバンス)</li>
<li>現金化はカード会員規約上の禁止行為</li>
</ul>
</div>
[/st-mybox]

注意点を押さえたところで、実際の申込手順を確認します。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
