<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>スマホ申込から振込までの手順</h2>

申込はスマホで完結し、来店は不要です。

LINE登録から振込までの流れを順に見ていきましょう。

<h3>LINE登録から見積もりの流れ</h3>

申込はLINEアカウントの登録から始まります。

登録後に担当者へ相談し、買取金額の提示を受けてから進む流れだからです。

対応は、クレジットカードとPaidy・Kyash・atoneを含む後払いアプリ。

提示された振込額に納得できなければ、この段階で断りましょう。

<h3>指定商品の購入とスクショ提出</h3>

見積もりに納得したら、指定された商品を購入します。

現金化は商品売買(買取)の形式を取るからです。

提示されたURLから購入し、画面のスクリーンショットを提出します。

購入前に、金額と商品の内容を確認しましょう。

<h3>商品確認後の振込と時間目安</h3>

振込は、商品の確認が済んでから行われます。

買取型のため、確認のタイミングで所要時間が前後するからです。

確認できた報告は、翌日に振り込まれたという内容。

当日中に受け取りたい場合は、営業時間内の早めの申込と事前確認がおすすめです。

手順を把握したら、最後に記事全体の要点を整理します。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
