<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>スマホ申込から振込までの手順</h2>

申込はスマホで完結し、来店は不要です。

LINE登録から振込までの流れを順に見ていきましょう。

[st-timeline myclass="st-timeline-count" add_style=""]
[st-timeline-list text="LINE登録・相談" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
LINEアカウントを登録して担当者に相談し、買取金額の提示を受ける
[/st-timeline-list]
[st-timeline-list text="指定商品の購入・スクショ提出" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
提示されたURLから商品を購入し、画面のスクリーンショットを提出する
[/st-timeline-list]
[st-timeline-list text="商品確認後に振込" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
掲示は入金速度最短10分(確認できた報告は翌日振込)
[/st-timeline-list]
[/st-timeline]

<h3>LINE登録から見積もりの流れ</h3>

<span class="st-mymarker-s"><strong>申込はLINEアカウントの登録から始まります。</strong></span>

登録後に担当者へ相談し、買取金額の提示を受けてから進む流れだからです。

対応は、クレジットカードとPaidy・Kyash・atoneを含む後払いアプリ。

提示された振込額に納得できなければ、<span class="hutoaka">この段階で断りましょう</span>。

<h3>指定商品の購入とスクショ提出</h3>

<span class="st-mymarker-s"><strong>見積もりに納得したら、指定された商品を購入します。</strong></span>

現金化は商品売買(買取)の形式を取るからです。

提示されたURLから購入し、画面のスクリーンショットを提出します。

購入前に、金額と商品の内容を確認しましょう。

[st-kaiwa1]商品の確認がある分、時間には余裕を見ておくと安心です。[/st-kaiwa1]

<h3>商品確認後の振込と時間目安</h3>

<span class="st-mymarker-s"><strong>振込は、商品の確認が済んでから行われます。</strong></span>

買取型のため、確認のタイミングで<span class="hutoaka">所要時間が前後する</span>からです。

確認できた報告は、翌日に振り込まれたという内容。

<table>
<thead><tr><th>項目</th><th>内容</th></tr></thead>
<tbody>
<tr><td>受付</td><td>LINE(受付は24時間)</td></tr>
<tr><td>営業時間</td><td>9:00〜19:00(日曜定休)</td></tr>
<tr><td>掲示の入金速度</td><td>最短10分</td></tr>
<tr><td>確認できた報告</td><td>翌日に振込</td></tr>
</tbody>
</table>

当日中に受け取りたい場合は、営業時間内の早めの申込と事前確認がおすすめです。

手順を把握したら、最後に記事全体の要点を整理します。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
