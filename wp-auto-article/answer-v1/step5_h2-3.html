<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>アンサー Step05 H2_3</title>
</head>
<body>
<textarea readonly id="content" style="width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word;">
<h2>悪い口コミ・評判で目立つ3つの指摘</h2>

気になる指摘は、消費税の差引・電話対応・振込の遅れの3つです。

いずれも申込前の対処で織り込めます。

<h3>消費税上乗せという指摘</h3>

公式の率と異なり、消費税が上乗せして差し引かれたという指摘が紹介されています。

手数料0円という掲示と、実際の受取額の間に差が出たという内容のためです。

5chにも、手数料は取られる・取られないの両方の書き込みがあるという紹介があります。

確かめるべきは、率ではなく税込みの振込額。

決済前に、文面で受け取りましょう。

<h3>会社名を名乗らない電話の報告</h3>

「携帯番号から電話が来て、会社名を名乗らなかった」という報告が紹介されています。

電話中心のやり取りでは、相手の確認ができないと不安が残るためです。

会社名・代表・所在地を公式サイトで公開しているという紹介もあり、確認の材料はあります。

着信時は社名を確認し、内容は文面でも残しましょう。

<h3>月初は振込が遅れる場合あり</h3>

「振込が遅かった」という声が紹介されています。

月初は枠の更新で利用者が集中し、電話がつながりにくくなるという説明のためです。

20分程度で完了したという体験談との差は、時期と混雑によるものです。

当日中に使う予定がある日は、時間に余裕を持って申し込みましょう。

ここまでの声はレビューサイト経由の紹介が中心です。

では、知恵袋や5chに生の投稿はあるのでしょうか。
</textarea>
<button id="copyBtn" style="margin-top: 10px; padding: 8px 24px; font-size: 14px; cursor: pointer;">コピー</button>
<script>
document.getElementById('copyBtn').addEventListener('click', function() {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
