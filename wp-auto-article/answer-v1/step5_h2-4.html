<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>アンサー Step05 H2_4</title>
</head>
<body>
<textarea readonly id="content" style="width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word;">
<h2>知恵袋・5chの投稿を実際に調査</h2>

Yahoo!知恵袋と5chを実際に検索して調査しました。

名指しの投稿は、ほとんど確認できていません。

<h3>知恵袋・Xの投稿は特定できず</h3>

知恵袋とXでは、アンサーを名指しした投稿を特定できませんでした。

当方の検索に加え、レビュー媒体側も「見つけられなかった」と明記しているためです。

ヒットするのは、現金化一般の質問とレビューサイト同士の紹介記事。

「知恵袋の口コミ」と称する記事も、元の投稿を確かめてから読みましょう。

<h3>5chは80%以上確定の紹介のみ</h3>

5chについては、「80%以上確定業者」という書き込みの紹介を確認しました。

ただし当方の検索では、元のレスそのものは特定できていません。

手数料の有無について両論の書き込みがあるという紹介もあり、内容は一致していません。

元の書き込みが示されない口コミは、参考程度にとどめましょう。

生の声が少ないからこそ、申込前に押さえるべきは数字の条件と確認の手順です。
</textarea>
<button id="copyBtn" style="margin-top: 10px; padding: 8px 24px; font-size: 14px; cursor: pointer;">コピー</button>
<script>
document.getElementById('copyBtn').addEventListener('click', function() {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
