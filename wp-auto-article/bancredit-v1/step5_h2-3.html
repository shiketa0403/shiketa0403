<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>注意したい3つのデメリット</h2>

メリットだけで判断すると、手数料や営業時間でつまずきます。

3つの注意点を事前に押さえましょう。

<h3>振込手数料200円の実質負担</h3>

振込時に一律200円(税込)の手数料が差し引かれます。

買取率とは別に固定額が引かれるため、少額ほど実質率が下がるからです。

1万円申込なら「9,100円-200円=8,900円」で実質89%。

10万円申込なら「91,000円-200円=90,800円」で実質90.8%と、高額ほど目減りが小さくなります。

<h3>営業9時〜22時の時間制限</h3>

営業時間は9時〜22時で、24時間対応ではありません。

深夜の申込は翌営業開始後の対応に回るからです。

22時以降の申込は最短でも翌朝9時以降の処理です。

深夜の急ぎ調達には対応できない点を把握しておきましょう。

<h3>カード・アプリ規約違反のリスク</h3>

カード・後払いアプリの換金目的利用は各社規約上の禁止行為です。

カード会社・アプリ運営各社の規約で「換金目的の利用」が明示的に禁止されているからです。

発覚時のリスクは利用停止・残額の一括請求・強制解約の3点。

利用は自己責任での判断が前提です。

デメリットを把握したら、口コミの実調査結果を確認しましょう。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
