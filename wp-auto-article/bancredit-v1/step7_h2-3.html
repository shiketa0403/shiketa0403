<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>注意したい3つのデメリット</h2>

メリットだけで判断すると、手数料や営業時間でつまずきます。

3つの注意点を事前に押さえましょう。

<h3>振込手数料200円の実質負担</h3>

振込時に一律<strong>200円(税込)</strong>の手数料が差し引かれます。

買取率とは別に固定額が引かれるため、少額ほど実質率が下がるからです。

1万円申込なら「9,100円-200円=<strong>8,900円</strong>」で実質89%。

10万円申込なら「91,000円-200円=<strong>90,800円</strong>」で実質90.8%と、高額ほど目減りが小さくなります。

<table>
<thead><tr><th>申込額</th><th>買取額(91%)</th><th>手数料</th><th>受取額</th><th>実質率</th></tr></thead>
<tbody>
<tr><td>1万円</td><td>9,100円</td><td>200円</td><td>8,900円</td><td>89%</td></tr>
<tr><td>10万円</td><td>91,000円</td><td>200円</td><td>90,800円</td><td>90.8%</td></tr>
</tbody>
</table>

<h3>営業9時〜22時の時間制限</h3>

営業時間は<strong>9時〜22時</strong>で、<span class="hutoaka">24時間対応ではありません</span>。

深夜の申込は翌営業開始後の対応に回るからです。

22時以降の申込は最短でも翌朝9時以降の処理です。

深夜の急ぎ調達には対応できない点を把握しておきましょう。

<h3>カード・アプリ規約違反のリスク</h3>

カード・後払いアプリの換金目的利用は<strong>各社規約上の禁止行為</strong>です。

カード会社・アプリ運営各社の規約で「換金目的の利用」が明示的に禁止されているからです。

発覚時のリスクは<span class="hutoaka">利用停止・残額の一括請求・強制解約</span>の3点。

利用は自己責任での判断が前提です。

[st-mybox title="注意ポイント" webicon="st-svg-exclamation-circle" color="#ef5350" bordercolor="#ef9a9a" bgcolor="#ffebee" borderwidth="2" borderradius="5" titleweight="bold" fontsize="" myclass="st-mybox-class" margin="25px 0 25px 0"]
<div class="maruck">
<ul>
<li>カード・アプリ利用停止のリスク</li>
<li>残額の一括請求のリスク</li>
<li>強制解約のリスク</li>
</ul>
</div>
[/st-mybox]

デメリットを把握したら、口コミの実調査結果を確認しましょう。
</textarea>

document.getElementById('copyBtn').addEventListener('click', () => {
