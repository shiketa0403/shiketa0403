<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>スマホ申込から振込までの手順</h2>

申込はスマホで完結し、来店・電話確認は不要です。

3つの工程で振込完了まで進みます。

<h3>申込フォーム入力の流れ</h3>

<strong>公式サイトのフォーム</strong>から申込情報を送信します。

スマホ画面から氏名・連絡先・希望金額・利用決済情報を入力する設計だからです。

入力後は<strong>マイページ経由</strong>で手続きの案内が届きます。

入力ミスがあると確認に時間がかかるため、申込前に必要情報を手元に揃えましょう。

<h3>マイページ確認と商品購入</h3>

マイページで案内を確認し、<strong>指定商品を購入</strong>します。

現金化は商品売買の形式を取り、購入実績が振込の条件になるからです。

本人確認書類は<strong>運転免許証・マイナンバーカード・健康保険証</strong>のいずれかを提出します。

案内された手順どおりに進めれば、追加の電話連絡はありません。

<h3>振込完了までの時間目安</h3>

購入確認後、<strong>初回最短10分・2回目以降最短3分</strong>で振込されます。

申込から振込までの全工程をスマホ完結で進める設計だからです。

実際の報告は10分程度の着金と1時間程度かかった事例が混在。

<strong>月初(1〜3日)</strong>は混雑しやすいため、急ぎなら月初を避けた午前中の申込が安全です。

[st-timeline myclass="st-timeline-count" add_style=""]
[st-timeline-list text="申込フォーム入力" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]

[/st-timeline-list]
[st-timeline-list text="初回最短10分で振込" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
購入確認後、初回最短10分・2回目以降最短3分で指定口座へ振込
[/st-timeline-list]
[/st-timeline]

申込手順を把握したら、最後に記事全体の要点をまとめます。
</textarea>

document.getElementById('copyBtn').addEventListener('click', () => {
