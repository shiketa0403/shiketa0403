<textarea readonly id="content"><h2>向いている人と向かない人</h2>

買取率・手数料・規約リスクの3点で適合性が分かれます。

具体的な人物像で整理しましょう。

<h3>利用が向く人の条件</h3>

<strong>10万円前後をまとめて調達したい初回利用者</strong>に向きます。

初回91%の高率と、高額ほど手数料200円の影響が小さくなる構造だからです。

具体的には「給料日前の家賃・税金の支払い」「冠婚葬祭の急な出費」を想定する利用者。

<strong>後払いアプリ枠しか使えないケース</strong>にも対応します。

電話連絡なしで進めたい人にも適合します。

<h3>利用を控えるべき人の特徴</h3>

<strong>少額を繰り返し調達したい人</strong>には向きません。

2回目以降81%への低下と手数料200円で、<strong>実質率が下がり続ける</strong>からです。

具体的には「毎月のキャッシュフロー不足を埋めたい人」「カードローン審査に通る属性の人」を想定する利用者。

該当する場合は消費者金融・カードローンの方が安全な選択肢です。

[st-mybox title="こんな方に向いています" webicon="st-svg-check-circle" color="#757575" bordercolor="#BDBDBD" bgcolor="#ffffff" borderwidth="2" borderradius="5" titleweight="bold" fontsize="" myclass="st-mybox-class" margin="25px 0 25px 0"]

<ul>
<li>給料日前の家賃・税金の支払いを急ぎたい方</li>
<li>冠婚葬祭の急な出費を立て替えたい方</li>
<li>後払いアプリ枠しか使えない方</li>
</ul>

[/st-mybox]
