<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>まとめ</h2>

高額のクレジットカード現金化は、特典込みの実質受取額で選んだみんなの現金化が総合1位です。

10〜20万円帯の公表値なら現金化本舗の95%、安全性重視なら創業13年の和光クレジットが候補です。

50万円を超える申込では、受け入れ上限と高額帯の公表値の確認が欠かせません。

公表値と実勢の差や規約違反リスクを踏まえ、申込前に見積もりで数字を確認しましょう。

[CTA: ボタン・リンクなし(ショートコードは後から挿入)]
申込先が決まった方は、ランキングの表で条件を見比べたうえで申込みに進みましょう。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
