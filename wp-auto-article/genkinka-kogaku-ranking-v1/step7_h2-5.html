<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>まとめ</h2>

高額のクレジットカード現金化は、特典込みの実質受取額で選んだ<strong>みんなの現金化</strong>が総合1位です。

10〜20万円帯の公表値なら<strong>現金化本舗の95%</strong>、安全性重視なら創業13年の和光クレジットが候補です。

[st-mybox title="ポイント" webicon="st-svg-check-circle" color="#FFD54F" bordercolor="#FFD54F" bgcolor="#FFFDE7" borderwidth="2" borderradius="5" titleweight="bold" fontsize="" myclass="st-mybox-class" margin="25px 0 25px 0"]
<div class="maruck">
<ul>
<li>総合1位はみんなの現金化(20万円で18.4万円+特典最大3万円)</li>
<li>10〜20万円帯の公表値トップは現金化本舗の95%</li>
<li>50万円超は受け入れ上限と高額帯の公表値を先に確認</li>
<li>実勢の下振れ報告と規約違反リスクは全業者共通</li>
</ul>
</div>
[/st-mybox]

50万円を超える申込では、受け入れ上限と高額帯の公表値の確認が欠かせません。

公表値と実勢の差や規約違反リスクを踏まえ、申込前に見積もりで数字を確認しましょう。

申込先が決まった方は、ランキングの表で条件を見比べたうえで申込みに進みましょう。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
