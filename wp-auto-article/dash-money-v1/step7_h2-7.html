<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>まとめ</h2>

ダッシュマネーは<strong>最大98.5%</strong>の換金率と<strong>最短3分振込</strong>をうたう現金化サービスです。

リピーター優遇と土日祝の即日対応があり、2011年創業と紹介される運営歴もあります。

ただし最大値は101万円以上の上限で、知恵袋・5chに実投稿がない点は把握しましょう。

[st-mybox title="ポイント" webicon="st-svg-check-circle" color="#FFD54F" bordercolor="#FFD54F" bgcolor="#FFFDE7" borderwidth="2" borderradius="5" titleweight="bold" fontsize="" myclass="st-mybox-class" margin="25px 0 25px 0"]
<div class="maruck">
<ul>
<li>公表換金率は最大98.5%(101万円以上の上限値)</li>
<li>振込は最短3分・実測15分前後の報告あり</li>
<li>知恵袋・5chに実投稿なし、詐欺の集団報告も確認できず</li>
<li>現金化はカード・後払いアプリの規約上の禁止行為で自己責任</li>
</ul>
</div>
[/st-mybox]

実調査では、振り込まれない詐欺の集団報告は確認できませんでした。

レビューサイトの報告では「15分前後で入金」「見積額どおり振込」の声があります。

利用が向くと判断した方は、公式サイトで見積もりを取ってから申込みましょう。

公式サイトで最新の換金率・特典を確認したうえで申込みに進みましょう。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
