<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>注意したい3つのデメリット</h2>

判断を誤りやすいのは手数料・対応時間・規約リスクの3点です。

3つの注意点を事前に押さえましょう。

<h3>手数料20〜25%差引の解説</h3>

表示換金率とは別に、トータル20〜25%引かれるという解説があります。

手数料や振込実費が、表示の率から差し引かれる場合があるからです。

最終的な手取りは70%前後という検証もあり、公表値との差は小さくありません。

申込前に、手数料込みの振込額を見積もりで確認しましょう。

<h3>対応は9時〜20時の制限</h3>

申込フォームは24時間受付でも、対応は9時〜20時です。

見積もりや振込の処理は、対応時間内に行われるからです。

「24時間受付とあったが返事が翌朝になった」という声も確認できます。

夜間の申込は翌朝対応になる想定。

急ぎの場合は午前中に申込みましょう。

<h3>カード会員規約違反のリスク</h3>

クレジットカード現金化はカード会員規約上の禁止行為です。

カード会社の規約で「換金目的の利用」が明示的に禁止されているからです。

発覚時は利用停止・残額の一括請求・強制解約のリスクがあります。

利用は自己責任が前提と理解しておきましょう。

注意点を踏まえた上で、実際の口コミを調査した結果を確認します。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
