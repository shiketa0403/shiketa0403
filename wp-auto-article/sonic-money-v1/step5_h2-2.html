<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>利用者が感じる3つのメリット</h2>

強みは振込スピード・初回保証・キャンペーンの3点です。

申込前に把握しておくと判断がぶれません。

<h3>最短3分の振込スピード</h3>

振込は最短3分をうたい、実際に「早かった」という声があります。

決済確認後すぐに振込処理へ進む体制だからです。

「要領よく振り込んでくれた」という声の一方、実際は30分程度という解説。

時間には余裕を持って申込みましょう。

<h3>初回90%保証の下限設定</h3>

初回利用は換金率90%保証という記載があります。

最大値だけでなく、下限側の目安を示しているからです。

換金率表でも1〜10万円で91%と、少額帯の数字を明示する設計。

保証の対象が額面か手取りかは、申込前に確認しましょう。

<h3>乗り換えキャンペーンの優遇</h3>

他社からの乗り換えで、換金率が優遇されるキャンペーンがあります。

公式サイトが換金率アップの特典を明示しているからです。

「乗り換えキャンペーンを活用して満足した」という利用者の声も確認できます。

適用条件は変わる場合があるため、申込時に最新の内容を確認しましょう。

ただし、メリットの裏側には確認すべき注意点もあります。

申込前に整理しておきましょう。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
