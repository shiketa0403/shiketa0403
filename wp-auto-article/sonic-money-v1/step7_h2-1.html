<h3>最高99.2%の換金率表</h3>

<span class="st-mymarker-s"><strong>公表の換金率は91%〜最高99.2%で、金額が大きいほど率が上がる設定です。</strong></span>

初回利用は90%保証という記載もあり、申込の下限は1万円から。

99.2%をそのまま手取りと考えず、見積もりの振込額で判断しましょう。
