<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>向いている人と向かない人</h2>

申込金額・急ぎ度・規約リスクの3点で適合性が分かれます。

具体的な人物像で整理しましょう。

<h3>利用が向く人の条件</h3>

公表値でなく、見積もりの振込額で判断できる人に向きます。

表示の換金率と手取りに、差が出る場合があるためです。

10万円超のまとまった決済や、他社からの乗り換えなら率の面で有利な設計。

日中に申込める人なら、対応時間の面でも相性が良好です。

<h3>利用を控えるべき人の特徴</h3>

99.2%をそのまま手取りと考える人には向きません。

実勢は70%前後という解説があり、差が大きいからです。

「夜間に今すぐ入金してほしい人」「カードローン審査に通る属性の人」も該当します。

該当する場合は、金利が明確な消費者金融・カードローンを選びましょう。

利用に向くと判断した方は、申込手順を次で確認しましょう。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
