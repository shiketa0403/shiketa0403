<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>申込から振込までの手順</h2>

あっとマネーの手続きは、スマホのWEB申込から始まります。

流れは申込・見積もり・決済・振込の順です。

[st-timeline myclass="st-timeline-count" add_style=""]
[st-timeline-list text="WEBフォームで申込" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
[/st-timeline-list]
[st-timeline-list text="見積もり・条件を文面で確認" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
[/st-timeline-list]
[st-timeline-list text="カードのショッピング枠で決済" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
[/st-timeline-list]
[st-timeline-list text="お振込み(金額・時間帯で所要変動)" url="" myclass="" fontsize="" fontweight="bold" color="" bgcolor="" center=""]
[/st-timeline-list]
[/st-timeline]

<h3>申込と見積もりの文面確認</h3>

<span class="st-mymarker-s"><strong>最初のステップは、申込フォームの送信と見積もりの確認です。</strong></span>

提示額に納得してから進めば、受取額のずれを防げます。

確認したいのは、適用プランと実費込みの振込額。

見積もりの内容は、文面で受け取ってから決めましょう。

<h3>カード決済の手続き</h3>

<strong>見積もりに納得したら、案内に沿ってカードのショッピング枠で指定商品を決済します。</strong>

決済の確認をもって、振込の手続きに進む方式のためです。

5chの要旨では、<span class="hutoaka">勤務先や学生証の提出</span>を求められたという指摘がありました。

求められる情報の範囲は、<span class="st-mymarker-s">決済前に電話で確かめ</span>ましょう。

[st-kaiwa1]提出書類は先に確認。見積もりと一緒に文面で残すと安心です。[/st-kaiwa1]

<h3>振込までの時間目安</h3>

<span class="st-mymarker-s"><strong>掲示の最短は3分ですが、30分以下という声から5時間という体験談まで幅があります。</strong></span>

金額が大きくなるほど、振込が遅くなる傾向という解説があるためです。

<table>
<thead><tr><th>項目</th><th>内容</th></tr></thead>
<tbody>
<tr><td>申込</td><td>スマホのWEBフォーム</td></tr>
<tr><td>決済</td><td>カードのショッピング枠</td></tr>
<tr><td>振込</td><td>最短3分掲示・30分以下〜5時間の幅</td></tr>
<tr><td>提出書類</td><td>勤務先・学生証の指摘あり(要旨)</td></tr>
</tbody>
</table>

時間を左右するのは、<span class="hutoaka">利用金額と申込の時間帯</span>。

着金を急ぐ日は、余裕を持った時間に申し込みましょう。

最後に、この記事の調査結果を整理します。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
