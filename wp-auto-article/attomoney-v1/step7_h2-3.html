<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }

<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>悪い口コミ・評判で目立つ3つの指摘</h2>

気になる指摘は、実際の率・実費の差引・振込時間の3つです。

いずれも申込前の確認で対処できます。

<h3>実際は61%程度という体験談</h3>

<strong>「実際の換金率は61%程度だった」という体験談がレビュー記事に掲載されています。</strong>

94%という数字は、<span class="hutoaka">キャンペーンやクーポンを適用した最大値</span>と電話で説明されたという内容です。

掲示と受取額の差は、この業態で最も多い不満の型。

自分の条件での率は、<span class="st-mymarker-s">見積もりの金額で確かめ</span>ましょう。

<h3>実費差引で実質85%弱という試算</h3>

<strong>手数料無料の掲示でも、実質の受取りは85%弱という試算が紹介されています。</strong>

消費税や振込手数料の実費は、<span class="hutoaka">換金率とは別に差し引かれる</span>ためです。

94%のプランで計算しても、実費を引くと手元に残るのはおおよそ85%弱という内容です。

「手数料無料」と「受取額」は<span class="st-mymarker-s">分けて考え</span>ましょう。

[st-kaiwa1]手数料無料でも実費は別。見積もりは振込額の実額で見ましょう。[/st-kaiwa1]

<h3>振込に5時間かかったという声</h3>

<strong>「振込までに5時間かかった」という体験談も掲載されています。</strong>

金額が大きくなるほど、<span class="hutoaka">振込までの時間が延びる傾向</span>という解説があるためです。

「入金が遅く、詐欺かと疑った」という声も紹介されています。

当日中に使う予定がある場合は、<span class="st-mymarker-s">時間に余裕を持って申し込み</span>ましょう。

ここまでの声の多くはレビューサイト経由です。

では、知恵袋や5chに生の投稿はあるのでしょうか。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
