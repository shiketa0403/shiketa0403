<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>悪い口コミ・評判で目立つ3つの指摘</h2>

目立つ指摘は、率の差・条件の案内時期・時間の条件の3つです。

内容をそのまま紹介します。

<h3>思った換金率と違ったという相談</h3>

「思っていた換金率と違った」という相談の紹介があります。

最大90%は初回向けの上限で、金額やタイミングで変動するからです。

「詐欺ですか?」という知恵袋相談の紹介も、条件の理解不足による不満が多い印象という整理。

適用される率は、案内された振込額で確認しましょう。

<h3>条件が申込後に案内される流れ</h3>

実際の換金率や細かい条件は、申し込んでから案内される部分が多いという指摘があります。

見積もりにあたる案内が、フォーム送信後に届く流れだからです。

事前にすべての条件を把握できない点を、不安に感じる方もいます。

案内を見てから判断する前提で、申込は情報確認と割り切りましょう。

<h3>営業時間外は翌日振込という条件</h3>

15時以降や営業時間外の手続きは、振込が翌日に回ります。

振込の処理が受付時間9時〜19時の体制に依存するからです。

「振り込まれない」と感じた例の多くは、この条件が原因と整理されています。

当日中に受け取りたい場合は、時間から逆算して申し込みましょう。

では、知恵袋や5chには実際にどんな投稿があるのでしょうか。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
