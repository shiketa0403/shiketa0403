<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>申込前に知るべき3つの注意点</h2>

不安の多くは、条件の読み方と取引の進め方で小さくできます。

申込前に3つの注意点を確認しましょう。

<h3>最大90%は初回限定という変動制</h3>

<span class="st-mymarker-s"><strong>最大90%の換金率は、初回向けで利用によって変動します。</strong></span>

業界全体では70〜80%台の業者が多く、90%は上限の水準だからです。

10万円なら、90%と80%で<span class="hutoaka">手取りに1万円の差</span>。

自分に適用される率は、案内の振込額で確認しましょう。

<h3>案内後にキャンセルできる余地</h3>

<span class="st-mymarker-s"><strong>条件の案内を見てから、キャンセルすることもできます。</strong></span>

条件が申込後に確定する流れのため、案内後の判断が前提だからです。

「条件を見た後にキャンセルもできる」という紹介があります。

納得できない条件なら、<span class="hutoaka">商品の購入前に断りましょう</span>。

[st-kaiwa1 r]迷ったら購入前に止まるのが、この方式の使い方です。[/st-kaiwa1]

<h3>カード会員規約上の禁止行為</h3>

<span class="st-mymarker-s"><strong>ペイディやクレジットカードの現金化は、運営側が禁止している行為です。</strong></span>

カード会社の規約で「換金目的の利用」が明示的に禁止されているからです。

発覚すると、<span class="hutoaka">利用停止や強制解約</span>につながる可能性があります。

業者選び以前に、この前提を理解した上で判断しましょう。

[st-mybox title="注意ポイント" webicon="st-svg-exclamation-circle" color="#ef5350" bordercolor="#ef9a9a" bgcolor="#ffebee" borderwidth="2" borderradius="5" titleweight="bold" fontsize="" myclass="st-mybox-class" margin="25px 0 25px 0"]
<div class="maruck">
<ul>
<li>最大90%は初回向け・利用によって変動する</li>
<li>条件は申込後の案内で確定(購入前ならキャンセル可)</li>
<li>現金化はペイディ・カード規約上の禁止行為</li>
</ul>
</div>
[/st-mybox]

注意点を押さえたところで、実際の申込手順を確認します。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
