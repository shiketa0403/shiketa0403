<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  textarea { width: 100%; height: 600px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
</style>
</head>
<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>申込前に知るべき3つの注意点</h2>

不安の多くは、条件の読み方と取引の進め方で小さくできます。

申込前に3つの注意点を確認しましょう。

<h3>最大90%は初回限定という変動制</h3>

最大90%の換金率は、初回向けで利用によって変動します。

業界全体では70〜80%台の業者が多く、90%は上限の水準だからです。

10万円なら、90%と80%で手取りに1万円の差。

自分に適用される率は、案内の振込額で確認しましょう。

<h3>案内後にキャンセルできる余地</h3>

条件の案内を見てから、キャンセルすることもできます。

条件が申込後に確定する流れのため、案内後の判断が前提だからです。

「条件を見た後にキャンセルもできる」という紹介があります。

納得できない条件なら、商品の購入前に断りましょう。

<h3>カード会員規約上の禁止行為</h3>

ペイディやクレジットカードの現金化は、運営側が禁止している行為です。

カード会社の規約で「換金目的の利用」が明示的に禁止されているからです。

発覚すると、利用停止や強制解約につながる可能性があります。

業者選び以前に、この前提を理解した上で判断しましょう。

注意点を押さえたところで、実際の申込手順を確認します。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
});
</script>
</body>
</html>
