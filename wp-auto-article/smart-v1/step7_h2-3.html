<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>悪い口コミ・評判で目立つ3つの指摘</h2>

気になる指摘は、夜間の入金・初回の手間・透明性の3点です。

いずれも申込前の確認で対処できます。

<h3>夜間は入金が遅れるという指摘</h3>

<strong>「<span class="hutoaka">夜間の申込は入金に時間がかかる場合がある</span>」という指摘があります。</strong>

受付は年中無休でも、振込の処理は時間帯の影響を受けるためです。

急ぎの日に避けたいのは、深夜帯の申込。

着金を急ぐなら、<span class="st-mymarker-s">日中の早い時間帯に申し込みましょう</span>。

[st-kaiwa1]急ぐ日は深夜を避けて、日中の早い時間帯に申し込むのが要です。[/st-kaiwa1]

<h3>初回の本人確認という手間</h3>

<strong>初回は本人確認書類の提出が必要という手間があります。</strong>

買取型のサービスのため、初回に本人確認が求められるためです。

書類の準備に手間取ると、<span class="hutoaka">その分だけ入金も遅れます</span>。

本人確認の書類は、<span class="st-mymarker-s">申込前に手元に用意</span>しておきましょう。

<h3>LINEのみで進む透明性への不安</h3>

<strong>「LINEのみで進むことに不安を感じる」という指摘も紹介されています。</strong>

画面上のやり取りだけで進み、<span class="hutoaka">条件の全体像が見えにくい</span>と感じる人がいるためです。

不安を減らす方法は、<span class="st-mymarker-s">振込額・振込タイミングを決済前に文面で確認</span>しておくことです。

提示された条件に不明点が残るうちは、決済に進まないようにしましょう。

ここまでの声は、いずれもレビューサイト経由の紹介です。
