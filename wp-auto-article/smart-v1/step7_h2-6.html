<textarea readonly id="content"><h2>LINE申込から振込までの手順</h2>

SMARTの手続きは、スマホからの申込で完結します。

窓口が複数あり、使いやすい方法を選べます。

<h3>LINE・メール・電話の申込窓口</h3>

<span class="st-mymarker-s"><strong>申込の窓口は、LINE・メール・電話の3つです。</strong></span>

LINE完結が基本で、メールや電話でも受け付けているためです。

受付の体制は、土日祝を含む年中無休。

やり取りの記録を残したいなら、LINEかメールでの申込が向いています。

<h3>対応アプリと本人確認書類</h3>

<strong>対応するのは、<span class="st-mymarker-s">キャリア決済と後払い・プリペイドアプリ、クレジットカードの枠</span>です。</strong>

docomo・au・SoftBankのキャリア決済のほか、B/43・BANKIT・LINE Payに対応するためです。

ウルトラペイやバンドルカード系、VISA・Mastercard・JCB・AMEXのカードも対象として掲示されています。

<span class="hutoaka">初回は本人確認書類が必要</span>なため、あわせて準備しておきましょう。

[st-kaiwa1]初回は本人確認があるので、書類を先に用意すると早いですよ。[/st-kaiwa1]

<h3>振込完了までの時間目安</h3>

<span class="st-mymarker-s"><strong>振込までの時間は、最短3分が掲示の目安です。</strong></span>

「数分で振り込まれた」という声の紹介もあり、日中のスピードが評価されているためです。

ただし夜間の申込は、<span class="hutoaka">入金に時間がかかる場合がある</span>という指摘があります。

<table>
<thead><tr><th>項目</th><th>内容</th></tr></thead>
<tbody>
<tr><td>受付</td><td>年中無休(LINE・メール・電話)</td></tr>
<tr><td>振込の目安</td><td>最短3分(掲示)</td></tr>
<tr><td>夜間の申込</td><td>入金が遅れる場合あり</td></tr>
<tr><td>初回の利用</td><td>本人確認書類が必要</td></tr>
</tbody>
</table>

急ぎの日に選びたいのは、日中の早めの申込。

着金を急ぐ日は、時間に余裕を持って申し込みましょう。

最後に、この記事の調査結果を整理します。
