<!DOCTYPE html>

<body>
<button id="copyBtn">コピー</button>
<textarea readonly id="content"><h2>良い口コミ・評判で目立つ3つの声</h2>

確認できた良い声は、スピード・対応・手軽さの3点に集中しています。

いずれもレビューサイト経由の紹介です。

<h3>数分で振り込まれたという声</h3>

<strong>「数分で振り込まれた」「即日入金だった」という声が紹介されています。</strong>

公式サイトの掲示も最短3分で、<span class="st-mymarker-s">声と掲示の方向が一致している</span>ためです。

「入金がスピーディーで安心できた」という評価も挙がっています。

急ぎの利用では、この一致が前向きな材料です。

[st-kaiwa1 r]最短3分の掲示と「数分で振込」の声、方向は一致していますね。[/st-kaiwa1]

<h3>対応が丁寧だったという声</h3>

<strong>「対応が丁寧だった」という声も複数のレビューで紹介されています。</strong>

初めての現金化では不明点が多く、<span class="st-mymarker-s">案内の質が安心感を左右する</span>ためです。

問い合わせの窓口は、LINE・メール・電話の3つ。

不明点は申込前に質問し、説明の具体性を確かめましょう。

<h3>LINEで完結する手軽さの評価</h3>

<strong><span class="st-mymarker-s">LINEだけで手続きが完結する手軽さ</span>も、評価として挙がっています。</strong>

アプリの枠を使う方式のため、来店や書類郵送のような手間がないためです。

受付は年中無休で、土日祝も申し込めます。

スマホだけで進めたい人には、使いやすい方式です。

[st-mybox title="こんな方に向いています" webicon="st-svg-check-circle" color="#757575" bordercolor="#BDBDBD" bgcolor="#ffffff" borderwidth="2" borderradius="5" titleweight="bold" fontsize="" myclass="st-mybox-class" margin="25px 0 25px 0"]
<div class="maruck">
<ul>
<li>LINEだけで手続きを完結させたい方</li>
<li>振込までのスピードを重視する方</li>
<li>キャリア決済やバンドルカード系の枠を使いたい方</li>
</ul>
</div>
[/st-mybox]

一方で、良い声だけを見て決めるのは早計です。

次は目立った指摘を確認します。
</textarea>
<script>
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('content').value);
