name: METIアクセス診断（一時）

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存パッケージをインストール
        run: |
          pip install requests playwright
          playwright install chromium --with-deps

      - name: requests / Playwright で meti.go.jp にアクセス
        run: |
          python - <<'EOF'
          import requests
          try:
              r = requests.get("https://www.meti.go.jp/", timeout=20, headers={
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36"})
              print(f"requests: HTTP {r.status_code}, server={r.headers.get('Server')}, body先頭200字:")
              print(r.text[:200])
          except Exception as e:
              print(f"requests: エラー {e}")

          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              try:
                  resp = page.goto("https://www.meti.go.jp/", timeout=30000)
                  print(f"playwright: HTTP {resp.status}, title={page.title()}")
              except Exception as e:
                  print(f"playwright: エラー {e}")
              browser.close()
          EOF
