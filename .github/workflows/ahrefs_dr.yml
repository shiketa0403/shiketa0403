name: Ahrefs DR 一括チェック

# 手動トリガーのみ。Ahrefs API units を消費するため注意。
on:
  workflow_dispatch:
    inputs:
      domains:
        description: 'ドメインリスト（カンマ区切り）。空欄なら csv/domains.txt から読み込み'
        required: false
        type: string
      exclude_max:
        description: 'この DR 以下を除外（既定2 = DR2以下を除外しDR3以上を残す）'
        required: false
        default: '2'
        type: string
      test:
        description: 'true なら1件だけ投げて生レスポンス・消費unitsを確認（本番前の確認用）'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: write

jobs:
  ahrefs-dr:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ドメインリストファイルを作成
        run: |
          INPUT="${{ github.event.inputs.domains }}"
          if [ -n "$INPUT" ]; then
            echo "カンマ区切り入力からドメインリストを作成"
            echo "$INPUT" | tr ',' '\n' | sed 's/^ *//;s/ *$//' | grep -v '^$' > domains.txt
          elif [ -f csv/domains.txt ]; then
            echo "csv/domains.txt からドメインリストを読み込み"
            grep -v '^\s*#' csv/domains.txt | grep -v '^\s*$' > domains.txt
          else
            echo "ERROR: ドメインが指定されていません。入力欄にカンマ区切りで入力するか、csv/domains.txt を作成してください。"
            exit 1
          fi
          echo "=== $(wc -l < domains.txt) 件 ==="

      - name: 依存パッケージ
        run: echo "標準ライブラリのみ。追加インストール不要。"

      - name: Ahrefs DR チェック実行
        env:
          AHREFS_API_KEY: ${{ secrets.AHREFS_API_KEY }}
        run: |
          if [ -z "$AHREFS_API_KEY" ]; then
            echo "ERROR: Secret AHREFS_API_KEY が未設定です。Settings > Secrets and variables > Actions で追加してください。"
            exit 1
          fi
          if [ "${{ github.event.inputs.test }}" = "true" ]; then
            python ahrefs_dr.py domains.txt --test
          else
            python ahrefs_dr.py domains.txt \
              -o ahrefs_dr.csv \
              --passed-output ahrefs_dr_passed.csv \
              --exclude-max "${{ github.event.inputs.exclude_max || '2' }}"
          fi
        timeout-minutes: 50

      - name: 結果CSVを表示
        if: always()
        run: |
          for f in ahrefs_dr.csv ahrefs_dr_passed.csv; do
            if [ -f "$f" ]; then
              echo "=== $f ==="
              head -50 "$f"
            fi
          done

      - name: 結果CSVをリポジトリにコミット
        if: always() && github.event.inputs.test != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f ahrefs_dr.csv ] && cp ahrefs_dr.csv csv/ahrefs_dr.csv
          [ -f ahrefs_dr_passed.csv ] && cp ahrefs_dr_passed.csv csv/ahrefs_dr_passed.csv
          git add csv/ahrefs_dr.csv csv/ahrefs_dr_passed.csv 2>/dev/null || true
          # 他ワークフローと干渉しないよう post.csv は除外
          git reset -- csv/post.csv 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "変更なし（コミットなし）"
          else
            git commit -m "Ahrefs DR一括チェック結果を更新"
            git pull --rebase origin "$GITHUB_REF_NAME" || true
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
