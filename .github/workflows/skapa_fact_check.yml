name: スカパー記事の事実確認（公式ページ取得）

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'チャンネル名 / スラッグ / No（例: エムオン / m-on / 28）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  fact_check:
    runs-on: ubuntu-latest
    steps:
      - name: チェックアウト
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存ライブラリのインストール
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright python-dotenv
          python -m playwright install --with-deps chromium

      - name: 事実確認レポート生成
        env:
          CHANNEL: ${{ github.event.inputs.channel }}
        run: |
          python3 -m skapa.fact_check "${CHANNEL}"

      - name: レポートをコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f skapa/drafts/*/fact_check.md || true
          if git diff --cached --quiet; then
            echo "コミット対象なし"
          else
            git commit -m "skapa: ${{ github.event.inputs.channel }} の事実確認レポートを保存"
            git push origin HEAD:${GITHUB_REF#refs/heads/}
          fi
