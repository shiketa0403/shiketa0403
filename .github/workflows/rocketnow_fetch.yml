name: Rocketnow - 店舗データ取得 & 記事生成

on:
  workflow_dispatch:
    inputs:
      chain:
        description: 'チェーン名（例: 吉野家）'
        required: true
        default: '吉野家'
      status:
        description: '投稿ステータス'
        required: true
        default: 'draft'
        type: choice
        options:
          - draft
          - publish
      post_to_wp:
        description: 'WordPressに投稿する（falseなら記事生成のみ）'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      max_articles:
        description: '投稿する記事数の上限（0=全件）'
        required: true
        default: '1'
      exclude_slug:
        description: '除外するslug（カンマ区切り、例: suidobashi-misakicho）'
        required: false
        default: 'suidobashi-misakicho'

jobs:
  fetch-and-generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pykakasi

      - name: 店舗データ取得
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          python fetch_rocketnow_stores.py \
            --chain "${{ github.event.inputs.chain }}" \
            --output csv/rocketnow_stores.csv

      - name: 記事HTML生成
        run: |
          python generate_rocketnow_articles.py \
            --input csv/rocketnow_stores.csv \
            --output csv/rocketnow_post.csv \
            --status ${{ github.event.inputs.status }} \
            --limit ${{ github.event.inputs.max_articles }} \
            --exclude-slug "${{ github.event.inputs.exclude_slug }}"

      - name: 生成結果を確認
        run: |
          echo "=== 店舗数 ==="
          wc -l csv/rocketnow_stores.csv
          echo "=== 記事数 ==="
          wc -l csv/rocketnow_post.csv
          echo "=== 先頭3件のタイトル ==="
          python -c "
          import csv
          with open('csv/rocketnow_post.csv') as f:
              for i, row in enumerate(csv.DictReader(f)):
                  if i >= 3: break
                  print(row['title'])
          "

      - name: WordPress投稿
        if: ${{ github.event.inputs.post_to_wp == 'true' }}
        env:
          ROCKETNOW_WP_URL: ${{ secrets.ROCKETNOW_WP_URL }}
          ROCKETNOW_WP_USERNAME: ${{ secrets.ROCKETNOW_WP_USERNAME }}
          ROCKETNOW_WP_APP_PASSWORD: ${{ secrets.ROCKETNOW_WP_APP_PASSWORD }}
        run: |
          python3 << 'PYEOF'
          import os
          site_url = os.environ.get('ROCKETNOW_WP_URL', '').rstrip('/')
          username = os.environ.get('ROCKETNOW_WP_USERNAME', '')
          app_password = os.environ.get('ROCKETNOW_WP_APP_PASSWORD', '')
          if not site_url or not username or not app_password:
              print("ERROR: ROCKETNOW_WP_URL / ROCKETNOW_WP_USERNAME / ROCKETNOW_WP_APP_PASSWORD が未設定です")
              exit(1)
          with open('wp_config.py', 'w') as f:
              f.write(f'''WP_CONFIG = {{
              "site_url": "{site_url}",
              "username": "{username}",
              "app_password": "{app_password}",
          }}
          ''')
          print(f"wp_config.py を生成しました (site: {site_url})")
          PYEOF

          python wp_bulk_post.py csv/rocketnow_post.csv --status ${{ github.event.inputs.status }}

      - name: CSVをアーティファクトとして保存
        uses: actions/upload-artifact@v4
        with:
          name: rocketnow-${{ github.event.inputs.chain }}-${{ github.run_number }}
          path: |
            csv/rocketnow_stores.csv
            csv/rocketnow_post.csv
          retention-days: 30
